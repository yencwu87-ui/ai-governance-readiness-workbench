    MAS: ''
    ISO_42001: A.2.2; A.2.3; A.2.4
    NIST_AI_RMF: GOVERN 1.2; GOVERN 1.4; GOVERN 4.1
    MGF_SAFR: ''
    CSA_PA: PA 2
  testing:
    design:
    - 1) Inspect the AI policy and guiding-principles document and approval/version
      history. 2) Confirm it covers fair, ethical, accountable and transparent AI
      use, scope, prohibited/controlled uses, roles and escalation. 3) Confirm the
      policy is linked to relevant lifecycle controls and is reviewed on a defined

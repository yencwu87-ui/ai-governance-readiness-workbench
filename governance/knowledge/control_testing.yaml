- control_id: M1.1
  framework: MAS
  title: Board & senior management accountability for AI risk (risk appetite, framework
    approval)
  requirement_basis: Senior management and the accountable AI governance body establish
    and maintain AI-risk accountability, approve the AI risk framework and appetite,
    and retain material AI-risk decision rights.
  objective: Board & senior management accountability for AI risk (risk appetite,
    framework approval)
  owner: AI Risk Cttee / Senior Mgmt
  evidence_artifacts:
  - Board mandate
  - approved framework
  linked_play: []
  crosswalks:
    MAS: ''
    ISO_42001: A.2.2; A.3.2
    NIST_AI_RMF: GOVERN 1.1; GOVERN 2.3
    MGF_SAFR: ''
    CSA_PA: PA 2, PA 6
  testing:
    design:
    - 1) Inspect the Board mandate/risk governance charter, AI risk framework and
      approval records. 2) Confirm the documents assign Board/senior-management accountability,
      define risk appetite/tolerance oversight, and specify decisions reserved for
      escalation/approval. 3) Confirm reporting cadence, materiality thresholds and
      evidence-retention responsibilities are defined. PASS when accountability, decision
      rights and reporting are formally approved and current; FAIL when any material
      accountability or approval boundary is missing/ambiguous; NOT TESTABLE when
      the authoritative governance artefacts cannot be obtained.
    operating:
    - 1) Obtain the latest 12 months of AI risk reporting and Board/AI Risk Committee
      minutes, plus a risk-based sample of material AI approvals or risk acceptances.
      2) Trace material issues, breaches and high-risk use cases to an accountable
      senior-management/Board decision. 3) Verify decisions, actions and overdue items
      were recorded and followed up. PASS when the approved governance model operated
      on schedule and material matters were escalated/decided; FAIL when required
      oversight, decisions or follow-up did not occur; NOT TESTABLE when records are
      unavailable.
    play_steps: []
    source_status: human_authored_draft
    source_notes: ToD/ToE procedure copied from the governed playbook workbook; authority
      requires explicit approval.
  provenance:
    source_file: data/AI_Governance_Playbook_MGF_SAFR_v0.5.1_contracts.xlsx
    source_sheet: Control Library - MAS
    source_control_id: M1.1
    source_status: human_authored_draft
    testing_fields: 'P: Test of Design; Q: Test of Operating Effectiveness'
  authority_tier: example

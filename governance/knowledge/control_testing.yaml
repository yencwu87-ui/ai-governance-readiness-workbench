- control_id: A.3.3
  framework: ISO42001
  title: Reporting of concerns
  requirement_basis: Provide a reporting channel (anonymous/confidential where appropriate,
    protected from reprisal) for staff, contractors and external parties to raise
    concerns about AI, with defined investigation and escalation.
  objective: ''
  owner: AI Risk (2nd line)
  evidence_artifacts: []
  linked_play:
  - Play 6
  crosswalks:
    MAS: ''
    ISO_42001: ''
    NIST_AI_RMF: ''
    MGF_SAFR: ''
    CSA_PA: ''
  testing:
    design:
    - 'Confirm the control has a named accountable owner: AI Risk (2nd line).'
    - Confirm the requirement/objective is documented and scoped to the relevant system,
      process, or programme.
    - Confirm the linked playbook/runbook defines a repeatable procedure and explicit
      exit gate for this control.
    operating:
    - 'Verify operation of Play 6 Step 1: Detect and log the incident; record time,
      system, symptoms, initial impact. Evidence expected: Incident ticket.'
    - 'Verify operation of Play 6 Step 2: Triage severity and classify; convene responders.
      Evidence expected: Severity classification.'
    - 'Verify operation of Play 6 Step 3: Contain: disengage / rollback / activate
      kill-switch; isolate affected components. Evidence expected: Containment record.'
    - 'Verify operation of Play 6 Step 4: Assess against the FSM-N05 (TRM) “relevant
      incident” threshold — severe/widespread operational impact, or material customer-service
      impact. If met: notify MAS within 1 HOUR of discovery (BCM hotline) and submit
      root-cause & impact report within 14 DAYS. Notify internal stakeholders in parallel.
      Evidence expected: MAS notification (≤1 hr); RCA & impact report (≤14 days);
      stakeholder notification log.'
    - 'Verify operation of Play 6 Step 5: Root-cause analysis; remediate; verify fix.
      Evidence expected: RCA & remediation.'
    - 'Verify operation of Play 6 Step 6: Post-incident review; update controls, tests
      and playbook. Evidence expected: Post-incident review.'
    - 'Verify observed operation addresses the control requirement: Provide a reporting
      channel (anonymous/confidential where appropriate, protected from reprisal)
      for staff, contractors and external parties to raise concerns about AI, with
      defined investigation and escalation..'
    - Check for exceptions, failures, overdue actions, or contradictory records and
      verify they were dispositioned under the applicable process.
    - Where cadence or event triggers apply, verify the sample falls within the required
      cadence/trigger window.
    play_steps:
    - play: Play 6
      step: Step 1
      owner: Whoever detects
      action: Detect and log the incident; record time, system, symptoms, initial
        impact.
      evidence: Incident ticket
    - play: Play 6
      step: Step 2
      owner: AI Risk + Model Owner
      action: Triage severity and classify; convene responders.
      evidence: Severity classification
    - play: Play 6
      step: Step 3
      owner: Model Owner + InfoSec
      action: 'Contain: disengage / rollback / activate kill-switch; isolate affected
        components.'
      evidence: Containment record
    - play: Play 6
      step: Step 4
      owner: Compliance & Legal
      action: 'Assess against the FSM-N05 (TRM) “relevant incident” threshold — severe/widespread
        operational impact, or material customer-service impact. If met: notify MAS
        within 1 HOUR of discovery (BCM hotline) and submit root-cause & impact report
        within 14 DAYS. Notify internal stakeholders in parallel.'
      evidence: MAS notification (≤1 hr); RCA & impact report (≤14 days); stakeholder
        notification log
    - play: Play 6
      step: Step 5
      owner: Model Developer + AI Risk
      action: Root-cause analysis; remediate; verify fix.
      evidence: RCA & remediation
    - play: Play 6
      step: Step 6
      owner: AI Risk Committee
      action: Post-incident review; update controls, tests and playbook.
      evidence: Post-incident review
    source_status: draft_derived
    source_notes: Drafted from workbook control row, declared evidence, requirement/objective
      and linked playbook steps; workbook test fields were blank.

- control_id: A.2.4
  framework: ISO42001
  title: Review of the AI policy
  requirement_basis: Review the AI policy on a planned cycle and whenever something
    material changes (new regulation, new use case, incident lessons) to confirm continued
    fitness and management support.
  objective: ''
  owner: AI Risk Cttee / Compliance
  evidence_artifacts: []
  linked_play:
  - Play 8
  crosswalks:
    MAS: ''
    ISO_42001: ''
    NIST_AI_RMF: ''
    MGF_SAFR: ''
    CSA_PA: ''
  testing:
    design:
    - 'Confirm the control has a named accountable owner: AI Risk Cttee / Compliance.'
    - Confirm the requirement/objective is documented and scoped to the relevant system,
      process, or programme.
    - Confirm the linked playbook/runbook defines a repeatable procedure and explicit
      exit gate for this control.
    operating:
    - 'Verify operation of Play 8 Step 1: Re-run materiality assessment; confirm risk
      tier still correct. Evidence expected: Updated materiality.'
    - 'Verify operation of Play 8 Step 2: Re-validate model; review monitoring history
      and drift since last review; re-run the FEAT assessment (fairness drift F1,
      transparency F4) per cadence — annual for high-materiality, plus event-driven.
      Evidence expected: Re-validation report.'
    - 'Verify operation of Play 8 Step 3: Refresh impact assessment for any context/regulatory
      changes. Evidence expected: Updated impact assessment.'
    - 'Verify operation of Play 8 Step 4: Decide: re-approve, require changes, or
      retire. Evidence expected: Committee decision.'
    - 'Verify observed operation addresses the control requirement: Review the AI
      policy on a planned cycle and whenever something material changes (new regulation,
      new use case, incident lessons) to confirm continued fitness and management
      support..'
    - Check for exceptions, failures, overdue actions, or contradictory records and
      verify they were dispositioned under the applicable process.
    - Where cadence or event triggers apply, verify the sample falls within the required
      cadence/trigger window.
    play_steps:
    - play: Play 8
      step: Step 1
      owner: AI Risk
      action: Re-run materiality assessment; confirm risk tier still correct.
      evidence: Updated materiality
    - play: Play 8
      step: Step 2
      owner: Independent Validation
      action: Re-validate model; review monitoring history and drift since last review;
        re-run the FEAT assessment (fairness drift F1, transparency F4) per cadence
        — annual for high-materiality, plus event-driven.
      evidence: Re-validation report
    - play: Play 8
      step: Step 3
      owner: Model Owner
      action: Refresh impact assessment for any context/regulatory changes.
      evidence: Updated impact assessment
    - play: Play 8
      step: Step 4
      owner: AI Risk Committee
      action: 'Decide: re-approve, require changes, or retire.'
      evidence: Committee decision
    source_status: draft_derived
    source_notes: Drafted from workbook control row, declared evidence, requirement/objective
      and linked playbook steps; workbook test fields were blank.

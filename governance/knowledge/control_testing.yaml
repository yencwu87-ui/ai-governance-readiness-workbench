- control_id: M3.11
  framework: MAS
  title: Incident management & escalation
  requirement_basis: AI incidents have an AI-specific classification, escalation and
    recovery process with accountable responders, records and applicable external
    notification paths.
  objective: Incident management & escalation
  owner: Model Owner + InfoSec
  evidence_artifacts:
  - Incident playbook
  linked_play:
  - Play 6
  crosswalks:
    MAS: ''
    ISO_42001: A.3.3; A.8.4
    NIST_AI_RMF: GOVERN 4.3; MEASURE 3.3; MANAGE 4.3
    MGF_SAFR: ''
    CSA_PA: PA 10
  testing:
    design:
    - 1) Inspect the AI incident playbook, severity taxonomy, escalation matrix and
      regulatory-notification procedure. 2) Confirm roles, containment, evidence preservation,
      root-cause analysis, customer/stakeholder communications, lessons learned and
      notification decision criteria are defined, including reference to the currently
      applicable MAS notice/licence obligations. 3) Confirm required response/reporting
      timelines are explicit where applicable. PASS when the incident design is complete,
      attributable and time-bound; FAIL when material response or notification decisions
      are undefined; NOT TESTABLE when no controlled incident process exists.
    operating:
    - 1) Select a sample of AI incidents/near misses and trace detection, logging,
      severity classification, escalation, containment, notification decision, RCA
      and remediation. 2) Verify timestamps against applicable internal and regulatory
      timelines and confirm reasons for any non-notification decision. 3) Inspect
      whether lessons learned updated controls/tests where appropriate. PASS when
      incidents were handled, escalated and closed under the playbook and applicable
      regulatory obligations; FAIL when material response/notification steps were
      missed; NOT TESTABLE when incident records are absent or incomplete.
    play_steps:
    - play: Play 6
      step: Step 1
      owner: Whoever detects
      action: Detect and log the incident; record time, system, symptoms, initial
        impact.
      evidence: Incident ticket
    - play: Play 6
      step: Step 2
      owner: AI Risk + Model Owner
      action: Triage severity and classify; convene responders.
      evidence: Severity classification
    - play: Play 6
      step: Step 3
      owner: Model Owner + InfoSec
      action: 'Contain: disengage / rollback / activate kill-switch; isolate affected
        components.'
      evidence: Containment record
    - play: Play 6
      step: Step 4
      owner: Compliance & Legal
      action: 'Assess against the FSM-N05 (TRM) “relevant incident” threshold — severe/widespread
        operational impact, or material customer-service impact. If met: notify MAS
        within 1 HOUR of discovery (BCM hotline) and submit root-cause & impact report
        within 14 DAYS. Notify internal stakeholders in parallel.'
      evidence: MAS notification (≤1 hr); RCA & impact report (≤14 days); stakeholder
        notification log
    - play: Play 6
      step: Step 5
      owner: Model Developer + AI Risk
      action: Root-cause analysis; remediate; verify fix.
      evidence: RCA & remediation
    - play: Play 6
      step: Step 6
      owner: AI Risk Committee
      action: Post-incident review; update controls, tests and playbook.
      evidence: Post-incident review
    source_status: human_authored_draft

- control_id: F1
  framework: MAS
  title: Fairness — AIDA decisions do not systematically disadvantage individuals/groups
  requirement_basis: For AI-assisted decisions that may materially affect people,
    fairness is assessed using appropriate methods and results are acted upon before
    deployment and after material change or drift.
  objective: Fairness — AIDA decisions do not systematically disadvantage individuals/groups
  owner: Compliance
  evidence_artifacts:
  - Fairness Assessment Report (Veritas 3A)
  - fairness-metric results vs thresholds
  linked_play:
  - Play 2, 3, 4, 5, 8
  crosswalks:
    MAS: ''
    ISO_42001: A.5.4; A.7.4
    NIST_AI_RMF: MEASURE 2.11
    MGF_SAFR: ''
    CSA_PA: —
  testing:
    design:
    - 1) Inspect the fairness assessment standard and FEAT-aligned methodology. 2)
      Confirm it defines affected groups, relevant fairness dimensions/metrics, thresholds,
      dataset/population requirements, mitigation and independent validation for high-materiality
      use cases. 3) Confirm event-driven reassessment triggers for drift/material
      change are defined. PASS when the design can detect and manage systematic disadvantage
      for the intended decision context; FAIL when material groups/metrics/thresholds
      or mitigation are omitted; NOT TESTABLE when no approved fairness method exists.
    operating:
    - 1) For the sampled AIDA/use-case population, inspect the latest fairness results
      against approved thresholds and relevant groups. 2) Verify breaches/near-breaches
      triggered mitigation, escalation or restricted use and that re-testing occurred
      after material change/drift. 3) Trace any complaints or observed disparities
      to investigation and remediation. PASS when fairness performance is measured,
      thresholded and acted upon in operation; FAIL when systematic disadvantage is
      evidenced without effective response; NOT TESTABLE when the relevant population
      or metrics cannot be verified.
    play_steps:
    - play: Play 2
      step: Step 1
      owner: Model Owner + AI Risk
      action: 'Identify affected individuals/groups and analyse impact (fairness).
        Trigger the FEAT assessment per the FEAT Assessment Methodology (Veritas):
        Ethics & Accountability (F2/F3) set at org level, Fairness (F1) and Transparency
        (F4) run concurrently for the use case. For high-materiality use cases, initiate
        independent validation.'
      evidence: Impact analysis
    - play: Play 2
      step: Step 2
      owner: DPO
      action: Complete privacy impact assessment (DPIA) where personal data is involved.
      evidence: DPIA
    - play: Play 2
      step: Step 3
      owner: Model Owner
      action: Document foreseeable misuse, predictable failure modes and proposed
        mitigations.
      evidence: Failure-mode register
    - play: Play 2
      step: Step 4
      owner: AI Risk
      action: Assess societal/environmental impact for material or public-facing systems.
      evidence: Societal-impact note
    - play: Play 2
      step: Step 5
      owner: AI Risk Committee
      action: Review and sign off the impact assessment; record residual risk.
      evidence: Signed impact assessment

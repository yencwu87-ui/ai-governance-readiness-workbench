- control_id: M3.12
  framework: MAS
  title: Change management
  requirement_basis: AI and model changes are controlled through documented impact
    assessment, testing, approval and traceability from change request through implementation
    and post-implementation verification.
  objective: Change management
  owner: Model Owner + InfoSec
  evidence_artifacts:
  - Change records
  linked_play:
  - Play 8
  crosswalks:
    MAS: ''
    ISO_42001: A.6.2.2; A.6.2.6
    NIST_AI_RMF: MANAGE 2.2; MANAGE 4.2
    MGF_SAFR: ''
    CSA_PA: PA 5
  testing:
    design:
    - 1) Inspect the AI change-management policy and change taxonomy. 2) Confirm changes
      are categorised by materiality and require impact assessment, testing/validation,
      approval, implementation recording, rollback/emergency handling and post-implementation
      verification as applicable. 3) Confirm separation of requester/approver, version
      traceability and retrospective approval rules for emergency changes. PASS when
      the design covers the full change lifecycle and prevents uncontrolled deployment;
      FAIL when material changes can bypass assessment/approval/testing; NOT TESTABLE
      when no controlled change process exists.
    operating:
    - 1) Use the authoritative change-register population for the review period. 2)
      Check population integrity (unique IDs, completeness, required fields) and sample
      changes across materiality tiers. 3) For each sample, verify approval occurred
      before implementation, tested/versioned artefact matches deployment, emergency
      changes followed the exception path, and post-implementation verification was
      recorded. PASS when sampled and population-level checks support effective change
      control; FAIL when duplicate/stale/incomplete records or approval-after-deployment
      undermine control effectiveness; NOT TESTABLE when the source population is

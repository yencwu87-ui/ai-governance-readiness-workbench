    - 1) Inspect model-card, explainability and transparency standards. 2) Confirm
      they define intended audience, material limitations, input/output characteristics,
      explanation approach, known failure modes and update triggers. 3) Confirm requirements
      are proportionate to the use case/materiality and support affected-stakeholder
      understanding. PASS when transparency design is documented, audience-specific
      and maintained through change; FAIL when material limitations/explanation requirements
      are absent; NOT TESTABLE when no controlled transparency artefact exists.
    operating:
    - 1) Sample model cards and a corresponding set of actual outputs/use cases. 2)
      Verify explanations/disclosures are consistent with the deployed model/version,
      appropriate to stakeholder needs and available where required. 3) Inspect changes/releases
      for timely updates to transparency artefacts. PASS when operating disclosures
      and explanations match the approved system and are kept current; FAIL when users
      receive materially inaccurate/outdated information; NOT TESTABLE when actual
      output/disclosure evidence is unavailable.

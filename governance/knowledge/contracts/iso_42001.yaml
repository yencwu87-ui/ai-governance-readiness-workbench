- framework: ISO42001
  control_id: A.6.1.2
  title: Objectives for responsible development of AI system
  requirement: Set clear responsible-development objectives (fairness, transparency, robustness, privacy, safety) and bake them into development
    as measurable design inputs teams are accountable to.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: A named body or role holds an approved mandate covering Objectives for responsible development of AI system
    scope: model
  - id: e2
    text: The mandate states which decisions are reserved to that body and cannot be delegated
    scope: model
  - id: e3
    text: Membership, quorum and cross-functional representation are defined
    scope: model
  - id: e4
    text: Reporting inputs, cadence and escalation thresholds are defined
    scope: model
  - id: e5
    text: Decisions taken under the mandate are recorded with a named decision-maker and date
    scope: model
  - id: e6
    text: Actions arising are tracked to closure or formal acceptance
    scope: model
  boundary:
    none: no approved mandate, or a mandate that names no accountable body and no reserved decisions.
    partial: an approved mandate exists but one or more of decision rights, quorum, cadence or escalation thresholds is absent, or the body exists
      but material decisions are not traceable to it.
    full: mandate, reserved decision rights and reporting are approved and current, and material decisions in the period are attributable to the
      body with actions tracked.
  owner: Model Developer / Indep. Validation
  expected_evidence: []
  linked_play: []
  crosswalk: []
  population_and_evidence_floor: 'Population: every meeting or reserved decision in the review period, established from the governance calendar
    or decision register. Evidence floor: fewer than 3 meetings or fewer than 1 material decision available to inspect makes the operating result
    NOT TESTABLE rather than a PASS.'
  test_of_design:
  - id: D1
    text: Obtain the approved terms of reference, mandate or charter covering Objectives for responsible development of AI system, with its approval
      record and version history.
  - id: D2
    text: Confirm the mandate names the accountable role or body, its membership and quorum, and the decisions reserved to it rather than delegated
      to a model, a vendor or the delivery team.
  - id: D3
    text: Confirm reporting inputs, cadence, materiality thresholds for escalation and evidence-retention responsibilities are stated, not implied.
  - id: D4
    text: Confirm the mandate is current — reviewed within its stated cycle, and updated for any material change in AI scope since approval.
  - id: s5
    text: 'Design verdict: ADEQUATE only when D1-D3 all hold. PARTIALLY ADEQUATE when D1 holds and one of D2-D3 is incomplete. INADEQUATE when
      decision rights or accountability cannot be located. NOT TESTABLE when the authoritative mandate is not produced — absence of the artefact
      from the evidence pack is not a design failure until its absence is confirmed by the owner.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: all meetings, decisions or approvals falling under the mandate in the review period. Establish the population
      from the calendar or register, not from the minutes supplied.'
  - id: O2
    text: Sample at least three meetings including every meeting at which a high-materiality matter was decided. Verify attendance against quorum.
  - id: O3
    text: 'Reperform: trace each sampled material AI matter to a recorded decision, a named decision-maker and a dated action, then trace open
      actions to closure or formal acceptance.'
  - id: O4
    text: Inspect any period in which the cadence was missed and the disposition of that gap.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when the body met at cadence, decided the material matters in scope, and actions were tracked. PARTIALLY
      EFFECTIVE when it operated but decisions or follow-up are incomplete. INEFFECTIVE when material matters bypassed the body. NOT TESTABLE
      when the population cannot be established.'
  near_miss_failure_modes:
  - F1. Minutes record attendance and papers tabled but no decision — the body was informed rather than deciding.
  - F2. The material decision was taken outside the body and ratified afterwards, with the ratification date after the go-live date.
  - F3. Quorum was not met at the meeting where the reserved decision was taken, and the minutes do not record it.
  - F4. Actions carry an owner but no due date, and the same actions reappear across consecutive meetings without disposition.
  - F5. The mandate is approved but predates the AI scope it is claimed to cover — for example approved before agentic use cases existed.
  resolutions:
  - failure_mode: F1
    text: A minuted decision with the decision wording, the decision-maker and the date.
  - failure_mode: F2
    text: Evidence that the approval preceded the deployment, or an approved retrospective risk acceptance naming the exposure.
  - failure_mode: F3
    text: An attendance record showing quorum, or a documented out-of-cycle approval route.
  - failure_mode: F4
    text: An action log with owner, due date and closure evidence or a formal acceptance.
  - failure_mode: F5
    text: A mandate version approved after the scope change, or a scope addendum with its own approval.
  test_provenance: 'Archetype: governance_body — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: ISO42001
  control_id: A.6.1.3
  title: Processes for responsible design and development of AI systems
  requirement: 'Document the actual steps for responsible design/build: life cycle stages, testing requirements, human oversight, training-data
    rules, release criteria, approvals, change control and stakeholder engagement.'
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: An approved change or release procedure covering Processes for responsible design and development of AI systems exists
    scope: model
  - id: e2
    text: The record captures model, prompt, tool and data-configuration versions
    scope: model
  - id: e3
    text: Approval is required and recorded before implementation
    scope: model
  - id: e4
    text: The approver is authorised for the change class and is not the implementer
    scope: model
  - id: e5
    text: An emergency route exists with eligibility criteria and a retrospective approval window
    scope: model
  - id: e6
    text: A rollback plan is required and recorded
    scope: model
  - id: e7
    text: Post-implementation verification confirms the running state matches what was approved
    scope: model
  boundary:
    none: no change control over the AI artefacts, or production changes with no record.
    partial: change records exist but approval timing, approver authority, artefact versioning or post-implementation verification is not evidenced.
    full: every deployment reconciles to a record approved in advance by an authorised, independent approver, with the artefact versions named
      and the deployed state verified.
  owner: Model Developer / Indep. Validation
  expected_evidence: []
  linked_play: []
  crosswalk: []
  population_and_evidence_floor: 'Population: all production deployments in the period, established from the deployment pipeline or runtime history.
    Evidence floor: a population taken only from the change register cannot detect unrecorded change — report NOT TESTABLE for completeness in
    that case.'
  test_of_design:
  - id: D1
    text: Obtain the change or release procedure covering Processes for responsible design and development of AI systems — change classes, required
      approvals per class, testing gates and the record fields captured.
  - id: D2
    text: 'Confirm the record captures the AI-specific artefacts that change behaviour: model version, prompt or system-instruction version, tool
      or data-source configuration, and retrieval corpus where applicable.'
  - id: D3
    text: Confirm approval must precede implementation, and who may approve each class. Confirm the emergency route, its eligibility criteria
      and its retrospective approval window.
  - id: D4
    text: Confirm the rollback or reversion plan requirement and how it is validated.
  - id: D5
    text: Confirm post-implementation verification — that what is running is what was approved.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when the procedure exists but omits AI-specific artefacts or post-implementation
      verification. INADEQUATE when approval is not required before implementation. NOT TESTABLE when the procedure is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population from the deployment source — the pipeline, release log or runtime history — not from the change register, so changes
      made without a record can be found.
  - id: O2
    text: Reconcile deployments to change records. Every deployment with no record is a finding.
  - id: O3
    text: Sample changes across classes including at least one emergency and one model or prompt version change. Compare approval timestamp to
      implementation timestamp.
  - id: O4
    text: Verify the approver was authorised for the class and is not the implementer.
  - id: O5
    text: Trace a sample to post-implementation verification, and any backed-out change to its rollback record.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when deployments reconcile to approved records, approvals precede implementation and verification occurred.
      PARTIALLY EFFECTIVE when records exist but timing, approver authority or verification is incomplete. INEFFECTIVE when unrecorded or unapproved
      production changes are found. NOT TESTABLE when the deployment population cannot be established independently.'
  near_miss_failure_modes:
  - F1. Approval timestamp is after the deployment timestamp — the record documents the change rather than authorising it.
  - F2. The approver is the implementer, or sits outside the approval matrix for that class.
  - F3. The emergency route carries a material share of all changes, with no incident reference behind them.
  - F4. The change names the service but not the model or prompt version, so the artefact that actually changed is invisible.
  - F5. A change freeze was in force and the change proceeded with no documented exemption.
  - F6. Privileged sessions used to implement are not recorded, or do not reconcile to the named implementer.
  - F7. No post-implementation verification, so a difference between the approved plan and the deployed state would never surface.
  resolutions:
  - failure_mode: F1
    text: A change record whose approval timestamp precedes deployment, or an approved retrospective acceptance naming the exposure.
  - failure_mode: F2
    text: An approval matrix and a record showing an approver drawn from it, distinct from the implementer.
  - failure_mode: F3
    text: An emergency change register with incident references and a rate that can be explained.
  - failure_mode: F4
    text: A change record field holding the model and prompt version, populated for a sampled change.
  - failure_mode: F5
    text: A freeze exemption approved at the level the freeze policy requires.
  - failure_mode: F6
    text: A privileged session record reconciling to the change and the named implementer.
  - failure_mode: F7
    text: A post-implementation verification record comparing running state to approved state.
  test_provenance: 'Archetype: change_release — DRAFT, requires second-line authoring and control-owner approval before authoritative use'

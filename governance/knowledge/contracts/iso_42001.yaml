- framework: ISO42001
  control_id: A.3.2
  title: AI roles and responsibilities
  requirement: Define and explicitly assign accountability and responsibility for AI activities across the life cycle (risk, impact assessment,
    development, oversight, data quality, security, supplier management) so nothing falls in a gap.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: A named body or role holds an approved mandate covering AI roles and responsibilities
    scope: model
  - id: e2
    text: The mandate states which decisions are reserved to that body and cannot be delegated
    scope: model
  - id: e3
    text: Membership, quorum and cross-functional representation are defined
    scope: model
  - id: e4
    text: Reporting inputs, cadence and escalation thresholds are defined
    scope: model
  - id: e5
    text: Decisions taken under the mandate are recorded with a named decision-maker and date
    scope: model
  - id: e6
    text: Actions arising are tracked to closure or formal acceptance
    scope: model
  boundary:
    none: no approved mandate, or a mandate that names no accountable body and no reserved decisions.
    partial: an approved mandate exists but one or more of decision rights, quorum, cadence or escalation thresholds is absent, or the body exists
      but material decisions are not traceable to it.
    full: mandate, reserved decision rights and reporting are approved and current, and material decisions in the period are attributable to the
      body with actions tracked.
  owner: AI Risk (2nd line)
  expected_evidence: []
  linked_play: []
  crosswalk: []
  population_and_evidence_floor: 'Population: every meeting or reserved decision in the review period, established from the governance calendar
    or decision register. Evidence floor: fewer than 3 meetings or fewer than 1 material decision available to inspect makes the operating result
    NOT TESTABLE rather than a PASS.'
  test_of_design:
  - id: D1
    text: Obtain the approved terms of reference, mandate or charter covering AI roles and responsibilities, with its approval record and version
      history.
  - id: D2
    text: Confirm the mandate names the accountable role or body, its membership and quorum, and the decisions reserved to it rather than delegated
      to a model, a vendor or the delivery team.
  - id: D3
    text: Confirm reporting inputs, cadence, materiality thresholds for escalation and evidence-retention responsibilities are stated, not implied.
  - id: D4
    text: Confirm the mandate is current — reviewed within its stated cycle, and updated for any material change in AI scope since approval.
  - id: s5
    text: 'Design verdict: ADEQUATE only when D1-D3 all hold. PARTIALLY ADEQUATE when D1 holds and one of D2-D3 is incomplete. INADEQUATE when
      decision rights or accountability cannot be located. NOT TESTABLE when the authoritative mandate is not produced — absence of the artefact
      from the evidence pack is not a design failure until its absence is confirmed by the owner.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: all meetings, decisions or approvals falling under the mandate in the review period. Establish the population
      from the calendar or register, not from the minutes supplied.'
  - id: O2
    text: Sample at least three meetings including every meeting at which a high-materiality matter was decided. Verify attendance against quorum.
  - id: O3
    text: 'Reperform: trace each sampled material AI matter to a recorded decision, a named decision-maker and a dated action, then trace open
      actions to closure or formal acceptance.'
  - id: O4
    text: Inspect any period in which the cadence was missed and the disposition of that gap.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when the body met at cadence, decided the material matters in scope, and actions were tracked. PARTIALLY
      EFFECTIVE when it operated but decisions or follow-up are incomplete. INEFFECTIVE when material matters bypassed the body. NOT TESTABLE
      when the population cannot be established.'
  near_miss_failure_modes:
  - F1. Minutes record attendance and papers tabled but no decision — the body was informed rather than deciding.
  - F2. The material decision was taken outside the body and ratified afterwards, with the ratification date after the go-live date.
  - F3. Quorum was not met at the meeting where the reserved decision was taken, and the minutes do not record it.
  - F4. Actions carry an owner but no due date, and the same actions reappear across consecutive meetings without disposition.
  - F5. The mandate is approved but predates the AI scope it is claimed to cover — for example approved before agentic use cases existed.
  resolutions:
  - failure_mode: F1
    text: A minuted decision with the decision wording, the decision-maker and the date.
  - failure_mode: F2
    text: Evidence that the approval preceded the deployment, or an approved retrospective risk acceptance naming the exposure.
  - failure_mode: F3
    text: An attendance record showing quorum, or a documented out-of-cycle approval route.
  - failure_mode: F4
    text: An action log with owner, due date and closure evidence or a formal acceptance.
  - failure_mode: F5
    text: A mandate version approved after the scope change, or a scope addendum with its own approval.
  test_provenance: 'Archetype: governance_body — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: ISO42001
  control_id: A.3.3
  title: Reporting of concerns
  requirement: Provide a reporting channel (anonymous/confidential where appropriate, protected from reprisal) for staff, contractors and external
    parties to raise concerns about AI, with defined investigation and escalation.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: An incident procedure covering Reporting of concerns exists with severity criteria
    scope: model
  - id: e2
    text: AI-specific incident types are named
    scope: model
  - id: e3
    text: Notification paths and timeframes are defined per severity
    scope: model
  - id: e4
    text: A containment or halt mechanism is specified with a named invoking authority
    scope: model
  - id: e5
    text: Incidents in the period were detected, escalated and contained within target
    scope: model
  - id: e6
    text: Post-incident review produced actions traced to closure or to a control change
    scope: model
  boundary:
    none: no AI incident procedure, or no trigger and no containment path.
    partial: the procedure exists and events were handled, but timings, containment effectiveness or lessons-to-controls are not evidenced.
    full: incidents were detected and escalated within target, containment demonstrably took effect, and post-incident actions changed the controls
      they implicate.
  owner: AI Risk (2nd line)
  expected_evidence: []
  linked_play:
  - Play 6
  crosswalk: []
  population_and_evidence_floor: 'Population: all incidents and near misses in the period, cross-checked against alerts, overrides and complaints.
    Evidence floor: zero incidents and no exercise means the mechanism is untested — report NOT TESTABLE rather than PASS.'
  test_of_design:
  - id: D1
    text: Obtain the incident or escalation procedure covering Reporting of concerns — what constitutes an AI incident, severity criteria, and
      the trigger for invoking it.
  - id: D2
    text: Confirm AI-specific incident types are named, not only availability and security — for example harmful output, mandate breach, unexpected
      autonomous action, drift beyond tolerance.
  - id: D3
    text: Confirm roles, notification paths, timeframes per severity and the authority to contain or halt.
  - id: D4
    text: Confirm the containment mechanism is specified and testable, including who may invoke it and how quickly it takes effect.
  - id: D5
    text: Confirm post-incident review, root cause and the route by which lessons change a control.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when the procedure is generic and does not name AI failure types, or containment
      authority is unclear. INADEQUATE when no trigger or severity scheme exists. NOT TESTABLE when the procedure is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of incidents and near misses in the period from the incident system, and cross-check against monitoring alerts
      and complaint or override records for events that were never raised as incidents.
  - id: O2
    text: Sample incidents and verify detection-to-notification and notification-to-containment times against the stated targets.
  - id: O3
    text: Verify containment was invoked by an authorised role and took effect, with evidence from the system rather than the ticket.
  - id: O4
    text: Trace post-incident actions to closure and to any control change they required.
  - id: O5
    text: Where no incident occurred, test the mechanism — an exercise, a tabletop with evidence, or a controlled invocation in a non-production
      environment.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when incidents were detected, escalated within target and contained, with lessons carried into controls.
      PARTIALLY EFFECTIVE when handling occurred but timings or closure are unevidenced. INEFFECTIVE when events were not raised or containment
      failed. NOT TESTABLE when no incident and no exercise occurred in the period.'
  near_miss_failure_modes:
  - F1. Zero AI incidents in the period is presented as strength, with no near-miss capture and no exercise to show the process would engage.
  - F2. Events appear in the monitoring or complaint records but were never raised as incidents, so the population is understated.
  - F3. The kill switch is documented but has never been invoked, and no one can state how long it takes to take effect.
  - F4. Severity was assigned after resolution, and always at a level that avoided external notification.
  - F5. Post-incident actions are closed as 'awareness raised' with no control change.
  - F6. Containment is evidenced by a ticket status rather than by system evidence that the agent stopped acting.
  resolutions:
  - failure_mode: F1
    text: A near-miss register, or an exercise report with date, participants and observed timings.
  - failure_mode: F2
    text: A reconciliation from alerts and complaints to incidents, with any unraised events explained.
  - failure_mode: F3
    text: A containment test with a measured time to effect.
  - failure_mode: F4
    text: A severity assignment dated at detection, with the criteria applied.
  - failure_mode: F5
    text: A post-incident action that amended a control, with the amended control identified.
  - failure_mode: F6
    text: System evidence of containment — revoked credentials, disabled route, halted queue.
  test_provenance: 'Archetype: incident_escalation — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: ISO42001
  control_id: A.4.2
  title: Resource documentation
  requirement: Build and maintain an inventory of the resources AI systems rely on at each life cycle stage; resource visibility makes risk assessment,
    impact assessment and incident response possible.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: An approved methodology for Resource documentation exists with defined criteria
    scope: model
  - id: e2
    text: Tier or outcome thresholds are stated by rule rather than by unaided judgement
    scope: model
  - id: e3
    text: The assessment is required before the decision it informs
    scope: model
  - id: e4
    text: The outcome is approved by a role independent of the requester
    scope: model
  - id: e5
    text: Each outcome obliges a defined set of controls or gates
    scope: model
  - id: e6
    text: Reassessment triggers are defined and detected
    scope: model
  boundary:
    none: no methodology, or assessments performed with no criteria.
    partial: a methodology exists and is used, but timing, independence, threshold discipline or reassessment is not evidenced.
    full: assessments are complete, timely, independent of the requester, reperformable from the recorded facts, and drive the controls their
      outcome obliges.
  owner: Model Owner (1st line)
  expected_evidence: []
  linked_play:
  - Play 1
  crosswalk: []
  population_and_evidence_floor: 'Population: all use cases requiring assessment in the period, from the intake log or AI inventory. Evidence
    floor: fewer than 3 assessments, or no sample from the lowest tier, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the approved methodology and template for Resource documentation — trigger, criteria, scoring or classification scheme, and the
      decision each outcome drives.
  - id: D2
    text: 'Confirm the criteria are discriminating: different inputs produce different outcomes, and the thresholds between tiers are stated numerically
      or by defined rule rather than by judgement alone.'
  - id: D3
    text: Confirm the assessment must be completed before the decision it informs, and who approves the outcome.
  - id: D4
    text: Confirm reassessment triggers — material change, incident, elapsed time — and who is accountable for detecting them.
  - id: D5
    text: 'Confirm what an outcome obliges: which controls a tier turns on, so classification is load-bearing rather than descriptive.'
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when the method exists but thresholds or consequences are undefined.
      INADEQUATE when outcomes drive nothing. NOT TESTABLE when the approved methodology is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: all use cases requiring an assessment in the period, taken from the inventory or intake log.'
  - id: O2
    text: Sample across tiers, including at least one that was classified into the lowest tier — the classification most likely to be wrong and
      least likely to be challenged.
  - id: O3
    text: Reperform the classification from the underlying facts and compare to the recorded outcome. A reperformance that disagrees is a finding
      regardless of the approver's seniority.
  - id: O4

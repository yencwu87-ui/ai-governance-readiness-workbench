    scope: model
  - id: e6
    text: The detector has been tested or back-tested, so silence is evidence
    scope: model
  boundary:
    none: no monitoring, or monitoring with no thresholds and no owner.
    partial: monitoring is configured and running but coverage, alert disposition or detector assurance is incomplete, or the metrics are proxies
      for the risk rather than the risk.
    full: approved metrics ran continuously, alerts were owned and dispositioned, and the detector is demonstrably capable of firing.
  owner: Model Owner / AI Risk (2nd line)
  expected_evidence: []
  linked_play:
  - Play 5, 11
  crosswalk:
  - Monitoring | A.6 AI system life cycle | MEASURE 4.1; MANAGE 4.1 | MAS M3.10 | MGF D3.11, D3.12 | PA 9
  population_and_evidence_floor: 'Population: the full monitoring period, plus all alerts raised. Evidence floor: no alerts in the period and
    no detector test means silence is uninformative — report NOT TESTABLE rather than PASS.'
  test_of_design:
  - id: D1
    text: Obtain the monitoring design for Proceed-and-flag path — the metrics, their thresholds, the observation window and the alerting route.
  - id: D2
    text: Confirm the metrics correspond to the failure the control exists to catch, not only to availability or infrastructure health.
  - id: D3
    text: Confirm each alert has a named recipient, a required response time and a disposition record.
  - id: D4
    text: Confirm how the detector itself is validated — how anyone knows an alert would fire if the condition occurred.
  - id: s5
    text: 'Design verdict: ADEQUATE when D1-D3 hold and D4 identifies a test route. PARTIALLY ADEQUATE when metrics and thresholds exist but ownership
      or detector assurance is absent. INADEQUATE when thresholds are undefined. NOT TESTABLE when the monitoring configuration is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the monitoring output for the full period, with coverage gaps identified — periods with no data are findings, not blanks.
  - id: O2
    text: Verify the configuration in force matches the approved design, read from the running configuration rather than from a document.
  - id: O3
    text: Sample alerts raised and trace each to an owner, a response within the stated time and a disposition.
  - id: O4
    text: Where no alert fired in the period, test the detector — a synthetic breach, a back-test against a known past event, or an equivalent.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when monitoring ran continuously against the approved thresholds and alerts were dispositioned. PARTIALLY
      EFFECTIVE when coverage gaps exist or alerts closed without disposition. INEFFECTIVE when monitoring was not operating or breaches were
      not acted on. NOT TESTABLE when monitoring output for the period is unavailable.'
  near_miss_failure_modes:
  - F1. No alert fired all period and this is presented as evidence of health, with nothing showing the detector works.
  - F2. Thresholds in the running configuration differ from the approved design, usually loosened after a noisy week.
  - F3. Alerts are routed to a shared channel with no named owner, and closure is by silence.
  - F4. Monitoring covers latency and uptime while the control is about model quality, drift or mandate breach.
  - F5. Coverage has gaps that coincide with the periods of highest change.
  - F6. Drift is monitored on inputs only, with no monitoring of the outcome the model drives.
  resolutions:
  - failure_mode: F1
    text: A detector test, synthetic breach or back-test against a known past event.
  - failure_mode: F2
    text: An export of the running configuration compared to the approved baseline, with any deviation approved.
  - failure_mode: F3
    text: An alert record naming a recipient, a response time and a disposition.
  - failure_mode: F4
    text: A metric definition tied to the control objective, with at least one period of output.
  - failure_mode: F5
    text: A continuous coverage statement with gaps explained and dispositioned.
  - failure_mode: F6
    text: Output-side monitoring covering the decisions or actions the system produced.
  test_provenance: 'Archetype: monitoring_detection — DRAFT, requires second-line authoring and control-owner approval before authoritative use'

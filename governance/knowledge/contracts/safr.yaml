- framework: SAFR
  control_id: S1.5
  title: Risk-threshold binding
  requirement: Bind monetary, exposure and sensitivity thresholds to the pre-execution check
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: Metrics and thresholds for Risk-threshold binding are defined and approved
    scope: model
  - id: e2
    text: The metrics detect the failure the control exists to catch
    scope: model
  - id: e3
    text: Alerts route to a named owner with a stated response time
    scope: model
  - id: e4
    text: Monitoring ran across the whole period with gaps identified
    scope: model
  - id: e5
    text: Alerts raised were dispositioned with a recorded outcome
    scope: model
  - id: e6
    text: The detector has been tested or back-tested, so silence is evidence
    scope: model
  boundary:
    none: no monitoring, or monitoring with no thresholds and no owner.
    partial: monitoring is configured and running but coverage, alert disposition or detector assurance is incomplete, or the metrics are proxies
      for the risk rather than the risk.
    full: approved metrics ran continuously, alerts were owned and dispositioned, and the detector is demonstrably capable of firing.
  owner: AI Risk (2nd line) / Model Owner
  expected_evidence: []
  linked_play:
  - Play 1, 11
  crosswalk:
  - AI Inventory & Materiality | A.5 Impact assessment | MAP 2.3; MANAGE 1.3 | MAS M2.3 | MGF D1.1 | —
  population_and_evidence_floor: 'Population: the full monitoring period, plus all alerts raised. Evidence floor: no alerts in the period and
    no detector test means silence is uninformative — report NOT TESTABLE rather than PASS.'
  test_of_design:
  - id: D1
    text: Obtain the monitoring design for Risk-threshold binding — the metrics, their thresholds, the observation window and the alerting route.
  - id: D2
    text: Confirm the metrics correspond to the failure the control exists to catch, not only to availability or infrastructure health.
  - id: D3
    text: Confirm each alert has a named recipient, a required response time and a disposition record.
  - id: D4
    text: Confirm how the detector itself is validated — how anyone knows an alert would fire if the condition occurred.
  - id: s5
    text: 'Design verdict: ADEQUATE when D1-D3 hold and D4 identifies a test route. PARTIALLY ADEQUATE when metrics and thresholds exist but ownership
      or detector assurance is absent. INADEQUATE when thresholds are undefined. NOT TESTABLE when the monitoring configuration is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the monitoring output for the full period, with coverage gaps identified — periods with no data are findings, not blanks.
  - id: O2
    text: Verify the configuration in force matches the approved design, read from the running configuration rather than from a document.
  - id: O3
    text: Sample alerts raised and trace each to an owner, a response within the stated time and a disposition.
  - id: O4
    text: Where no alert fired in the period, test the detector — a synthetic breach, a back-test against a known past event, or an equivalent.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when monitoring ran continuously against the approved thresholds and alerts were dispositioned. PARTIALLY
      EFFECTIVE when coverage gaps exist or alerts closed without disposition. INEFFECTIVE when monitoring was not operating or breaches were
      not acted on. NOT TESTABLE when monitoring output for the period is unavailable.'
  near_miss_failure_modes:
  - F1. No alert fired all period and this is presented as evidence of health, with nothing showing the detector works.
  - F2. Thresholds in the running configuration differ from the approved design, usually loosened after a noisy week.
  - F3. Alerts are routed to a shared channel with no named owner, and closure is by silence.
  - F4. Monitoring covers latency and uptime while the control is about model quality, drift or mandate breach.
  - F5. Coverage has gaps that coincide with the periods of highest change.
  - F6. Drift is monitored on inputs only, with no monitoring of the outcome the model drives.
  resolutions:
  - failure_mode: F1
    text: A detector test, synthetic breach or back-test against a known past event.
  - failure_mode: F2
    text: An export of the running configuration compared to the approved baseline, with any deviation approved.
  - failure_mode: F3
    text: An alert record naming a recipient, a response time and a disposition.
  - failure_mode: F4
    text: A metric definition tied to the control objective, with at least one period of output.
  - failure_mode: F5
    text: A continuous coverage statement with gaps explained and dispositioned.
  - failure_mode: F6
    text: Output-side monitoring covering the decisions or actions the system produced.
  test_provenance: 'Archetype: monitoring_detection — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: SAFR
  control_id: S2.1  ★
  title: Disposition engine
  requirement: Evaluate each proposed action at runtime and assign a disposition before execution
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: An approved validation or evaluation method for Disposition engine exists
    scope: model
  - id: e2
    text: Acceptance thresholds are stated before results are seen
    scope: model
  - id: e3
    text: The validator is independent of the team that built the system
    scope: model
  - id: e4
    text: The validation covers the version that was deployed
    scope: model
  - id: e5
    text: Results are supported by retained underlying data, not only a summary
    scope: model
  - id: e6
    text: Shortfalls against threshold are remediated, re-tested or formally accepted
    scope: model
  boundary:
    none: no validation, or a report with no acceptance criteria and no independence.
    partial: validation was performed but is stale against the deployed version, not independent, or thresholds and shortfall disposition are
      not evidenced.
    full: the deployed version was independently validated against pre-stated thresholds, with retained results and every shortfall remediated
      or formally accepted.
  owner: InfoSec / Model Owner
  expected_evidence: []
  linked_play:
  - Play 11
  crosswalk:
  - Governance & Oversight | A.6 AI system life cycle; A.9 | MEASURE 2.7; MANAGE 2.3 | MAS M3.4 | MGF D3.11 | PA 10
  population_and_evidence_floor: 'Population: all model, prompt or agent versions promoted in the period. Evidence floor: fewer than 1 validated
    version in the period, or reports with no version identifier, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the approved validation or evaluation methodology for Disposition engine — scope, test types, datasets, metrics and acceptance
      thresholds.
  - id: D2
    text: Confirm acceptance thresholds are stated in advance of testing and are specific to the use case rather than generic.
  - id: D3
    text: 'Confirm independence: who performs the validation and how they are separated from the team that built the system.'
  - id: D4
    text: Confirm the methodology covers the failure modes the system can actually produce, including the ones a benchmark score does not capture.
  - id: D5
    text: Confirm the disposition rule — what happens when a threshold is missed, and who may accept a shortfall.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when tests are defined but thresholds are set after results, or
      independence is unclear. INADEQUATE when no acceptance criterion exists. NOT TESTABLE when the methodology is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: every model, prompt or agent version promoted in the period.'
  - id: O2
    text: For a sample, obtain the validation report and check it covers the version actually deployed — compare version identifiers and dates,
      not titles.
  - id: O3
    text: Reperform or recompute at least one reported metric from the underlying results where the data permits.
  - id: O4
    text: Trace every shortfall against threshold to a remediation, a re-test or an approved acceptance by a role with authority to grant it.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when each deployed version has independent validation against pre-stated thresholds and shortfalls are
      dispositioned. PARTIALLY EFFECTIVE when validation exists but is stale, non-independent or partly unevidenced. INEFFECTIVE when versions
      reached production unvalidated. NOT TESTABLE when the version population or the underlying results are unavailable.'
  near_miss_failure_modes:
  - F1. The validation report predates the deployed version — it validates the model that was tested, not the one that is running.
  - F2. The validator sits in the same reporting line as the builder, so 'independent review' is a signature rather than a challenge.
  - F3. The acceptance threshold was chosen after the result was known, which makes a pass unfalsifiable.
  - F4. The test set overlaps the tuning or training data, so the reported score measures memorisation.
  - F5. A metric is reported with no sample size, so a favourable number may rest on a handful of cases.
  - F6. Only aggregate performance is reported — no slice, subgroup or worst-case analysis where the control requires it.
  resolutions:
  - failure_mode: F1
    text: A validation report whose version identifier matches the deployed artefact, or a re-validation of the current version.
  - failure_mode: F2
    text: A validation performed or signed by a function outside the delivery reporting line, with the reviewer named.
  - failure_mode: F3
    text: A pre-registered threshold — an approved test plan dated before the test run.
  - failure_mode: F4
    text: A statement of dataset provenance and separation, or a held-out set with documented construction.
  - failure_mode: F5
    text: Reported metrics with denominators and confidence, or the underlying result file.
  - failure_mode: F6
    text: Slice-level results for the populations the control names.
  test_provenance: 'Archetype: validation_evaluation — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: SAFR
  control_id: S2.2
  title: Automated approval path
  requirement: Auto-execute actions that fall within mandate and thresholds
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: Oversight points for Automated approval path are defined with the human's authority stated
    scope: model
  - id: e2
    text: The design states whether the human decides, may veto, or is informed
    scope: model
  - id: e3
    text: The reviewer receives information sufficient to disagree
    scope: model
  - id: e4
    text: An override route exists, is usable in time, and records a reason
    scope: model
  - id: e5
    text: Reviewer competence and capacity are addressed
    scope: model
  - id: e6
    text: Reviews in the period preceded the action and recorded a reasoned decision
    scope: model
  boundary:
    none: no defined human authority over the outcome, or oversight that cannot change anything.
    partial: oversight points are defined and operating but information sufficiency, timing or genuine disagreement is not evidenced.
    full: reviewers act before the action with sufficient information, a usable override, reasoned records, and a disagreement rate consistent
      with real review.
  owner: Model Owner
  expected_evidence: []
  linked_play:
  - Play 11
  crosswalk:
  - 'Lifecycle: Deployment | A.9 Use of AI systems | MANAGE 2.4 | MAS M3.4 | MGF D2.3 | —'
  population_and_evidence_floor: 'Population: all decisions or actions subject to human oversight in the period. Evidence floor: fewer than 10
    reviewed items, or no override population, makes the rate analysis NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the oversight design for Automated approval path — at which points a person acts, what they receive, and what authority they
      hold.
  - id: D2
    text: 'Confirm the design distinguishes deciding from reviewing: state whether the human decides, may veto, or is merely informed, and what
      happens if they do nothing.'
  - id: D3
    text: Confirm the information the reviewer receives is sufficient to disagree — inputs, confidence or uncertainty, and the basis of the recommendation.
  - id: D4
    text: Confirm the override route exists, is usable in the time available, and records a reason.
  - id: D5
    text: 'Confirm competence and capacity: who may act in the role, and whether the volume allows genuine review.'
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when a review point exists but authority or information sufficiency is
      undefined. INADEQUATE when no human authority to stop or change the outcome exists. NOT TESTABLE when the design is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of decisions or actions subject to oversight in the period.
  - id: O2
    text: Measure the override and rejection rate. A rate at or near zero across a large population is a finding to investigate, not evidence
      of quality.
  - id: O3
    text: Sample reviewed items and verify the reviewer had the stated information and recorded a decision with a reason.
  - id: O4
    text: 'Test timing: the review preceded the action it governs, and the time taken is consistent with genuine review rather than batch confirmation.'
  - id: O5
    text: Trace a sample of overrides to their effect on the system outcome.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when oversight occurred before the action, with reasoned decisions and a credible disagreement rate. PARTIALLY
      EFFECTIVE when review occurred but reasons or timing are unevidenced. INEFFECTIVE when oversight was nominal or post hoc. NOT TESTABLE when
      the decision population cannot be established.'
  near_miss_failure_modes:
  - F1. Approval rate is 100% across thousands of items, which evidences a click-through rather than a review.
  - F2. The reviewer sees only the recommendation, not the inputs or the uncertainty, so disagreement has no basis.
  - F3. The override exists but requires a path longer than the decision window, so it is never used.
  - F4. Review timestamps cluster in batches seconds apart, inconsistent with individual consideration.
  - F5. The human is accountable in the policy but the system proceeds automatically on no response.
  - F6. Overrides are recorded but the system took the original action anyway.
  resolutions:
  - failure_mode: F1
    text: The override and rejection rate with a distribution, plus an explanation for a near-zero rate.
  - failure_mode: F2
    text: A screenshot or specification of what the reviewer is shown, including uncertainty.
  - failure_mode: F3
    text: An override performed within the decision window, with timings.
  - failure_mode: F4
    text: Per-item review timestamps and durations.
  - failure_mode: F5
    text: A default-on-no-response rule that halts rather than proceeds, with evidence of it operating.
  - failure_mode: F6
    text: System evidence that an override changed the outcome.
  test_provenance: 'Archetype: human_oversight — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: SAFR
  control_id: S2.3  ★

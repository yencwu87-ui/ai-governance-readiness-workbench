  control_id: S3.3
  title: Traceability to mandate & policy version
  requirement: Link each record to the controls-repository / mandate version that governed the action
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The authority boundary for Traceability to mandate & policy version is explicitly defined
    scope: model
  - id: e2
    text: The boundary is enforced in configuration or at runtime, not only stated in a document
    scope: model
  - id: e3
    text: Grant and approval of authority are separated from the requester
    scope: model
  - id: e4
    text: The behaviour at the boundary — block, refer or log — is approved
    scope: model

  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: An incident procedure covering Human-in-the-loop escalation exists with severity criteria
    scope: model
  - id: e2
    text: AI-specific incident types are named
    scope: model
  - id: e3
    text: Notification paths and timeframes are defined per severity
    scope: model
  - id: e4
    text: A containment or halt mechanism is specified with a named invoking authority
    scope: model
  - id: e5
    text: Incidents in the period were detected, escalated and contained within target
    scope: model
  - id: e6
    text: Post-incident review produced actions traced to closure or to a control change
    scope: model
  boundary:
    none: no AI incident procedure, or no trigger and no containment path.
    partial: the procedure exists and events were handled, but timings, containment effectiveness or lessons-to-controls are not evidenced.
    full: incidents were detected and escalated within target, containment demonstrably took effect, and post-incident actions changed the controls
      they implicate.
  owner: Model Owner / AI Risk Committee
  expected_evidence: []
  linked_play:
  - Play 11
  crosswalk:
  - Human Oversight | A.9; A.8 Information for interested parties | GOVERN 4.1; MANAGE 2.3 | MAS M3.4 | MGF D2.3, D2.4 | PA 3, PA 10
  population_and_evidence_floor: 'Population: all incidents and near misses in the period, cross-checked against alerts, overrides and complaints.
    Evidence floor: zero incidents and no exercise means the mechanism is untested — report NOT TESTABLE rather than PASS.'
  test_of_design:
  - id: D1
    text: Obtain the incident or escalation procedure covering Human-in-the-loop escalation — what constitutes an AI incident, severity criteria,
      and the trigger for invoking it.
  - id: D2
    text: Confirm AI-specific incident types are named, not only availability and security — for example harmful output, mandate breach, unexpected
      autonomous action, drift beyond tolerance.
  - id: D3
    text: Confirm roles, notification paths, timeframes per severity and the authority to contain or halt.
  - id: D4
    text: Confirm the containment mechanism is specified and testable, including who may invoke it and how quickly it takes effect.
  - id: D5
    text: Confirm post-incident review, root cause and the route by which lessons change a control.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when the procedure is generic and does not name AI failure types, or containment
      authority is unclear. INADEQUATE when no trigger or severity scheme exists. NOT TESTABLE when the procedure is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of incidents and near misses in the period from the incident system, and cross-check against monitoring alerts
      and complaint or override records for events that were never raised as incidents.
  - id: O2
    text: Sample incidents and verify detection-to-notification and notification-to-containment times against the stated targets.
  - id: O3
    text: Verify containment was invoked by an authorised role and took effect, with evidence from the system rather than the ticket.
  - id: O4
    text: Trace post-incident actions to closure and to any control change they required.
  - id: O5
    text: Where no incident occurred, test the mechanism — an exercise, a tabletop with evidence, or a controlled invocation in a non-production
      environment.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when incidents were detected, escalated within target and contained, with lessons carried into controls.
      PARTIALLY EFFECTIVE when handling occurred but timings or closure are unevidenced. INEFFECTIVE when events were not raised or containment
      failed. NOT TESTABLE when no incident and no exercise occurred in the period.'
  near_miss_failure_modes:
  - F1. Zero AI incidents in the period is presented as strength, with no near-miss capture and no exercise to show the process would engage.
  - F2. Events appear in the monitoring or complaint records but were never raised as incidents, so the population is understated.
  - F3. The kill switch is documented but has never been invoked, and no one can state how long it takes to take effect.
  - F4. Severity was assigned after resolution, and always at a level that avoided external notification.
  - F5. Post-incident actions are closed as 'awareness raised' with no control change.
  - F6. Containment is evidenced by a ticket status rather than by system evidence that the agent stopped acting.
  resolutions:
  - failure_mode: F1
    text: A near-miss register, or an exercise report with date, participants and observed timings.
  - failure_mode: F2
    text: A reconciliation from alerts and complaints to incidents, with any unraised events explained.
  - failure_mode: F3
    text: A containment test with a measured time to effect.
  - failure_mode: F4
    text: A severity assignment dated at detection, with the criteria applied.
  - failure_mode: F5
    text: A post-incident action that amended a control, with the amended control identified.
  - failure_mode: F6
    text: System evidence of containment — revoked credentials, disabled route, halted queue.
  test_provenance: 'Archetype: incident_escalation — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: SAFR
  control_id: S2.4
  title: Reject / block path
  requirement: Block actions outside mandate at the point of action
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The authority boundary for Reject / block path is explicitly defined
    scope: model
  - id: e2
    text: The boundary is enforced in configuration or at runtime, not only stated in a document
    scope: model
  - id: e3
    text: Grant and approval of authority are separated from the requester
    scope: model
  - id: e4
    text: The behaviour at the boundary — block, refer or log — is approved
    scope: model
  - id: e5
    text: Overrides are approved by a role with authority and carry a recorded reason
    scope: model
  - id: e6
    text: Granted authority is recertified on a defined cadence and revocations take effect
    scope: model
  boundary:
    none: no defined boundary, or authority granted with no approval.
    partial: the boundary is defined and approved but enforcement, override discipline or recertification is not evidenced.
    full: the enforced boundary matches the approved boundary, overrides are independently approved with reasons, and recertification demonstrably
      revokes.
  owner: InfoSec
  expected_evidence: []
  linked_play:
  - Play 6, 11
  crosswalk:
  - Governance & Oversight | A.9 Use of AI systems | MANAGE 2.3 | MAS M3.11 | MGF D3.3 | PA 10
  population_and_evidence_floor: 'Population: the enforced configuration plus all grants and all boundary events in the period. Evidence floor:
    no enforced configuration export, or zero boundary events with no enforcement test, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the definition of the authority boundary for Reject / block path — permitted actions, counterparties, value or exposure limits,
      data scope and the systems it may write to.
  - id: D2
    text: Confirm the boundary is expressed where it is enforced, not only in a document — a configuration, a policy object or a runtime guardrail.
  - id: D3
    text: Confirm who grants and who approves a change to the boundary, and that the two are separated from the requester.
  - id: D4
    text: 'Confirm what happens at the boundary: hard block, human referral or log-and-continue, and that the choice is approved.'
  - id: D5
    text: Confirm periodic recertification of granted authority, with a defined cadence and an accountable reviewer.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when limits are documented but not enforced, or recertification is absent.
      INADEQUATE when no boundary is defined. NOT TESTABLE when the authoritative definition is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the enforced configuration as at a date and compare it, field by field, to the approved boundary.
  - id: O2
    text: Define the population of granted access or mandate holders, and reconcile it to the approved grants — in the direction of finding grants
      nobody approved.
  - id: O3
    text: 'Sample boundary events in the period: blocks, referrals and overrides. Trace each override to an approver with authority and a recorded
      reason.'
  - id: O4
    text: Where no boundary event occurred, test the enforcement — a controlled attempt or an equivalent assurance that the limit binds.
  - id: O5
    text: Inspect the most recent recertification for completeness and for revocations actually taking effect.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when enforced limits match approved limits, overrides are approved and recertification took effect. PARTIALLY
      EFFECTIVE when the boundary holds but grants are stale or overrides are unevidenced. INEFFECTIVE when unapproved authority is found in production.
      NOT TESTABLE when the enforced configuration cannot be obtained.'
  near_miss_failure_modes:
  - F1. The limit is in a policy document and nowhere in the running system, so nothing stops the action.
  - F2. The enforced value is more permissive than the approved value, changed by a ticket that never reached the approver.
  - F3. Overrides are recorded but the approver is the same identity that requested the action.
  - F4. Recertification was completed as an attestation with no revocations, across a population where joiners and leavers certainly occurred.
  - F5. The agent holds standing credentials broader than its mandate because the mandate is enforced at the orchestration layer and the credential
    is not.
  - F6. Limits bind per transaction but not in aggregate, so the boundary is passable by repetition.
  resolutions:
  - failure_mode: F1
    text: An export of the enforced configuration or policy object showing the limit in force.
  - failure_mode: F2
    text: A reconciliation of enforced versus approved values with any deviation approved retrospectively.
  - failure_mode: F3
    text: An override record naming a distinct approver and the reason.
  - failure_mode: F4
    text: A recertification with revocation evidence at the target system, not only the sign-off sheet.
  - failure_mode: F5
    text: An entitlement review of the credential itself, scoped to the mandate.
  - failure_mode: F6
    text: An aggregate or cumulative limit in the enforced configuration, with evidence of its operation.
  test_provenance: 'Archetype: access_authority — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: SAFR
  control_id: S2.5
  title: Proceed-and-flag path
  requirement: Permit lower-risk actions to proceed while flagging them for monitoring
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: Metrics and thresholds for Proceed-and-flag path are defined and approved
    scope: model
  - id: e2
    text: The metrics detect the failure the control exists to catch
    scope: model
  - id: e3
    text: Alerts route to a named owner with a stated response time
    scope: model
  - id: e4

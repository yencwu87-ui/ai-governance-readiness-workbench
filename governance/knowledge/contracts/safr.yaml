  - id: e2
    text: The boundary is enforced in configuration or at runtime, not only stated in a document
    scope: model
  - id: e3
    text: Grant and approval of authority are separated from the requester
    scope: model
  - id: e4
    text: The behaviour at the boundary — block, refer or log — is approved
    scope: model
  - id: e5
    text: Overrides are approved by a role with authority and carry a recorded reason
    scope: model
  - id: e6
    text: Granted authority is recertified on a defined cadence and revocations take effect
    scope: model
  boundary:
    none: no defined boundary, or authority granted with no approval.
    partial: the boundary is defined and approved but enforcement, override discipline or recertification is not evidenced.
    full: the enforced boundary matches the approved boundary, overrides are independently approved with reasons, and recertification demonstrably
      revokes.
  owner: InfoSec / Technology
  expected_evidence: []
  linked_play:
  - Play 11
  crosswalk:
  - Governance & Oversight | A.9 Use of AI systems | MANAGE 2.3, 2.4 | MAS M3.7 | MGF D3.1 | PA 8
  population_and_evidence_floor: 'Population: the enforced configuration plus all grants and all boundary events in the period. Evidence floor:
    no enforced configuration export, or zero boundary events with no enforcement test, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the definition of the authority boundary for Gateway interception of actions — permitted actions, counterparties, value or exposure
      limits, data scope and the systems it may write to.
  - id: D2
    text: Confirm the boundary is expressed where it is enforced, not only in a document — a configuration, a policy object or a runtime guardrail.
  - id: D3
    text: Confirm who grants and who approves a change to the boundary, and that the two are separated from the requester.
  - id: D4
    text: 'Confirm what happens at the boundary: hard block, human referral or log-and-continue, and that the choice is approved.'
  - id: D5
    text: Confirm periodic recertification of granted authority, with a defined cadence and an accountable reviewer.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when limits are documented but not enforced, or recertification is absent.
      INADEQUATE when no boundary is defined. NOT TESTABLE when the authoritative definition is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the enforced configuration as at a date and compare it, field by field, to the approved boundary.
  - id: O2
    text: Define the population of granted access or mandate holders, and reconcile it to the approved grants — in the direction of finding grants
      nobody approved.
  - id: O3
    text: 'Sample boundary events in the period: blocks, referrals and overrides. Trace each override to an approver with authority and a recorded
      reason.'
  - id: O4
    text: Where no boundary event occurred, test the enforcement — a controlled attempt or an equivalent assurance that the limit binds.
  - id: O5
    text: Inspect the most recent recertification for completeness and for revocations actually taking effect.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when enforced limits match approved limits, overrides are approved and recertification took effect. PARTIALLY
      EFFECTIVE when the boundary holds but grants are stale or overrides are unevidenced. INEFFECTIVE when unapproved authority is found in production.
      NOT TESTABLE when the enforced configuration cannot be obtained.'
  near_miss_failure_modes:
  - F1. The limit is in a policy document and nowhere in the running system, so nothing stops the action.
  - F2. The enforced value is more permissive than the approved value, changed by a ticket that never reached the approver.
  - F3. Overrides are recorded but the approver is the same identity that requested the action.
  - F4. Recertification was completed as an attestation with no revocations, across a population where joiners and leavers certainly occurred.
  - F5. The agent holds standing credentials broader than its mandate because the mandate is enforced at the orchestration layer and the credential
    is not.
  - F6. Limits bind per transaction but not in aggregate, so the boundary is passable by repetition.
  resolutions:
  - failure_mode: F1
    text: An export of the enforced configuration or policy object showing the limit in force.
  - failure_mode: F2
    text: A reconciliation of enforced versus approved values with any deviation approved retrospectively.
  - failure_mode: F3
    text: An override record naming a distinct approver and the reason.
  - failure_mode: F4
    text: A recertification with revocation evidence at the target system, not only the sign-off sheet.
  - failure_mode: F5
    text: An entitlement review of the credential itself, scoped to the mandate.
  - failure_mode: F6
    text: An aggregate or cumulative limit in the enforced configuration, with evidence of its operation.
  test_provenance: 'Archetype: access_authority — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: SAFR
  control_id: S4.3
  title: Standard governance-record schema
  requirement: Adopt a portable, consistent record schema across agents and systems
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: An approved, current policy or standard covering Standard governance-record schema exists
    scope: model
  - id: e2
    text: Its scope names the systems, models or uses it binds
    scope: model
  - id: e3
    text: An accountable owner is named
    scope: model
  - id: e4
    text: Prohibited or controlled uses and the consequence of non-compliance are stated
    scope: model
  - id: e5
    text: An exception route with grantor, basis, expiry and record location is defined
    scope: model
  - id: e6
    text: In-scope activity in the period followed the policy, or holds a live exception
    scope: model
  boundary:
    none: no approved policy, or a document with no owner and no scope.
    partial: an approved policy exists but lacks an exception route, an implementing control, or sampled activity does not consistently follow
      it.
    full: the policy is approved, current, scoped, owned, implemented by a named control, and sampled activity follows it with exceptions governed.
  owner: InfoSec / AI Risk (2nd line)
  expected_evidence: []
  linked_play:
  - Play 11
  crosswalk:
  - Transparency (FEAT F4) | A.8 Information for interested parties | MAP 1.1; MEASURE 3.1 | MAS M3.8 | —
  population_and_evidence_floor: 'Population: all in-scope AI use cases or activities in the period, drawn from the AI inventory. Evidence floor:
    fewer than 3 sampled items, or an inventory that cannot be reconciled, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the approved policy or standard covering Standard governance-record schema, with its approval record, owner and version history.
  - id: D2
    text: Confirm it states scope (which systems, models and uses it binds), prohibited and controlled uses, the accountable owner and the consequence
      of non-compliance.
  - id: D3
    text: Confirm it defines the exception route — who may grant one, on what basis, for how long, and where exceptions are recorded.
  - id: D4
    text: Confirm the review cycle and the triggers for out-of-cycle review, and that the document is within its cycle.
  - id: D5
    text: Confirm the policy is mapped to the controls, plays or procedures that implement it, so a requirement is not left with nothing that
      operates it.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 hold and D5 identifies at least one implementing control. PARTIALLY ADEQUATE when the policy exists
      but the exception route or implementing link is absent. INADEQUATE when scope or ownership is undefined. NOT TESTABLE when the approved
      document is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: AI use cases, systems or activities in scope of the policy during the period, taken from the AI inventory rather
      than from a list supplied by the assessed team.'
  - id: O2
    text: Sample across materiality tiers and include at least one use case that went live in the period.
  - id: O3
    text: 'Reperform: verify each sampled item was assessed against the policy at the required point, and that any required attestation or approval
      exists and predates the activity.'
  - id: O4
    text: Inspect the exception and breach records for the period — verify each is dated, owned, time-bound and dispositioned.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when sampled use follows the approved policy and exceptions are governed. PARTIALLY EFFECTIVE when compliance
      is inconsistent or exceptions are open past expiry. INEFFECTIVE when the policy was bypassed for material use. NOT TESTABLE when the in-scope
      population cannot be established.'
  near_miss_failure_modes:
  - F1. The policy is approved but has no implementing procedure — nothing in the operating environment makes the requirement happen.
  - F2. Scope is written so broadly ('all AI use') that no one can tell whether a given system is in or out.
  - F3. Exceptions are granted by the same team that needs them, with no expiry.
  - F4. The policy was approved in the period but the sampled use cases predate it and were never reassessed against it.
  - F5. A breach register exists but every entry is closed as 'noted' with no remediation or acceptance.
  resolutions:
  - failure_mode: F1
    text: A named procedure, runbook or control that implements the clause, with an owner.
  - failure_mode: F2
    text: A scope statement with inclusion and exclusion criteria, or a mapping from the inventory to in-scope flag.
  - failure_mode: F3
    text: An exception record showing an independent grantor, a stated basis and an expiry date.
  - failure_mode: F4
    text: A reassessment record for pre-existing use cases, or an approved grandfathering decision.
  - failure_mode: F5
    text: A breach entry with a remediation action, owner and closure evidence, or a formal risk acceptance.
  test_provenance: 'Archetype: policy_standard — DRAFT, requires second-line authoring and control-owner approval before authoritative use'

  - failure_mode: F6
    text: A design statement and runtime evidence separating instruction from data.
  test_provenance: 'Procedure: MAS v0.4 bespoke. Elements/boundary: archetype security_resilience — DRAFT, requirement text not yet written'
- framework: MAS
  control_id: F1
  title: Fairness — AIDA decisions do not systematically disadvantage individuals/groups
  requirement: For AI-assisted decisions that may materially affect people, fairness is assessed using appropriate methods and results are acted
    upon before deployment and after material change or drift.
  requirement_source: requirements/mas.yaml
  requirement_authority: authoritative_internal_interpretation
  elements:
  - id: e1
    text: Affected groups and relevant fairness dimensions are identified for the use case.
    scope: model
    applies_when: null
    locator: controls.F1.elements[0]
  - id: e2
    text: Fairness measures or criteria, thresholds and data requirements are defined.
    scope: model
    applies_when: null
    locator: controls.F1.elements[1]
  - id: e3
    text: Material disparities are investigated and mitigated, with accountable review and reassessment triggers.
    scope: model
    applies_when: null
    locator: controls.F1.elements[2]
  boundary:
    none: The control requirement is not evidenced beyond generic intent, policy aspiration or unrelated material.
    partial: Some applicable requirement elements are evidenced, but one or more required elements or operating evidence is missing or incomplete.
    full: All applicable requirement elements are evidenced with current, attributable and sufficient design or operating evidence; no material
      mandatory element remains unsubstantiated.
  owner: Compliance
  expected_evidence:
  - Fairness Assessment Report (Veritas 3A); fairness-metric results vs thresholds
  linked_play:
  - Play 2, 3, 4, 5, 8
  crosswalk:
  - FEAT (2018) | A.5.4; A.7.4 | MEASURE 2.11 | —
  population_and_evidence_floor: 'Population: all model, prompt or agent versions promoted in the period. Evidence floor: fewer than 1 validated
    version in the period, or reports with no version identifier, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Inspect the fairness assessment standard and FEAT-aligned methodology.
  - id: D2
    text: Confirm it defines affected groups, relevant fairness dimensions/metrics, thresholds, dataset/population requirements, mitigation and
      independent validation for high-materiality use cases.
  - id: D3
    text: Confirm event-driven reassessment triggers for drift/material change are defined. PASS when the design can detect and manage systematic
      disadvantage for the intended decision context; FAIL when material groups/metrics/thresholds or mitigation are omitted; NOT TESTABLE when
      no approved fairness method exists.
  test_of_operating_effectiveness:
  - id: O1
    text: For the sampled AIDA/use-case population, inspect the latest fairness results against approved thresholds and relevant groups.
  - id: O2
    text: Verify breaches/near-breaches triggered mitigation, escalation or restricted use and that re-testing occurred after material change/drift.
  - id: O3
    text: Trace any complaints or observed disparities to investigation and remediation. PASS when fairness performance is measured, thresholded
      and acted upon in operation; FAIL when systematic disadvantage is evidenced without effective response; NOT TESTABLE when the relevant population
      or metrics cannot be verified.
  near_miss_failure_modes:
  - F1. The validation report predates the deployed version — it validates the model that was tested, not the one that is running.
  - F2. The validator sits in the same reporting line as the builder, so 'independent review' is a signature rather than a challenge.
  - F3. The acceptance threshold was chosen after the result was known, which makes a pass unfalsifiable.
  - F4. The test set overlaps the tuning or training data, so the reported score measures memorisation.
  - F5. A metric is reported with no sample size, so a favourable number may rest on a handful of cases.
  - F6. Only aggregate performance is reported — no slice, subgroup or worst-case analysis where the control requires it.
  resolutions:
  - failure_mode: F1
    text: A validation report whose version identifier matches the deployed artefact, or a re-validation of the current version.
  - failure_mode: F2
    text: A validation performed or signed by a function outside the delivery reporting line, with the reviewer named.
  - failure_mode: F3
    text: A pre-registered threshold — an approved test plan dated before the test run.
  - failure_mode: F4
    text: A statement of dataset provenance and separation, or a held-out set with documented construction.
  - failure_mode: F5
    text: Reported metrics with denominators and confidence, or the underlying result file.
  - failure_mode: F6
    text: Slice-level results for the populations the control names.
  test_provenance: 'Bespoke — requirements/mas.yaml v1 (FEAT (2018) (known)). Procedure: MAS v0.4 bespoke.'
- framework: MAS
  control_id: F2
  title: Ethics — AIDA use aligns with organisational ethical standards
  requirement: AI-assisted decision use aligns with the organisation’s ethical principles, prohibited-use boundaries and materiality-based ethics
    review requirements.
  requirement_source: requirements/mas.yaml
  requirement_authority: authoritative_internal_interpretation
  elements:
  - id: e1
    text: Approved ethical principles and prohibited or controlled-use criteria are defined.
    scope: model
    applies_when: null
    locator: controls.F2.elements[0]
  - id: e2
    text: Use-case ethics assessment or attestation is required where materiality warrants it.
    scope: model
    applies_when: null
    locator: controls.F2.elements[1]
  - id: e3
    text: Conflicts, exceptions and material changes are escalated and dispositioned.
    scope: model
    applies_when: null
    locator: controls.F2.elements[2]
  boundary:
    none: The control requirement is not evidenced beyond generic intent, policy aspiration or unrelated material.
    partial: Some applicable requirement elements are evidenced, but one or more required elements or operating evidence is missing or incomplete.
    full: All applicable requirement elements are evidenced with current, attributable and sufficient design or operating evidence; no material
      mandatory element remains unsubstantiated.
  owner: Compliance
  expected_evidence:
  - Ethics alignment attestation (Veritas 3B)
  linked_play:
  - Play 2, 4, 8
  crosswalk:
  - FEAT (2018) | A.2.2; A.5.5 | GOVERN 1.2; GOVERN 4.1 | —
  population_and_evidence_floor: 'Population: all in-scope AI use cases or activities in the period, drawn from the AI inventory. Evidence floor:
    fewer than 3 sampled items, or an inventory that cannot be reconciled, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Inspect organisational ethical principles, prohibited-use criteria and use-case ethics assessment/attestation.
  - id: D2
    text: Confirm the design requires ethics review appropriate to materiality and provides escalation where the use conflicts with organisational
      principles.
  - id: D3
    text: Confirm ownership and approval/version controls. PASS when ethical expectations are explicit, use-case applicable and governed; FAIL
      when material ethical boundaries are absent; NOT TESTABLE when no controlled ethics framework can be evidenced.
  test_of_operating_effectiveness:
  - id: O1
    text: Sample material/high-impact AI use cases and inspect ethics alignment assessments or attestations.
  - id: O2
    text: Verify the assessed purpose/use matches approved ethical principles and any prohibited/conditional uses, and that exceptions were escalated.
  - id: O3
    text: Inspect material changes for refreshed ethics assessment. PASS when the ethical assessment operates consistently and identified concerns
      are dispositioned; FAIL when use-case evidence conflicts with approved principles without governance action; NOT TESTABLE when the relevant
      use-case population cannot be established.
  near_miss_failure_modes:
  - F1. The policy is approved but has no implementing procedure — nothing in the operating environment makes the requirement happen.
  - F2. Scope is written so broadly ('all AI use') that no one can tell whether a given system is in or out.
  - F3. Exceptions are granted by the same team that needs them, with no expiry.
  - F4. The policy was approved in the period but the sampled use cases predate it and were never reassessed against it.
  - F5. A breach register exists but every entry is closed as 'noted' with no remediation or acceptance.
  resolutions:
  - failure_mode: F1
    text: A named procedure, runbook or control that implements the clause, with an owner.
  - failure_mode: F2
    text: A scope statement with inclusion and exclusion criteria, or a mapping from the inventory to in-scope flag.
  - failure_mode: F3
    text: An exception record showing an independent grantor, a stated basis and an expiry date.
  - failure_mode: F4
    text: A reassessment record for pre-existing use cases, or an approved grandfathering decision.
  - failure_mode: F5
    text: A breach entry with a remediation action, owner and closure evidence, or a formal risk acceptance.
  test_provenance: 'Procedure: MAS v0.4 bespoke. Elements/boundary: archetype policy_standard — DRAFT, requirement text not yet written'
- framework: MAS
  control_id: F3
  title: Accountability — clear internal & external accountability for AIDA-driven decisions
  requirement: Accountability for AI-assisted decisions is explicit across internal owners, decision authorities and material third-party dependencies,
    with non-delegable internal accountability.
  requirement_source: requirements/mas.yaml
  requirement_authority: authoritative_internal_interpretation
  elements:
  - id: e1
    text: Named business, model, risk/control and decision-accountable roles are defined.
    scope: model
    applies_when: null
    locator: controls.F3.elements[0]
  - id: e2
    text: Approval, escalation and decision-authorisation records are required and retained.
    scope: model
    applies_when: null
    locator: controls.F3.elements[1]
  - id: e3
    text: Third-party responsibilities are defined without replacing retained internal accountability.
    scope: model
    applies_when: null
    locator: controls.F3.elements[2]
  boundary:
    none: The control requirement is not evidenced beyond generic intent, policy aspiration or unrelated material.
    partial: Some applicable requirement elements are evidenced, but one or more required elements or operating evidence is missing or incomplete.
    full: All applicable requirement elements are evidenced with current, attributable and sufficient design or operating evidence; no material
      mandatory element remains unsubstantiated.
  owner: Compliance
  expected_evidence:
  - Accountability matrix; internal authorisation record (Veritas 3B)
  linked_play:
  - Play 2, 4, 8
  crosswalk:
  - FEAT (2018) | A.3.2; A.10.2 | GOVERN 2.1; GOVERN 2.3 | MGF D1.5, D2.1 | SAFR S1.1, S3.3 | —
  population_and_evidence_floor: 'Population: every meeting or reserved decision in the review period, established from the governance calendar
    or decision register. Evidence floor: fewer than 3 meetings or fewer than 1 material decision available to inspect makes the operating result
    NOT TESTABLE rather than a PASS.'
  test_of_design:
  - id: D1
    text: Inspect the accountability matrix, internal authorisation records and third-party responsibility model.
  - id: D2
    text: Confirm accountable roles cover business owner, model owner, risk/control functions, decision authority, escalation and external/vendor
      responsibilities, with non-delegable accountability clearly defined.
  - id: D3
    text: Confirm approval and record-retention requirements. PASS when accountability is explicit from AI system through decision outcome, including
      material third-party dependencies; FAIL when responsibility is ambiguous or delegated without retained accountability; NOT TESTABLE when
      approved accountability artefacts are unavailable.
  test_of_operating_effectiveness:
  - id: O1
    text: Sample material AI decisions, releases and third-party model arrangements.
  - id: O2
    text: Trace each to named accountable owners, required approvals, escalation paths and decision/authorisation records.
  - id: O3
    text: Inspect incidents/complaints to confirm responsibility was clear and exercised. PASS when sampled decisions have identifiable accountable
      owners and documented authorisation; FAIL when responsibility cannot be established or vendors are treated as replacing internal accountability;
      NOT TESTABLE when required decision records are unavailable.
  near_miss_failure_modes:
  - F1. Minutes record attendance and papers tabled but no decision — the body was informed rather than deciding.
  - F2. The material decision was taken outside the body and ratified afterwards, with the ratification date after the go-live date.
  - F3. Quorum was not met at the meeting where the reserved decision was taken, and the minutes do not record it.
  - F4. Actions carry an owner but no due date, and the same actions reappear across consecutive meetings without disposition.
  - F5. The mandate is approved but predates the AI scope it is claimed to cover — for example approved before agentic use cases existed.
  resolutions:
  - failure_mode: F1
    text: A minuted decision with the decision wording, the decision-maker and the date.
  - failure_mode: F2
    text: Evidence that the approval preceded the deployment, or an approved retrospective risk acceptance naming the exposure.
  - failure_mode: F3
    text: An attendance record showing quorum, or a documented out-of-cycle approval route.
  - failure_mode: F4
    text: An action log with owner, due date and closure evidence or a formal acceptance.
  - failure_mode: F5
    text: A mandate version approved after the scope change, or a scope addendum with its own approval.
  test_provenance: 'Bespoke — requirements/mas.yaml v1 (FEAT (2018) (known)). Procedure: MAS v0.4 bespoke.'

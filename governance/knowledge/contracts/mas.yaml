schema_version: 0.5.1.control-contract.2
framework: MAS
source_workbook: AI_Governance_Playbook_MGF_SAFR_v0.4.1_challenge_ready.xlsx
authority_rule: For MAS, requirement semantics come from requirements/mas.yaml. Workbook testing/challenge content is draft until approved. For
  other frameworks, workbook-derived requirement/test content is draft.
control_count: 30
controls:
- framework: MAS
  control_id: M1.1
  title: Board & senior management accountability for AI risk (risk appetite, framework approval)
  requirement: Senior management and the accountable AI governance body establish and maintain AI-risk accountability, approve the AI risk framework
    and appetite, and retain material AI-risk decision rights.
  requirement_source: requirements/mas.yaml
  requirement_authority: authoritative_internal_interpretation
  elements:
  - id: e1
    text: A named senior-management or governance body has an approved mandate covering AI risk oversight.
    scope: programme
    applies_when: null
    locator: controls.M1.1.elements[0]
  - id: e2
    text: The AI risk-management framework and applicable risk appetite/tolerances are formally approved and current.
    scope: programme
    applies_when: null
    locator: controls.M1.1.elements[1]
  - id: e3
    text: Material AI-risk decisions, escalations and approvals are attributable to an accountable role and retained.
    scope: programme
    applies_when: null
    locator: controls.M1.1.elements[2]
  boundary:
    none: The control requirement is not evidenced beyond generic intent, policy aspiration or unrelated material.
    partial: Some applicable requirement elements are evidenced, but one or more required elements or operating evidence is missing or incomplete.
    full: All applicable requirement elements are evidenced with current, attributable and sufficient design or operating evidence; no material
      mandatory element remains unsubstantiated.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence:
  - Board mandate; approved framework
  linked_play: []
  crosswalk:
  - AIRG Consultation Paper P017-2025 (Nov 2025, proposed); AI MRM Paper (Dec 2024) | A.2.2; A.3.2 | GOVERN 1.1; GOVERN 2.3 | MGF D2.1 | SAFR
    S1.2 | PA 2, PA 6
  population_and_evidence_floor: 'Population: every meeting or reserved decision in the review period, established from the governance calendar
    or decision register. Evidence floor: fewer than 3 meetings or fewer than 1 material decision available to inspect makes the operating result
    NOT TESTABLE rather than a PASS.'
  test_of_design:
  - id: D1
    text: Inspect the Board mandate/risk governance charter, AI risk framework and approval records.
  - id: D2
    text: Confirm the documents assign Board/senior-management accountability, define risk appetite/tolerance oversight, and specify decisions
      reserved for escalation/approval.
  - id: D3
    text: Confirm reporting cadence, materiality thresholds and evidence-retention responsibilities are defined. PASS when accountability, decision
      rights and reporting are formally approved and current; FAIL when any material accountability or approval boundary is missing/ambiguous;
      NOT TESTABLE when the authoritative governance artefacts cannot be obtained.
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the latest 12 months of AI risk reporting and Board/AI Risk Committee minutes, plus a risk-based sample of material AI approvals
      or risk acceptances.
  - id: O2
    text: Trace material issues, breaches and high-risk use cases to an accountable senior-management/Board decision.
  - id: O3
    text: Verify decisions, actions and overdue items were recorded and followed up. PASS when the approved governance model operated on schedule
      and material matters were escalated/decided; FAIL when required oversight, decisions or follow-up did not occur; NOT TESTABLE when records
      are unavailable.
  near_miss_failure_modes:
  - F1. Minutes record attendance and papers tabled but no decision — the body was informed rather than deciding.
  - F2. The material decision was taken outside the body and ratified afterwards, with the ratification date after the go-live date.
  - F3. Quorum was not met at the meeting where the reserved decision was taken, and the minutes do not record it.
  - F4. Actions carry an owner but no due date, and the same actions reappear across consecutive meetings without disposition.
  - F5. The mandate is approved but predates the AI scope it is claimed to cover — for example approved before agentic use cases existed.
  resolutions:
  - failure_mode: F1
    text: A minuted decision with the decision wording, the decision-maker and the date.
  - failure_mode: F2
    text: Evidence that the approval preceded the deployment, or an approved retrospective risk acceptance naming the exposure.
  - failure_mode: F3
    text: An attendance record showing quorum, or a documented out-of-cycle approval route.
  - failure_mode: F4
    text: An action log with owner, due date and closure evidence or a formal acceptance.
  - failure_mode: F5
    text: A mandate version approved after the scope change, or a scope addendum with its own approval.
  test_provenance: 'Bespoke — requirements/mas.yaml v1 (AI MRM Paper (Dec 2024) (known); AIRG Consultation Paper P017-2025 (unchecked)). Procedure:
    MAS v0.4 bespoke.'
- framework: MAS
  control_id: M1.2
  title: AI policies & guiding principles (fair, ethical, accountable, transparent use)
  requirement: The organisation maintains approved AI policies and guiding principles covering fair, ethical, accountable and transparent use,
    with defined scope, prohibited or controlled uses, ownership and review.
  requirement_source: requirements/mas.yaml
  requirement_authority: authoritative_internal_interpretation
  elements:
  - id: e1
    text: Approved AI policy and guiding principles define fair, ethical, accountable and transparent use.
    scope: programme
    applies_when: null
    locator: controls.M1.2.elements[0]
  - id: e2
    text: The policy defines scope, prohibited or controlled uses, ownership and escalation expectations.
    scope: programme
    applies_when: null
    locator: controls.M1.2.elements[1]
  - id: e3
    text: Review and change triggers are defined and the policy is linked to relevant lifecycle controls.
    scope: programme
    applies_when: null
    locator: controls.M1.2.elements[2]
  boundary:
    none: The control requirement is not evidenced beyond generic intent, policy aspiration or unrelated material.
    partial: Some applicable requirement elements are evidenced, but one or more required elements or operating evidence is missing or incomplete.
    full: All applicable requirement elements are evidenced with current, attributable and sufficient design or operating evidence; no material
      mandatory element remains unsubstantiated.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence:
  - AI use policy
  linked_play: []
  crosswalk:
  - FEAT (2018); AIRG Consultation Paper P017-2025 (Nov 2025, proposed) | A.2.2; A.2.3; A.2.4 | GOVERN 1.2; GOVERN 1.4; GOVERN 4.1 | PA 2
  population_and_evidence_floor: 'Population: all in-scope AI use cases or activities in the period, drawn from the AI inventory. Evidence floor:
    fewer than 3 sampled items, or an inventory that cannot be reconciled, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Inspect the AI policy and guiding-principles document and approval/version history.
  - id: D2
    text: Confirm it covers fair, ethical, accountable and transparent AI use, scope, prohibited/controlled uses, roles and escalation.
  - id: D3
    text: Confirm the policy is linked to relevant lifecycle controls and is reviewed on a defined cadence or material change. PASS when the principles
      are explicit, approved, current and operationally mapped; FAIL when principles or governance expectations are missing or unowned; NOT TESTABLE
      when no approved policy can be evidenced.
  test_of_operating_effectiveness:
  - id: O1
    text: Select a risk-based sample of AI use cases across materiality tiers.
  - id: O2
    text: Verify each sampled use case references/apply the relevant AI policy principles and any required attestation or approval.
  - id: O3
    text: Inspect exceptions, policy breaches and remediation. PASS when sampled use cases demonstrably follow the approved principles and exceptions
      are formally dispositioned; FAIL where use is inconsistent with policy or no exception governance exists; NOT TESTABLE where the operating
      population cannot be established.
  near_miss_failure_modes:
  - F1. The policy is approved but has no implementing procedure — nothing in the operating environment makes the requirement happen.
  - F2. Scope is written so broadly ('all AI use') that no one can tell whether a given system is in or out.
  - F3. Exceptions are granted by the same team that needs them, with no expiry.
  - F4. The policy was approved in the period but the sampled use cases predate it and were never reassessed against it.
  - F5. A breach register exists but every entry is closed as 'noted' with no remediation or acceptance.
  resolutions:
  - failure_mode: F1
    text: A named procedure, runbook or control that implements the clause, with an owner.
  - failure_mode: F2
    text: A scope statement with inclusion and exclusion criteria, or a mapping from the inventory to in-scope flag.
  - failure_mode: F3
    text: An exception record showing an independent grantor, a stated basis and an expiry date.
  - failure_mode: F4
    text: A reassessment record for pre-existing use cases, or an approved grandfathering decision.
  - failure_mode: F5
    text: A breach entry with a remediation action, owner and closure evidence, or a formal risk acceptance.
  test_provenance: 'Procedure: MAS v0.4 bespoke. Elements/boundary: archetype policy_standard — DRAFT, requirement text not yet written'
- framework: MAS
  control_id: M1.3
  title: Cross-functional AI oversight forum / AI risk committee
  requirement: A cross-functional AI governance forum has an approved mandate, membership, quorum, cadence and decision rights to oversee AI risk
    and challenge material matters.
  requirement_source: requirements/mas.yaml
  requirement_authority: authoritative_internal_interpretation
  elements:
  - id: e1
    text: Approved terms of reference define mandate, membership, quorum and AI-risk decision rights.
    scope: programme
    applies_when: null
    locator: controls.M1.3.elements[0]
  - id: e2
    text: Reporting inputs, cadence, escalation authority and conflict handling are defined.
    scope: programme
    applies_when: null
    locator: controls.M1.3.elements[1]
  - id: e3
    text: Actions, decisions and challenge records are required to be retained.
    scope: programme
    applies_when: null
    locator: controls.M1.3.elements[2]
  boundary:
    none: The control requirement is not evidenced beyond generic intent, policy aspiration or unrelated material.
    partial: Some applicable requirement elements are evidenced, but one or more required elements or operating evidence is missing or incomplete.
    full: All applicable requirement elements are evidenced with current, attributable and sufficient design or operating evidence; no material
      mandatory element remains unsubstantiated.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence:
  - Committee terms of reference; minutes
  linked_play: []
  crosswalk:
  - AI MRM Paper (Dec 2024); AIRG Consultation Paper P017-2025 (Nov 2025, proposed) | A.3.2 | GOVERN 2.1; GOVERN 4.3 | PA 4
  population_and_evidence_floor: 'Population: every meeting or reserved decision in the review period, established from the governance calendar
    or decision register. Evidence floor: fewer than 3 meetings or fewer than 1 material decision available to inspect makes the operating result
    NOT TESTABLE rather than a PASS.'
  test_of_design:
  - id: D1
    text: Inspect committee terms of reference, membership and annual calendar.
  - id: D2
    text: Confirm the forum has cross-functional representation, quorum, mandate, decision rights, conflict handling and escalation authority
      covering AI risk.
  - id: D3
    text: Confirm meeting cadence and required reporting inputs are defined. PASS when mandate, membership, quorum, cadence and decision rights
      are explicit and approved; FAIL when oversight responsibilities are materially unclear; NOT TESTABLE when the governance forum cannot be
      evidenced.
  test_of_operating_effectiveness:
  - id: O1
    text: Sample at least three recent committee meetings, including any meeting covering a high-materiality AI decision if available.
  - id: O2
    text: Verify attendance/quorum, agenda coverage, risk decisions, challenge, escalation and action tracking.
  - id: O3
    text: Trace a sample of open actions to closure or formal acceptance. PASS when meetings occurred at the required cadence with effective challenge
      and follow-through; FAIL when meetings, quorum, decisions or action tracking are materially deficient; NOT TESTABLE when minutes/attendance
      records are incomplete.
  near_miss_failure_modes:
  - F1. Minutes record attendance and papers tabled but no decision — the body was informed rather than deciding.
  - F2. The material decision was taken outside the body and ratified afterwards, with the ratification date after the go-live date.
  - F3. Quorum was not met at the meeting where the reserved decision was taken, and the minutes do not record it.
  - F4. Actions carry an owner but no due date, and the same actions reappear across consecutive meetings without disposition.
  - F5. The mandate is approved but predates the AI scope it is claimed to cover — for example approved before agentic use cases existed.
  resolutions:
  - failure_mode: F1
    text: A minuted decision with the decision wording, the decision-maker and the date.
  - failure_mode: F2
    text: Evidence that the approval preceded the deployment, or an approved retrospective risk acceptance naming the exposure.
  - failure_mode: F3
    text: An attendance record showing quorum, or a documented out-of-cycle approval route.
  - failure_mode: F4
    text: An action log with owner, due date and closure evidence or a formal acceptance.
  - failure_mode: F5
    text: A mandate version approved after the scope change, or a scope addendum with its own approval.
  test_provenance: 'Procedure: MAS v0.4 bespoke. Elements/boundary: archetype governance_body — DRAFT, requirement text not yet written'
- framework: MAS
  control_id: M1.4
  title: AI risk appetite & risk tolerance setting
  requirement: AI risk appetite and tolerance are defined, measurable and approved, with thresholds linked to escalation, decision rights and
    periodic or event-driven review.
  requirement_source: requirements/mas.yaml
  requirement_authority: authoritative_internal_interpretation
  elements:
  - id: e1
    text: Approved AI risk appetite and tolerance thresholds cover material AI risk categories.
    scope: programme
    applies_when: null
    locator: controls.M1.4.elements[0]
  - id: e2
    text: Thresholds define prohibited, tolerable and escalation conditions with named ownership.
    scope: programme
    applies_when: null
    locator: controls.M1.4.elements[1]
  - id: e3
    text: Review and change triggers for appetite/tolerance are defined.
    scope: programme
    applies_when: null
    locator: controls.M1.4.elements[2]
  boundary:
    none: The control requirement is not evidenced beyond generic intent, policy aspiration or unrelated material.
    partial: Some applicable requirement elements are evidenced, but one or more required elements or operating evidence is missing or incomplete.
    full: All applicable requirement elements are evidenced with current, attributable and sufficient design or operating evidence; no material
      mandatory element remains unsubstantiated.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence:
  - AI risk appetite statement
  linked_play: []
  crosswalk:
  - AIRG Consultation Paper P017-2025 (Nov 2025, proposed) | A.5.2 | GOVERN 1.3; MAP 1.5 | PA 4
  population_and_evidence_floor: 'Population: every meeting or reserved decision in the review period, established from the governance calendar
    or decision register. Evidence floor: fewer than 3 meetings or fewer than 1 material decision available to inspect makes the operating result
    NOT TESTABLE rather than a PASS.'
  test_of_design:
  - id: D1
    text: Inspect the AI risk appetite statement and related thresholds/metrics.
  - id: D2
    text: Confirm appetite distinguishes prohibited, tolerable and escalation conditions and addresses material AI risks relevant to the organisation.
  - id: D3
    text: Confirm ownership, approval and review/change triggers are documented. PASS when appetite is measurable, approved, attributable and
      connected to escalation; FAIL when thresholds are vague, absent or disconnected from decision rights; NOT TESTABLE when no current approved
      appetite statement exists.
  test_of_operating_effectiveness:
  - id: O1
    text: Select a sample of recent AI risk assessments, incidents or monitoring breaches.
  - id: O2
    text: Recalculate/compare reported inherent and residual risk to the approved appetite and tolerance thresholds.
  - id: O3
    text: Verify breaches were escalated, decisions recorded and temporary exceptions time-bounded. PASS when appetite actively influenced operating
      decisions and breaches were handled consistently; FAIL when risk appetite was ignored or not evidenced; NOT TESTABLE when no relevant operating
      instances exist.
  near_miss_failure_modes:
  - F1. Minutes record attendance and papers tabled but no decision — the body was informed rather than deciding.
  - F2. The material decision was taken outside the body and ratified afterwards, with the ratification date after the go-live date.
  - F3. Quorum was not met at the meeting where the reserved decision was taken, and the minutes do not record it.
  - F4. Actions carry an owner but no due date, and the same actions reappear across consecutive meetings without disposition.
  - F5. The mandate is approved but predates the AI scope it is claimed to cover — for example approved before agentic use cases existed.
  resolutions:
  - failure_mode: F1
    text: A minuted decision with the decision wording, the decision-maker and the date.
  - failure_mode: F2
    text: Evidence that the approval preceded the deployment, or an approved retrospective risk acceptance naming the exposure.
  - failure_mode: F3
    text: An attendance record showing quorum, or a documented out-of-cycle approval route.
  - failure_mode: F4
    text: An action log with owner, due date and closure evidence or a formal acceptance.
  - failure_mode: F5
    text: A mandate version approved after the scope change, or a scope addendum with its own approval.
  test_provenance: 'Procedure: MAS v0.4 bespoke. Elements/boundary: archetype governance_body — DRAFT, requirement text not yet written'
- framework: MAS
  control_id: M1.5
  title: AI literacy, culture & training across the organisation
  requirement: Role-appropriate AI literacy, training and competency requirements are defined for personnel involved in AI development, use, integration,
    risk management and oversight.
  requirement_source: requirements/mas.yaml
  requirement_authority: authoritative_internal_interpretation
  elements:
  - id: e1
    text: Role-based AI literacy and competency requirements are defined for relevant functions.
    scope: programme
    applies_when: null
    locator: controls.M1.5.elements[0]
  - id: e2
    text: Mandatory training, refresher cadence and completion requirements are defined.
    scope: programme
    applies_when: null
    locator: controls.M1.5.elements[1]
  - id: e3
    text: Overdue training, failed assessments and remediation/escalation are governed.
    scope: programme
    applies_when: null
    locator: controls.M1.5.elements[2]
  boundary:
    none: The control requirement is not evidenced beyond generic intent, policy aspiration or unrelated material.
    partial: Some applicable requirement elements are evidenced, but one or more required elements or operating evidence is missing or incomplete.
    full: All applicable requirement elements are evidenced with current, attributable and sufficient design or operating evidence; no material
      mandatory element remains unsubstantiated.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence:
  - Training plan & records
  linked_play:
  - Play 11
  crosswalk:
  - AIRG Consultation Paper P017-2025 (Nov 2025, proposed); AI MRM Paper (Dec 2024) | A.3.3; A.4.6 | GOVERN 2.2; GOVERN 4.1 | MGF D4.3, D4.4 |
    PA 2
  population_and_evidence_floor: 'Population: in-scope roles from HR or entitlement data. Evidence floor: a population taken from the training
    system roster cannot detect an omitted person — report NOT TESTABLE for completeness.'
  test_of_design:
  - id: D1
    text: Inspect the AI literacy/competency framework, role-based training curriculum and mandatory requirements.
  - id: D2
    text: Confirm content is differentiated for Board/senior management, business users, model owners/developers, risk/control functions and integrating
      users where relevant.
  - id: D3
    text: Confirm completion, refresher cadence and remediation/escalation rules are defined. PASS when role-based competency requirements and
      ownership are approved and measurable; FAIL when material roles or refresher/remediation requirements are absent; NOT TESTABLE when no controlled
      training framework exists.
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain training population and completion records for the last review period.
  - id: O2
    text: Sample required roles across business, technology, risk and oversight functions and verify completion/currentness against mandated cadence.
  - id: O3
    text: Inspect overdue training, assessment results where applicable and remediation. PASS when required personnel are trained/current and
      gaps are actively managed; FAIL when material training gaps remain unmanaged; NOT TESTABLE when role population or records cannot be reconciled.
  near_miss_failure_modes:
  - F1. Completion is 100% of enrolled, and enrolment omitted part of the in-scope population.
  - F2. Training is generic AI awareness while the role's decisions require specific control knowledge.
  - F3. Joiners completed training months after taking on the reviewing authority.
  - F4. Completion is attendance with no assessment, so competence is assumed.
  - F5. Non-completion carries a stated consequence that has never been applied.
  resolutions:
  - failure_mode: F1
    text: A reconciliation from HR or entitlement data to the training roster.
  - failure_mode: F2
    text: A content outline mapped to the role's decisions.
  - failure_mode: F3
    text: Completion dates compared to role start dates.
  - failure_mode: F4
    text: An assessment with a pass standard and results.
  - failure_mode: F5
    text: Evidence of the consequence being applied, or an approved exception.
  test_provenance: 'Procedure: MAS v0.4 bespoke. Elements/boundary: archetype training_competency — DRAFT, requirement text not yet written'
- framework: MAS
  control_id: M2.1
  title: Consistent identification of where AI is used
  requirement: The organisation consistently identifies AI use cases and routes them into the applicable governance process before deployment
    or material change.
  requirement_source: requirements/mas.yaml
  requirement_authority: authoritative_internal_interpretation
  elements:
  - id: e1
    text: AI identification and intake criteria define what is in scope and when governance entry is required.
    scope: model
    applies_when: null
    locator: controls.M2.1.elements[0]
  - id: e2
    text: Required intake fields, ownership and triage/routing are defined.
    scope: model
    applies_when: null
    locator: controls.M2.1.elements[1]
  - id: e3
    text: Controls prevent material unregistered AI from bypassing governance gates.
    scope: model
    applies_when: null
    locator: controls.M2.1.elements[2]
  boundary:
    none: The control requirement is not evidenced beyond generic intent, policy aspiration or unrelated material.
    partial: Some applicable requirement elements are evidenced, but one or more required elements or operating evidence is missing or incomplete.
    full: All applicable requirement elements are evidenced with current, attributable and sufficient design or operating evidence; no material
      mandatory element remains unsubstantiated.
  owner: AI Risk (2nd line)
  expected_evidence:
  - AI identification procedure
  linked_play:
  - Play 1
  crosswalk:
  - AI MRM Paper (Dec 2024); AIRG Consultation Paper P017-2025 (Nov 2025, proposed) | A.4.2 | GOVERN 1.6; MAP 1.1 | PA 2, PA 7
  population_and_evidence_floor: 'Population: the full register extract plus the independent reconciliation source. Evidence floor: no independent
    source, or a register extract with no as-at date or record count, makes the completeness result NOT TESTABLE rather than PASS.'
  test_of_design:
  - id: D1
    text: Inspect the AI intake/identification procedure.
  - id: D2
    text: Confirm it defines what constitutes an AI use case, scope/exclusions, entry triggers, required intake fields, ownership and the point
      at which a use case must enter governance.
  - id: D3
    text: Confirm the process prevents unregistered AI from bypassing triage. PASS when identification criteria, triggers and routing are explicit
      and controlled; FAIL when material AI use can enter production without identification; NOT TESTABLE when the procedure cannot be evidenced.
  test_of_operating_effectiveness:
  - id: O1
    text: Reconcile a sample of new projects, model procurements, production deployments and material changes to the AI inventory/intake records.
  - id: O2
    text: Identify unmatched items and trace whether they were intentionally out of scope or missed.
  - id: O3
    text: Verify required intake fields and triage occurred before the relevant lifecycle gate. PASS when sampled AI activity is consistently
      identified and routed; FAIL when material AI use is missing or entered governance too late; NOT TESTABLE when source populations cannot
      be reconciled.
  near_miss_failure_modes:
  - F1. Completeness is tested register-to-register — the register is reconciled to a list derived from itself, which can never find an omission.
  - F2. Every record was created on the same date, indicating a one-off population exercise rather than an operating process.
  - F3. Owner fields hold a team mailbox or a departed individual.
  - F4. Retired records remain in an active state downstream — decommissioned in the register but still holding credentials or serving traffic.
  - F5. The register captures models but not the prompts, tools or agents that change behaviour without a model change.
  resolutions:
  - failure_mode: F1
    text: A reconciliation from an independent source — deployment pipeline, identity provider, cost report or runtime telemetry — with exceptions
      listed.
  - failure_mode: F2
    text: Evidence of incremental record creation over the period, or an approved backfill with a completeness statement.
  - failure_mode: F3
    text: An ownership attestation naming current individuals, dated within the cadence.
  - failure_mode: F4
    text: A decommissioning record showing downstream revocation, not only the register status change.
  - failure_mode: F5
    text: A field set covering the components that can change behaviour, with at least one example populated.
  test_provenance: 'Procedure: MAS v0.4 bespoke. Elements/boundary: archetype register_inventory — DRAFT, requirement text not yet written'
- framework: MAS
  control_id: M2.2
  title: AI inventory — central register of models / use-cases / dependencies
  requirement: A central AI inventory records the AI systems or models in scope, their versions, use cases, owners, dependencies, risk tier and
    lifecycle/deployment state, and is maintained under controlled update rules.
  requirement_source: requirements/mas.yaml
  requirement_authority: authoritative_internal_interpretation
  elements:
  - id: e1
    text: The inventory schema requires a unique identifier and the key system/model, version, use-case, owner and lifecycle fields applicable
      to the deployment.
    scope: model
    applies_when: null
    locator: controls.M2.2.elements[0]
  - id: e2
    text: Inventory updates, ownership, change triggers and stale-record handling are defined.
    scope: model
    applies_when: null
    locator: controls.M2.2.elements[1]
  - id: e3
    text: The inventory is intended to reconcile to the operational AI population.
    scope: model
    applies_when: null
    locator: controls.M2.2.elements[2]
  boundary:
    none: The control requirement is not evidenced beyond generic intent, policy aspiration or unrelated material.
    partial: Some applicable requirement elements are evidenced, but one or more required elements or operating evidence is missing or incomplete.
    full: All applicable requirement elements are evidenced with current, attributable and sufficient design or operating evidence; no material
      mandatory element remains unsubstantiated.
  owner: AI Risk (2nd line)
  expected_evidence:
  - AI inventory register
  linked_play:
  - Play 1
  crosswalk:
  - AI MRM Paper (Dec 2024); AIRG Consultation Paper P017-2025 (Nov 2025, proposed) | A.4.2; A.4.3; A.4.4; A.4.5 | GOVERN 1.6 | PA 2, PA 7
  population_and_evidence_floor: 'Population: the full register extract plus the independent reconciliation source. Evidence floor: no independent
    source, or a register extract with no as-at date or record count, makes the completeness result NOT TESTABLE rather than PASS.'
  test_of_design:
  - id: D1
    text: Inspect the central AI inventory schema and procedure.
  - id: D2
    text: Confirm required fields include, as applicable, system/model and version, use case, owner, dependencies, data, risk tier, lifecycle
      state, deployment environment and key control links.
  - id: D3
    text: Confirm change/update rules, ownership and stale-record handling are defined. PASS when the inventory is central, complete-by-design,
      attributable and maintained under controlled rules; FAIL when required fields or update controls are missing; NOT TESTABLE when no controlled
      inventory exists.
  test_of_operating_effectiveness:
  - id: O1
    text: Reconcile the inventory to a sample of active production systems, development projects and recent deployments/changes.
  - id: O2

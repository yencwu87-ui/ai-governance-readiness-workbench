  test_of_design:
  - id: D1
    text: Inspect transparency standards, model-card template and stakeholder disclosure requirements.
  - id: D2
    text: Confirm the design differentiates internal users, customers/affected persons, regulators and other stakeholders, with proportionate
      explanation/disclosure requirements, material limitations and update triggers.
  - id: D3
    text: Confirm change and incident events trigger review of disclosures. PASS when transparency requirements are audience-specific, proportionate
      and maintainable; FAIL when material stakeholders or update triggers are omitted; NOT TESTABLE when no controlled transparency standard
      exists.
  test_of_operating_effectiveness:
  - id: O1
    text: Sample live AI systems and inspect the disclosures/model cards actually presented to relevant stakeholders.
  - id: O2
    text: Verify content is consistent with the deployed version/use case, includes material limitations and provides an appropriate explanation/contact
      path.
  - id: O3
    text: Trace material changes/incidents to timely disclosure/model-card updates. PASS when operating disclosures are accurate, proportionate
      and current; FAIL when material stakeholder information is missing or materially inconsistent with the deployed system; NOT TESTABLE when
      actual disclosure evidence cannot be obtained.
  near_miss_failure_modes:
  - F1. Disclosure is present in the main web journey and absent in the app, the call centre script or the partner channel.
  - F2. Disclosure sits in terms and conditions accepted at onboarding, years before the AI was introduced.
  - F3. The wording describes an earlier version of the system and overstates or understates what it does.
  - F4. A human-referral route is promised and the queue behind it is unstaffed.
  - F5. Evidence is the approved wording document rather than a capture of what the customer actually sees.

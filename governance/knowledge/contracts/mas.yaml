- framework: MAS
  control_id: M3.12
  title: Change management
  requirement: AI and model changes are controlled through documented impact assessment, testing, approval and traceability from change request
    through implementation and post-implementation verification.
  requirement_source: requirements/mas.yaml
  requirement_authority: authoritative_internal_interpretation
  elements:

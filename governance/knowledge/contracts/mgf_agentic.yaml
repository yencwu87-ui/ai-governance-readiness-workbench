- framework: MGF Agentic
  control_id: D4.3
  title: Oversight training
  requirement: Build competent human oversight
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: A training or competency requirement covering Oversight training exists
    scope: model
  - id: e2
    text: Audiences are defined by role and exposure
    scope: model
  - id: e3
    text: Content maps to the decisions those roles make
    scope: model
  - id: e4
    text: Completion is measured against an independently established population
    scope: model
  - id: e5
    text: Joiners and role changers are trained before gaining authority
    scope: model
  - id: e6
    text: Non-completion carries a defined consequence that is applied
    scope: model
  boundary:
    none: no training requirement for roles with AI decision authority.
    partial: training is required and delivered but population completeness, timing or competence measurement is not evidenced.
    full: the independently established population is complete or dispositioned, training precedes authority and competence is assessed.
  owner: Model Owner / HR (capability)
  expected_evidence: []
  linked_play:
  - Play 11
  crosswalk:
  - Capabilities & Competency | A.4 Resources | GOVERN 2.2 | MAS M1.5, M4.1 | —
  population_and_evidence_floor: 'Population: in-scope roles from HR or entitlement data. Evidence floor: a population taken from the training
    system roster cannot detect an omitted person — report NOT TESTABLE for completeness.'
  test_of_design:
  - id: D1
    text: Obtain the training or competency requirement covering Oversight training — the audiences, the content and the required frequency.
  - id: D2
    text: Confirm the audiences are defined by role and risk exposure rather than as 'all staff', and that the highest-exposure roles carry a
      deeper requirement.
  - id: D3
    text: Confirm content maps to the decisions those roles actually make, including the failure modes they are expected to catch.
  - id: D4
    text: Confirm the completion and competence measure — attendance alone, or an assessed outcome — and the consequence of non-completion.
  - id: s5
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when training is required but audiences or competence measurement is undefined.
      INADEQUATE when no requirement exists for roles with decision authority. NOT TESTABLE when the requirement is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population from HR or entitlement data rather than from a training-system roster, so people who should have been enrolled
      and were not can be found.
  - id: O2
    text: Measure completion against the population, with non-completions listed and dispositioned.
  - id: O3
    text: Verify timing for joiners and role changers relative to the point they gained the authority.
  - id: O4
    text: Where competence is assessed, inspect the assessment and the pass standard.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when the in-scope population is complete and non-completions are dispositioned. PARTIALLY EFFECTIVE when
      completion is high but the population is drawn from the training system itself. INEFFECTIVE when decision-holding roles are untrained. NOT
      TESTABLE when the population cannot be established independently.'
  near_miss_failure_modes:
  - F1. Completion is 100% of enrolled, and enrolment omitted part of the in-scope population.
  - F2. Training is generic AI awareness while the role's decisions require specific control knowledge.
  - F3. Joiners completed training months after taking on the reviewing authority.
  - F4. Completion is attendance with no assessment, so competence is assumed.
  - F5. Non-completion carries a stated consequence that has never been applied.
  resolutions:
  - failure_mode: F1
    text: A reconciliation from HR or entitlement data to the training roster.
  - failure_mode: F2
    text: A content outline mapped to the role's decisions.
  - failure_mode: F3
    text: Completion dates compared to role start dates.
  - failure_mode: F4
    text: An assessment with a pass standard and results.
  - failure_mode: F5
    text: Evidence of the consequence being applied, or an approved exception.
  test_provenance: 'Archetype: training_competency — DRAFT, requires second-line authoring and control-owner approval before authoritative use'

  elements:
  - id: e1
    text: An approved validation or evaluation method for Automation-bias countermeasures exists
    scope: model
  - id: e2
    text: Acceptance thresholds are stated before results are seen
    scope: model
  - id: e3
    text: The validator is independent of the team that built the system
    scope: model
  - id: e4
    text: The validation covers the version that was deployed
    scope: model
  - id: e5
    text: Results are supported by retained underlying data, not only a summary
    scope: model
  - id: e6
    text: Shortfalls against threshold are remediated, re-tested or formally accepted
    scope: model
  boundary:
    none: no validation, or a report with no acceptance criteria and no independence.
    partial: validation was performed but is stale against the deployed version, not independent, or thresholds and shortfall disposition are
      not evidenced.
    full: the deployed version was independently validated against pre-stated thresholds, with retained results and every shortfall remediated
      or formally accepted.
  owner: AI Risk Committee / Model Owner
  expected_evidence: []
  linked_play:
  - Play 11
  crosswalk:
  - Oversight & Accountability | A.6 AI system life cycle | GOVERN 3.2; MEASURE 3.3 | MAS M3.4 | PA 10
  population_and_evidence_floor: 'Population: all model, prompt or agent versions promoted in the period. Evidence floor: fewer than 1 validated
    version in the period, or reports with no version identifier, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the approved validation or evaluation methodology for Automation-bias countermeasures — scope, test types, datasets, metrics
      and acceptance thresholds.
  - id: D2
    text: Confirm acceptance thresholds are stated in advance of testing and are specific to the use case rather than generic.
  - id: D3
    text: 'Confirm independence: who performs the validation and how they are separated from the team that built the system.'
  - id: D4
    text: Confirm the methodology covers the failure modes the system can actually produce, including the ones a benchmark score does not capture.
  - id: D5
    text: Confirm the disposition rule — what happens when a threshold is missed, and who may accept a shortfall.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when tests are defined but thresholds are set after results, or
      independence is unclear. INADEQUATE when no acceptance criterion exists. NOT TESTABLE when the methodology is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: every model, prompt or agent version promoted in the period.'
  - id: O2
    text: For a sample, obtain the validation report and check it covers the version actually deployed — compare version identifiers and dates,
      not titles.
  - id: O3
    text: Reperform or recompute at least one reported metric from the underlying results where the data permits.
  - id: O4
    text: Trace every shortfall against threshold to a remediation, a re-test or an approved acceptance by a role with authority to grant it.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when each deployed version has independent validation against pre-stated thresholds and shortfalls are
      dispositioned. PARTIALLY EFFECTIVE when validation exists but is stale, non-independent or partly unevidenced. INEFFECTIVE when versions
      reached production unvalidated. NOT TESTABLE when the version population or the underlying results are unavailable.'
  near_miss_failure_modes:
  - F1. The validation report predates the deployed version — it validates the model that was tested, not the one that is running.
  - F2. The validator sits in the same reporting line as the builder, so 'independent review' is a signature rather than a challenge.
  - F3. The acceptance threshold was chosen after the result was known, which makes a pass unfalsifiable.
  - F4. The test set overlaps the tuning or training data, so the reported score measures memorisation.
  - F5. A metric is reported with no sample size, so a favourable number may rest on a handful of cases.
  - F6. Only aggregate performance is reported — no slice, subgroup or worst-case analysis where the control requires it.
  resolutions:
  - failure_mode: F1
    text: A validation report whose version identifier matches the deployed artefact, or a re-validation of the current version.
  - failure_mode: F2
    text: A validation performed or signed by a function outside the delivery reporting line, with the reviewer named.
  - failure_mode: F3
    text: A pre-registered threshold — an approved test plan dated before the test run.
  - failure_mode: F4
    text: A statement of dataset provenance and separation, or a held-out set with documented construction.
  - failure_mode: F5
    text: Reported metrics with denominators and confidence, or the underlying result file.
  - failure_mode: F6
    text: Slice-level results for the populations the control names.
  test_provenance: 'Archetype: validation_evaluation — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: MGF Agentic
  control_id: D2.7
  title: End-user accountability information
  requirement: Enable accountability to flow to users
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: A named body or role holds an approved mandate covering End-user accountability information
    scope: model
  - id: e2
    text: The mandate states which decisions are reserved to that body and cannot be delegated
    scope: model
  - id: e3
    text: Membership, quorum and cross-functional representation are defined
    scope: model
  - id: e4
    text: Reporting inputs, cadence and escalation thresholds are defined
    scope: model
  - id: e5
    text: Decisions taken under the mandate are recorded with a named decision-maker and date
    scope: model
  - id: e6
    text: Actions arising are tracked to closure or formal acceptance
    scope: model
  boundary:
    none: no approved mandate, or a mandate that names no accountable body and no reserved decisions.
    partial: an approved mandate exists but one or more of decision rights, quorum, cadence or escalation thresholds is absent, or the body exists
      but material decisions are not traceable to it.
    full: mandate, reserved decision rights and reporting are approved and current, and material decisions in the period are attributable to the
      body with actions tracked.
  owner: Compliance & Legal
  expected_evidence: []
  linked_play:
  - Play 11
  crosswalk:
  - Transparency & Communication | A.8 Information to interested parties | GOVERN 5.1; MAP 3.5 | MAS M3.3, F4 | SAFR S3.2 | —
  population_and_evidence_floor: 'Population: every meeting or reserved decision in the review period, established from the governance calendar
    or decision register. Evidence floor: fewer than 3 meetings or fewer than 1 material decision available to inspect makes the operating result
    NOT TESTABLE rather than a PASS.'
  test_of_design:
  - id: D1
    text: Obtain the approved terms of reference, mandate or charter covering End-user accountability information, with its approval record and
      version history.
  - id: D2
    text: Confirm the mandate names the accountable role or body, its membership and quorum, and the decisions reserved to it rather than delegated
      to a model, a vendor or the delivery team.
  - id: D3
    text: Confirm reporting inputs, cadence, materiality thresholds for escalation and evidence-retention responsibilities are stated, not implied.
  - id: D4
    text: Confirm the mandate is current — reviewed within its stated cycle, and updated for any material change in AI scope since approval.
  - id: s5
    text: 'Design verdict: ADEQUATE only when D1-D3 all hold. PARTIALLY ADEQUATE when D1 holds and one of D2-D3 is incomplete. INADEQUATE when
      decision rights or accountability cannot be located. NOT TESTABLE when the authoritative mandate is not produced — absence of the artefact
      from the evidence pack is not a design failure until its absence is confirmed by the owner.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: all meetings, decisions or approvals falling under the mandate in the review period. Establish the population
      from the calendar or register, not from the minutes supplied.'
  - id: O2
    text: Sample at least three meetings including every meeting at which a high-materiality matter was decided. Verify attendance against quorum.
  - id: O3
    text: 'Reperform: trace each sampled material AI matter to a recorded decision, a named decision-maker and a dated action, then trace open
      actions to closure or formal acceptance.'
  - id: O4
    text: Inspect any period in which the cadence was missed and the disposition of that gap.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when the body met at cadence, decided the material matters in scope, and actions were tracked. PARTIALLY
      EFFECTIVE when it operated but decisions or follow-up are incomplete. INEFFECTIVE when material matters bypassed the body. NOT TESTABLE
      when the population cannot be established.'
  near_miss_failure_modes:
  - F1. Minutes record attendance and papers tabled but no decision — the body was informed rather than deciding.
  - F2. The material decision was taken outside the body and ratified afterwards, with the ratification date after the go-live date.
  - F3. Quorum was not met at the meeting where the reserved decision was taken, and the minutes do not record it.
  - F4. Actions carry an owner but no due date, and the same actions reappear across consecutive meetings without disposition.
  - F5. The mandate is approved but predates the AI scope it is claimed to cover — for example approved before agentic use cases existed.
  resolutions:
  - failure_mode: F1
    text: A minuted decision with the decision wording, the decision-maker and the date.
  - failure_mode: F2
    text: Evidence that the approval preceded the deployment, or an approved retrospective risk acceptance naming the exposure.
  - failure_mode: F3
    text: An attendance record showing quorum, or a documented out-of-cycle approval route.
  - failure_mode: F4
    text: An action log with owner, due date and closure evidence or a formal acceptance.
  - failure_mode: F5
    text: A mandate version approved after the scope change, or a scope addendum with its own approval.
  test_provenance: 'Archetype: governance_body — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: MGF Agentic
  control_id: D3.1
  title: Least-privilege tool/data access (technical)
  requirement: Constrain capability at runtime
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The authority boundary for Least-privilege tool/data access (technical) is explicitly defined
    scope: model
  - id: e2
    text: The boundary is enforced in configuration or at runtime, not only stated in a document
    scope: model
  - id: e3
    text: Grant and approval of authority are separated from the requester
    scope: model
  - id: e4
    text: The behaviour at the boundary — block, refer or log — is approved
    scope: model
  - id: e5
    text: Overrides are approved by a role with authority and carry a recorded reason
    scope: model
  - id: e6
    text: Granted authority is recertified on a defined cadence and revocations take effect
    scope: model
  boundary:
    none: no defined boundary, or authority granted with no approval.
    partial: the boundary is defined and approved but enforcement, override discipline or recertification is not evidenced.
    full: the enforced boundary matches the approved boundary, overrides are independently approved with reasons, and recertification demonstrably
      revokes.
  owner: Model Developer / InfoSec
  expected_evidence: []
  linked_play:
  - Play 3
  crosswalk:
  - 'Lifecycle: Development & Validation | A.6 AI system life cycle | MANAGE 2.3; MEASURE 2.7 | MAS M3.7 | SAFR S1.4 | PA 3, PA 8'
  population_and_evidence_floor: 'Population: the enforced configuration plus all grants and all boundary events in the period. Evidence floor:
    no enforced configuration export, or zero boundary events with no enforcement test, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the definition of the authority boundary for Least-privilege tool/data access (technical) — permitted actions, counterparties,
      value or exposure limits, data scope and the systems it may write to.
  - id: D2
    text: Confirm the boundary is expressed where it is enforced, not only in a document — a configuration, a policy object or a runtime guardrail.
  - id: D3
    text: Confirm who grants and who approves a change to the boundary, and that the two are separated from the requester.
  - id: D4
    text: 'Confirm what happens at the boundary: hard block, human referral or log-and-continue, and that the choice is approved.'
  - id: D5
    text: Confirm periodic recertification of granted authority, with a defined cadence and an accountable reviewer.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when limits are documented but not enforced, or recertification is absent.
      INADEQUATE when no boundary is defined. NOT TESTABLE when the authoritative definition is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the enforced configuration as at a date and compare it, field by field, to the approved boundary.
  - id: O2
    text: Define the population of granted access or mandate holders, and reconcile it to the approved grants — in the direction of finding grants
      nobody approved.
  - id: O3
    text: 'Sample boundary events in the period: blocks, referrals and overrides. Trace each override to an approver with authority and a recorded
      reason.'
  - id: O4
    text: Where no boundary event occurred, test the enforcement — a controlled attempt or an equivalent assurance that the limit binds.
  - id: O5
    text: Inspect the most recent recertification for completeness and for revocations actually taking effect.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when enforced limits match approved limits, overrides are approved and recertification took effect. PARTIALLY
      EFFECTIVE when the boundary holds but grants are stale or overrides are unevidenced. INEFFECTIVE when unapproved authority is found in production.
      NOT TESTABLE when the enforced configuration cannot be obtained.'
  near_miss_failure_modes:
  - F1. The limit is in a policy document and nowhere in the running system, so nothing stops the action.
  - F2. The enforced value is more permissive than the approved value, changed by a ticket that never reached the approver.
  - F3. Overrides are recorded but the approver is the same identity that requested the action.
  - F4. Recertification was completed as an attestation with no revocations, across a population where joiners and leavers certainly occurred.
  - F5. The agent holds standing credentials broader than its mandate because the mandate is enforced at the orchestration layer and the credential
    is not.
  - F6. Limits bind per transaction but not in aggregate, so the boundary is passable by repetition.
  resolutions:
  - failure_mode: F1
    text: An export of the enforced configuration or policy object showing the limit in force.
  - failure_mode: F2
    text: A reconciliation of enforced versus approved values with any deviation approved retrospectively.
  - failure_mode: F3
    text: An override record naming a distinct approver and the reason.
  - failure_mode: F4
    text: A recertification with revocation evidence at the target system, not only the sign-off sheet.
  - failure_mode: F5
    text: An entitlement review of the credential itself, scoped to the mandate.
  - failure_mode: F6
    text: An aggregate or cumulative limit in the enforced configuration, with evidence of its operation.
  test_provenance: 'Archetype: access_authority — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: MGF Agentic
  control_id: D3.2
  title: Secure sandboxed environment
  requirement: Contain agents during build/test
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: Security or resilience requirements covering Secure sandboxed environment are defined
    scope: model
  - id: e2
    text: AI-specific threat paths are in scope, including injection through retrieved or tool-returned content
    scope: model
  - id: e3
    text: The instruction-versus-data trust boundary is stated and enforced
    scope: model
  - id: e4
    text: Testing is performed against the deployed version by an independent party
    scope: model
  - id: e5
    text: Findings are remediated, re-tested or formally accepted with an expiry
    scope: model
  - id: e6
    text: Runtime evidence shows the boundary holding
    scope: model
  boundary:
    none: no AI-specific security requirement, or no testing covering the AI components.
    partial: requirements and testing exist but scope, currency, enforcement or finding disposition is not evidenced.
    full: current independent testing covers the AI paths, the trust boundary is enforced outside the model, and findings are dispositioned with
      expiry.
  owner: Model Developer / InfoSec
  expected_evidence: []
  linked_play:
  - Play 3
  crosswalk:
  - 'Lifecycle: Development & Validation | A.6 AI system life cycle | MANAGE 2.3; MEASURE 2.7 | MAS M3.7 | SAFR S2.6 | PA 3, PA 8'
  population_and_evidence_floor: 'Population: current testing reports plus runtime security events in the period. Evidence floor: testing that
    predates the current architecture, or zero runtime events with no test, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the security or resilience requirement covering Secure sandboxed environment — the threats in scope, the controls required and
      the assurance route.
  - id: D2
    text: 'Confirm AI-specific threats are addressed, not only conventional application security: prompt injection through retrieved or tool-returned
      content, tool misuse, model or supply-chain compromise, data exfiltration through generated output.'
  - id: D3
    text: Confirm the trust boundary is stated — which content the system treats as instruction and which as data — and what enforces it.
  - id: D4
    text: Confirm testing type, frequency and independence, and the disposition route for findings.
  - id: D5
    text: 'Confirm resilience requirements where applicable: degraded-mode behaviour, dependency failure and recovery objectives.'
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when conventional security is covered but AI-specific threat paths are
      absent. INADEQUATE when no threats are identified. NOT TESTABLE when the requirement is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the most recent testing covering the current architecture, and confirm its scope includes the AI components and their tool and
      data paths.
  - id: O2
    text: Verify the testing was performed against the deployed version, by a party independent of the builder.
  - id: O3
    text: Trace every material finding to remediation, re-test or an approved, time-bound acceptance.
  - id: O4
    text: Sample runtime evidence that the trust boundary holds — blocked injection attempts, refused tool calls, egress controls.
  - id: O5
    text: Verify degraded-mode and recovery behaviour was exercised where required.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when current, independent testing covers the AI paths and findings are dispositioned. PARTIALLY EFFECTIVE
      when testing exists but is stale, narrow or findings remain open past target. INEFFECTIVE when the AI components were never in scope. NOT
      TESTABLE when testing reports are unavailable.'
  near_miss_failure_modes:
  - F1. The penetration test covers the web application and stops at the API, leaving the model, its tools and its retrieval path untested.
  - F2. Testing predates the current architecture — new tools or data sources were added after the last test.
  - F3. Injection defences are described as prompt-level instructions to the model, which is guidance rather than enforcement.
  - F4. Findings are closed as 'risk accepted' with no expiry and no named acceptor.
  - F5. Zero blocked attempts is offered as evidence of safety, with no test showing the defence would block.
  - F6. The system treats retrieved document content and tool output as trusted instruction.
  resolutions:
  - failure_mode: F1
    text: A test scope section naming the model, tool and retrieval components.
  - failure_mode: F2
    text: A test dated after the most recent architectural change.
  - failure_mode: F3
    text: An enforcement point outside the model — an allowlist, a schema check, a policy layer — with evidence of operation.
  - failure_mode: F4
    text: An acceptance record with a named acceptor and an expiry date.
  - failure_mode: F5
    text: A controlled injection test with the blocked result retained.
  - failure_mode: F6
    text: A design statement and runtime evidence separating instruction from data.
  test_provenance: 'Archetype: security_resilience — DRAFT, requires second-line authoring and control-owner approval before authoritative use'

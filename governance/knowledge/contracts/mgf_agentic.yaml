  - id: e6
    text: Post-incident review produced actions traced to closure or to a control change
    scope: model
  boundary:
    none: no AI incident procedure, or no trigger and no containment path.
    partial: the procedure exists and events were handled, but timings, containment effectiveness or lessons-to-controls are not evidenced.
    full: incidents were detected and escalated within target, containment demonstrably took effect, and post-incident actions changed the controls
      they implicate.
  owner: Model Owner / AI Risk (2nd line)
  expected_evidence: []
  linked_play:
  - Play 5, 6
  crosswalk:
  - 'Lifecycle: Deployment & Monitoring | A.6 AI system life cycle | MANAGE 4.1, 4.2 | MAS M3.11 | SAFR S2.6 | PA 10'
  population_and_evidence_floor: 'Population: all incidents and near misses in the period, cross-checked against alerts, overrides and complaints.
    Evidence floor: zero incidents and no exercise means the mechanism is untested — report NOT TESTABLE rather than PASS.'
  test_of_design:
  - id: D1
    text: Obtain the incident or escalation procedure covering Emergent-risk response mechanisms — what constitutes an AI incident, severity criteria,
      and the trigger for invoking it.
  - id: D2
    text: Confirm AI-specific incident types are named, not only availability and security — for example harmful output, mandate breach, unexpected
      autonomous action, drift beyond tolerance.
  - id: D3
    text: Confirm roles, notification paths, timeframes per severity and the authority to contain or halt.
  - id: D4
    text: Confirm the containment mechanism is specified and testable, including who may invoke it and how quickly it takes effect.
  - id: D5
    text: Confirm post-incident review, root cause and the route by which lessons change a control.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when the procedure is generic and does not name AI failure types, or containment
      authority is unclear. INADEQUATE when no trigger or severity scheme exists. NOT TESTABLE when the procedure is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of incidents and near misses in the period from the incident system, and cross-check against monitoring alerts
      and complaint or override records for events that were never raised as incidents.
  - id: O2
    text: Sample incidents and verify detection-to-notification and notification-to-containment times against the stated targets.
  - id: O3
    text: Verify containment was invoked by an authorised role and took effect, with evidence from the system rather than the ticket.
  - id: O4
    text: Trace post-incident actions to closure and to any control change they required.
  - id: O5
    text: Where no incident occurred, test the mechanism — an exercise, a tabletop with evidence, or a controlled invocation in a non-production
      environment.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when incidents were detected, escalated within target and contained, with lessons carried into controls.
      PARTIALLY EFFECTIVE when handling occurred but timings or closure are unevidenced. INEFFECTIVE when events were not raised or containment
      failed. NOT TESTABLE when no incident and no exercise occurred in the period.'
  near_miss_failure_modes:
  - F1. Zero AI incidents in the period is presented as strength, with no near-miss capture and no exercise to show the process would engage.
  - F2. Events appear in the monitoring or complaint records but were never raised as incidents, so the population is understated.
  - F3. The kill switch is documented but has never been invoked, and no one can state how long it takes to take effect.
  - F4. Severity was assigned after resolution, and always at a level that avoided external notification.
  - F5. Post-incident actions are closed as 'awareness raised' with no control change.
  - F6. Containment is evidenced by a ticket status rather than by system evidence that the agent stopped acting.
  resolutions:
  - failure_mode: F1
    text: A near-miss register, or an exercise report with date, participants and observed timings.
  - failure_mode: F2
    text: A reconciliation from alerts and complaints to incidents, with any unraised events explained.
  - failure_mode: F3
    text: A containment test with a measured time to effect.
  - failure_mode: F4
    text: A severity assignment dated at detection, with the criteria applied.
  - failure_mode: F5
    text: A post-incident action that amended a control, with the amended control identified.
  - failure_mode: F6
    text: System evidence of containment — revoked credentials, disabled route, halted queue.
  test_provenance: 'Archetype: incident_escalation — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: MGF Agentic
  control_id: D4.1
  title: Transparency to interacting users
  requirement: Let users understand who/what they deal with
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: A disclosure requirement covering Transparency to interacting users is defined and approved
    scope: model
  - id: e2
    text: Required content is specified, including limitations and recourse where applicable
    scope: model
  - id: e3
    text: Trigger and timing relative to the interaction are defined
    scope: model
  - id: e4
    text: Disclosure is delivered in every in-scope channel
    scope: model
  - id: e5
    text: The wording is current against system behaviour
    scope: model
  - id: e6
    text: Any promised recourse route works and is answered
    scope: model
  boundary:
    none: no disclosure requirement, or in-scope interactions with no disclosure.
    partial: disclosure is required and present in some channels, but coverage, timing or currency is not evidenced.
    full: approved, current disclosure is delivered at the right point in every in-scope channel, with any promised recourse demonstrably working.
  owner: Model Owner / Compliance
  expected_evidence: []
  linked_play:
  - Play 11
  crosswalk:
  - Transparency & Communication | A.8 Information to interested parties | GOVERN 5.1; MAP 3.5 | MAS M3.3, F4 | SAFR S3.2 | —
  population_and_evidence_floor: 'Population: all in-scope channels and interaction types in the period. Evidence floor: fewer than all channels
    observed, or observation from specification rather than delivery, makes the operating result NOT TESTABLE for the unobserved channels.'
  test_of_design:
  - id: D1
    text: Obtain the disclosure or transparency requirement for Transparency to interacting users — who must be told what, at what point, and
      in what form.
  - id: D2
    text: 'Confirm the content requirement is specific: that AI is in use, what it does, its limitations, and the route to a human or to contest
      an outcome, as applicable.'
  - id: D3
    text: Confirm the trigger and timing relative to the interaction or decision.
  - id: D4
    text: Confirm who approves the wording and how it is kept current when the system changes.
  - id: s5
    text: 'Design verdict: ADEQUATE when D1-D3 hold. PARTIALLY ADEQUATE when a disclosure requirement exists but content or timing is unspecified.
      INADEQUATE when no requirement is defined for an in-scope interaction. NOT TESTABLE when the requirement is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of in-scope interactions, channels or decisions in the period.
  - id: O2
    text: Observe the disclosure as delivered in each channel rather than as specified — capture the live artefact.
  - id: O3
    text: 'Verify timing: the disclosure precedes or accompanies the interaction rather than appearing in terms accepted long before.'
  - id: O4
    text: 'Verify currency: the wording matches the system''s current behaviour and limitations.'
  - id: O5
    text: Where contest or human-referral is promised, test that the route works and is answered.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when disclosure was delivered in every in-scope channel, on time, accurately and with working recourse.
      PARTIALLY EFFECTIVE when delivered inconsistently across channels or out of date. INEFFECTIVE when in-scope interactions carried no disclosure.
      NOT TESTABLE when the channel population cannot be established.'
  near_miss_failure_modes:
  - F1. Disclosure is present in the main web journey and absent in the app, the call centre script or the partner channel.
  - F2. Disclosure sits in terms and conditions accepted at onboarding, years before the AI was introduced.
  - F3. The wording describes an earlier version of the system and overstates or understates what it does.
  - F4. A human-referral route is promised and the queue behind it is unstaffed.
  - F5. Evidence is the approved wording document rather than a capture of what the customer actually sees.
  resolutions:
  - failure_mode: F1
    text: A per-channel capture of the delivered disclosure.
  - failure_mode: F2
    text: A disclosure at the point of interaction, dated after the AI introduction.
  - failure_mode: F3
    text: A wording review dated after the most recent material system change.
  - failure_mode: F4
    text: Response-time evidence for the recourse route.
  - failure_mode: F5
    text: A screenshot, recording or transcript from the live channel.
  test_provenance: 'Archetype: disclosure_transparency — DRAFT, requires second-line authoring and control-owner approval before authoritative
    use'

- framework: MGF Agentic
  control_id: D3.6
  title: Plan & reasoning logging
  requirement: Make agent intent inspectable
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: A logging or traceability design covering Plan & reasoning logging exists
    scope: model
  - id: e2
    text: Captured fields allow a past action to be reconstructed, including the version and the acting identity
    scope: model
  - id: e3
    text: Amendment and deletion are restricted and detectable
    scope: model
  - id: e4
    text: Retention meets the longest applicable obligation
    scope: model
  - id: e5
    text: Capture was continuous across the period
    scope: model
  - id: e6
    text: A real past event has been reconstructed from the retained records
    scope: model
  boundary:
    none: no logging, or logging that cannot attribute an action to a system, version or identity.
    partial: logging operates but reconstruction requires supplementation, or integrity and retention are not evidenced.
    full: a real event has been reconstructed end to end from retained, integrity-protected records within the stated retrieval time.
  owner: Model Owner / AI Risk (2nd line)
  expected_evidence: []
  linked_play:
  - Play 3, 5
  crosswalk:
  - 'Lifecycle: Deployment & Monitoring | A.6 AI system life cycle | MEASURE 3.1; MAP 1.1 | MAS M3.8 | SAFR S3.1 | —'
  population_and_evidence_floor: 'Population: the logged record set for the period, plus at least one real event selected for reconstruction.
    Evidence floor: no reconstruction attempt makes the operating result NOT TESTABLE — the existence of logs is a design fact, not an operating
    one.'
  test_of_design:
  - id: D1
    text: Obtain the logging or traceability design for Plan & reasoning logging — what is captured, at what granularity, where it is stored and
      for how long.
  - id: D2
    text: Confirm the captured fields are sufficient to reconstruct a specific decision or action after the fact, including the inputs, the version
      in force and the identity that acted.
  - id: D3
    text: Confirm integrity controls — who can amend or delete, and how tampering would be detected.
  - id: D4
    text: Confirm retention meets the longest applicable obligation and that retrieval within a stated time is possible.
  - id: s5
    text: 'Design verdict: ADEQUATE when D1-D3 hold. PARTIALLY ADEQUATE when capture is defined but integrity or retention is not. INADEQUATE
      when reconstruction is impossible from the defined fields. NOT TESTABLE when the design is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Select a specific past event — an incident, a material decision or a random production action — and attempt reconstruction end to end
      from the logs alone.
  - id: O2
    text: 'Verify completeness across the period: sampling intervals, volumes and any interruption in capture.'
  - id: O3
    text: 'Test integrity: confirm access to amend is restricted and inspect any amendment record.'
  - id: O4
    text: Test retrieval against the stated time and confirm records at the oldest end of the retention window are still retrievable.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when a real event can be reconstructed from retained records within the stated time. PARTIALLY EFFECTIVE
      when reconstruction succeeds with gaps or manual supplementation. INEFFECTIVE when the event cannot be reconstructed. NOT TESTABLE when
      no suitable event exists in the period.'
  near_miss_failure_modes:
  - F1. Logs exist but hold no version identifier, so it is impossible to say which model or prompt produced the output.
  - F2. The acting identity is a shared service account for every action, so attribution stops at the platform.
  - F3. Reconstruction requires a person's recollection or a chat thread to fill the gap between records.
  - F4. Retention is set below the obligation, or the oldest records are technically retained but not retrievable.
  - F5. Administrators can amend the records with no separate audit of the amendment.
  - F6. Prompt and tool-call content is not captured, so only the outcome is visible and not the reasoning path.
  resolutions:
  - failure_mode: F1
    text: A log schema including model, prompt and configuration version, with a populated example.
  - failure_mode: F2
    text: Per-actor identity in the record, or a documented mapping from service account to the initiating human or agent.
  - failure_mode: F3
    text: A reconstruction walkthrough of a real event using only retained records.
  - failure_mode: F4
    text: A retention configuration matching the obligation and a successful retrieval from the oldest window.
  - failure_mode: F5
    text: An access review of amendment rights plus an immutable or separately audited amendment trail.
  - failure_mode: F6
    text: Captured prompt and tool-call records for a sampled action.
  test_provenance: 'Archetype: logging_traceability — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: MGF Agentic
  control_id: D3.7  ★
  title: Structural / rule-based controls
  requirement: Use controls that can't be prompted away
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The authority boundary for Structural / rule-based controls is explicitly defined
    scope: model
  - id: e2
    text: The boundary is enforced in configuration or at runtime, not only stated in a document
    scope: model
  - id: e3
    text: Grant and approval of authority are separated from the requester
    scope: model
  - id: e4
    text: The behaviour at the boundary — block, refer or log — is approved
    scope: model
  - id: e5
    text: Overrides are approved by a role with authority and carry a recorded reason
    scope: model
  - id: e6
    text: Granted authority is recertified on a defined cadence and revocations take effect
    scope: model
  boundary:
    none: no defined boundary, or authority granted with no approval.
    partial: the boundary is defined and approved but enforcement, override discipline or recertification is not evidenced.
    full: the enforced boundary matches the approved boundary, overrides are independently approved with reasons, and recertification demonstrably
      revokes.
  owner: Model Developer / InfoSec
  expected_evidence: []
  linked_play:
  - Play 3
  crosswalk:
  - 'Lifecycle: Development & Validation | A.6 AI system life cycle | MANAGE 2.3; MEASURE 2.7 | MAS M3.7 | SAFR S1.4 | PA 3, PA 8'
  population_and_evidence_floor: 'Population: the enforced configuration plus all grants and all boundary events in the period. Evidence floor:
    no enforced configuration export, or zero boundary events with no enforcement test, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the definition of the authority boundary for Structural / rule-based controls — permitted actions, counterparties, value or exposure
      limits, data scope and the systems it may write to.
  - id: D2
    text: Confirm the boundary is expressed where it is enforced, not only in a document — a configuration, a policy object or a runtime guardrail.
  - id: D3
    text: Confirm who grants and who approves a change to the boundary, and that the two are separated from the requester.
  - id: D4
    text: 'Confirm what happens at the boundary: hard block, human referral or log-and-continue, and that the choice is approved.'
  - id: D5
    text: Confirm periodic recertification of granted authority, with a defined cadence and an accountable reviewer.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when limits are documented but not enforced, or recertification is absent.
      INADEQUATE when no boundary is defined. NOT TESTABLE when the authoritative definition is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the enforced configuration as at a date and compare it, field by field, to the approved boundary.
  - id: O2
    text: Define the population of granted access or mandate holders, and reconcile it to the approved grants — in the direction of finding grants
      nobody approved.
  - id: O3
    text: 'Sample boundary events in the period: blocks, referrals and overrides. Trace each override to an approver with authority and a recorded
      reason.'
  - id: O4
    text: Where no boundary event occurred, test the enforcement — a controlled attempt or an equivalent assurance that the limit binds.
  - id: O5
    text: Inspect the most recent recertification for completeness and for revocations actually taking effect.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when enforced limits match approved limits, overrides are approved and recertification took effect. PARTIALLY
      EFFECTIVE when the boundary holds but grants are stale or overrides are unevidenced. INEFFECTIVE when unapproved authority is found in production.
      NOT TESTABLE when the enforced configuration cannot be obtained.'
  near_miss_failure_modes:
  - F1. The limit is in a policy document and nowhere in the running system, so nothing stops the action.
  - F2. The enforced value is more permissive than the approved value, changed by a ticket that never reached the approver.
  - F3. Overrides are recorded but the approver is the same identity that requested the action.
  - F4. Recertification was completed as an attestation with no revocations, across a population where joiners and leavers certainly occurred.
  - F5. The agent holds standing credentials broader than its mandate because the mandate is enforced at the orchestration layer and the credential
    is not.
  - F6. Limits bind per transaction but not in aggregate, so the boundary is passable by repetition.
  resolutions:
  - failure_mode: F1
    text: An export of the enforced configuration or policy object showing the limit in force.
  - failure_mode: F2
    text: A reconciliation of enforced versus approved values with any deviation approved retrospectively.
  - failure_mode: F3
    text: An override record naming a distinct approver and the reason.
  - failure_mode: F4
    text: A recertification with revocation evidence at the target system, not only the sign-off sheet.
  - failure_mode: F5
    text: An entitlement review of the credential itself, scoped to the mandate.
  - failure_mode: F6
    text: An aggregate or cumulative limit in the enforced configuration, with evidence of its operation.
  test_provenance: 'Archetype: access_authority — DRAFT, requires second-line authoring and control-owner approval before authoritative use'

  test_of_design:
  - id: D1
    text: Obtain the data requirement covering System requirements (e.g., the system shall respect the privacy of its users) are elicited from
      and understood by relevant AI actors. Design decisions take socio-technical implications into account to address AI risks — which datasets
      are in scope, the quality attributes required and the lineage that must be recorded.
  - id: D2
    text: Confirm the permitted-use basis for each source is established, including personal data, licensed data and data whose terms restrict
      model training.
  - id: D3
    text: Confirm quality criteria are measurable and have thresholds, rather than aspirational adjectives.
  - id: D4
    text: Confirm retention, deletion and the handling of data-subject or contractual deletion requests where a model or index has already absorbed
      the data.
  - id: D5
    text: Confirm who approves a new data source into the system.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when quality criteria exist without thresholds, or deletion in the model
      or index is unaddressed. INADEQUATE when permitted use is undefined. NOT TESTABLE when the requirement is not produced.'

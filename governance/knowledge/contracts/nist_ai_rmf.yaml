- framework: NIST AI RMF
  control_id: GOVERN 2.1
  title: Roles and responsibilities and lines of communication related to mapping, measuring and managing AI risks are documented and are clear
    to individuals and teams throughout the organization.
  requirement: Roles and responsibilities and lines of communication related to mapping, measuring and managing AI risks are documented and are
    clear to individuals and teams throughout the organization.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: A named body or role holds an approved mandate covering Roles and responsibilities and lines of communication related to mapping, measuring
      and managing AI risks are documented and are clear to individuals and teams throughout the organization
    scope: model
  - id: e2
    text: The mandate states which decisions are reserved to that body and cannot be delegated
    scope: model
  - id: e3
    text: Membership, quorum and cross-functional representation are defined
    scope: model
  - id: e4
    text: Reporting inputs, cadence and escalation thresholds are defined
    scope: model
  - id: e5
    text: Decisions taken under the mandate are recorded with a named decision-maker and date
    scope: model
  - id: e6
    text: Actions arising are tracked to closure or formal acceptance
    scope: model
  boundary:
    none: no approved mandate, or a mandate that names no accountable body and no reserved decisions.
    partial: an approved mandate exists but one or more of decision rights, quorum, cadence or escalation thresholds is absent, or the body exists
      but material decisions are not traceable to it.
    full: mandate, reserved decision rights and reporting are approved and current, and material decisions in the period are attributable to the
      body with actions tracked.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence: []
  linked_play: []
  crosswalk: []
  population_and_evidence_floor: 'Population: every meeting or reserved decision in the review period, established from the governance calendar
    or decision register. Evidence floor: fewer than 3 meetings or fewer than 1 material decision available to inspect makes the operating result
    NOT TESTABLE rather than a PASS.'
  test_of_design:
  - id: D1
    text: Obtain the approved terms of reference, mandate or charter covering Roles and responsibilities and lines of communication related to
      mapping, measuring and managing AI risks are documented and are clear to individuals and teams throughout the organization, with its approval
      record and version history.
  - id: D2
    text: Confirm the mandate names the accountable role or body, its membership and quorum, and the decisions reserved to it rather than delegated
      to a model, a vendor or the delivery team.
  - id: D3
    text: Confirm reporting inputs, cadence, materiality thresholds for escalation and evidence-retention responsibilities are stated, not implied.
  - id: D4
    text: Confirm the mandate is current — reviewed within its stated cycle, and updated for any material change in AI scope since approval.
  - id: s5
    text: 'Design verdict: ADEQUATE only when D1-D3 all hold. PARTIALLY ADEQUATE when D1 holds and one of D2-D3 is incomplete. INADEQUATE when
      decision rights or accountability cannot be located. NOT TESTABLE when the authoritative mandate is not produced — absence of the artefact
      from the evidence pack is not a design failure until its absence is confirmed by the owner.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: all meetings, decisions or approvals falling under the mandate in the review period. Establish the population
      from the calendar or register, not from the minutes supplied.'
  - id: O2
    text: Sample at least three meetings including every meeting at which a high-materiality matter was decided. Verify attendance against quorum.
  - id: O3
    text: 'Reperform: trace each sampled material AI matter to a recorded decision, a named decision-maker and a dated action, then trace open
      actions to closure or formal acceptance.'
  - id: O4
    text: Inspect any period in which the cadence was missed and the disposition of that gap.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when the body met at cadence, decided the material matters in scope, and actions were tracked. PARTIALLY
      EFFECTIVE when it operated but decisions or follow-up are incomplete. INEFFECTIVE when material matters bypassed the body. NOT TESTABLE
      when the population cannot be established.'
  near_miss_failure_modes:
  - F1. Minutes record attendance and papers tabled but no decision — the body was informed rather than deciding.
  - F2. The material decision was taken outside the body and ratified afterwards, with the ratification date after the go-live date.
  - F3. Quorum was not met at the meeting where the reserved decision was taken, and the minutes do not record it.
  - F4. Actions carry an owner but no due date, and the same actions reappear across consecutive meetings without disposition.
  - F5. The mandate is approved but predates the AI scope it is claimed to cover — for example approved before agentic use cases existed.
  resolutions:
  - failure_mode: F1
    text: A minuted decision with the decision wording, the decision-maker and the date.
  - failure_mode: F2
    text: Evidence that the approval preceded the deployment, or an approved retrospective risk acceptance naming the exposure.
  - failure_mode: F3
    text: An attendance record showing quorum, or a documented out-of-cycle approval route.
  - failure_mode: F4
    text: An action log with owner, due date and closure evidence or a formal acceptance.
  - failure_mode: F5
    text: A mandate version approved after the scope change, or a scope addendum with its own approval.
  test_provenance: 'Archetype: governance_body — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: NIST AI RMF
  control_id: GOVERN 2.2
  title: The organization's personnel and partners receive AI risk management training to enable them to perform their duties and responsibilities
    consistent with related policies, procedures and agreements.
  requirement: The organization's personnel and partners receive AI risk management training to enable them to perform their duties and responsibilities
    consistent with related policies, procedures and agreements.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: An approved, current policy or standard covering The organization's personnel and partners receive AI risk management training to enable
      them to perform their duties and responsibilities consistent with related policies, procedures and agreements exists
    scope: model
  - id: e2
    text: Its scope names the systems, models or uses it binds
    scope: model
  - id: e3
    text: An accountable owner is named
    scope: model
  - id: e4
    text: Prohibited or controlled uses and the consequence of non-compliance are stated
    scope: model
  - id: e5
    text: An exception route with grantor, basis, expiry and record location is defined
    scope: model
  - id: e6
    text: In-scope activity in the period followed the policy, or holds a live exception
    scope: model
  boundary:
    none: no approved policy, or a document with no owner and no scope.
    partial: an approved policy exists but lacks an exception route, an implementing control, or sampled activity does not consistently follow
      it.
    full: the policy is approved, current, scoped, owned, implemented by a named control, and sampled activity follows it with exceptions governed.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence: []
  linked_play: []
  crosswalk: []
  population_and_evidence_floor: 'Population: all in-scope AI use cases or activities in the period, drawn from the AI inventory. Evidence floor:
    fewer than 3 sampled items, or an inventory that cannot be reconciled, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the approved policy or standard covering The organization's personnel and partners receive AI risk management training to enable
      them to perform their duties and responsibilities consistent with related policies, procedures and agreements, with its approval record,
      owner and version history.
  - id: D2
    text: Confirm it states scope (which systems, models and uses it binds), prohibited and controlled uses, the accountable owner and the consequence
      of non-compliance.
  - id: D3
    text: Confirm it defines the exception route — who may grant one, on what basis, for how long, and where exceptions are recorded.
  - id: D4
    text: Confirm the review cycle and the triggers for out-of-cycle review, and that the document is within its cycle.
  - id: D5
    text: Confirm the policy is mapped to the controls, plays or procedures that implement it, so a requirement is not left with nothing that
      operates it.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 hold and D5 identifies at least one implementing control. PARTIALLY ADEQUATE when the policy exists
      but the exception route or implementing link is absent. INADEQUATE when scope or ownership is undefined. NOT TESTABLE when the approved
      document is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: AI use cases, systems or activities in scope of the policy during the period, taken from the AI inventory rather
      than from a list supplied by the assessed team.'
  - id: O2
    text: Sample across materiality tiers and include at least one use case that went live in the period.
  - id: O3
    text: 'Reperform: verify each sampled item was assessed against the policy at the required point, and that any required attestation or approval
      exists and predates the activity.'
  - id: O4
    text: Inspect the exception and breach records for the period — verify each is dated, owned, time-bound and dispositioned.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when sampled use follows the approved policy and exceptions are governed. PARTIALLY EFFECTIVE when compliance
      is inconsistent or exceptions are open past expiry. INEFFECTIVE when the policy was bypassed for material use. NOT TESTABLE when the in-scope
      population cannot be established.'
  near_miss_failure_modes:
  - F1. The policy is approved but has no implementing procedure — nothing in the operating environment makes the requirement happen.
  - F2. Scope is written so broadly ('all AI use') that no one can tell whether a given system is in or out.
  - F3. Exceptions are granted by the same team that needs them, with no expiry.
  - F4. The policy was approved in the period but the sampled use cases predate it and were never reassessed against it.
  - F5. A breach register exists but every entry is closed as 'noted' with no remediation or acceptance.
  resolutions:
  - failure_mode: F1
    text: A named procedure, runbook or control that implements the clause, with an owner.
  - failure_mode: F2
    text: A scope statement with inclusion and exclusion criteria, or a mapping from the inventory to in-scope flag.
  - failure_mode: F3
    text: An exception record showing an independent grantor, a stated basis and an expiry date.
  - failure_mode: F4
    text: A reassessment record for pre-existing use cases, or an approved grandfathering decision.
  - failure_mode: F5
    text: A breach entry with a remediation action, owner and closure evidence, or a formal risk acceptance.
  test_provenance: 'Archetype: policy_standard — DRAFT, requires second-line authoring and control-owner approval before authoritative use'

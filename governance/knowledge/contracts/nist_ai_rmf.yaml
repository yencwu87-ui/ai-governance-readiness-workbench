    that case.'
  test_of_design:
  - id: D1
    text: Obtain the change or release procedure covering Processes and procedures are in place for decommissioning and phasing out AI systems
      safely and in a manner that does not increase risks or decrease the organization's trustworthiness — change classes, required approvals
      per class, testing gates and the record fields captured.
  - id: D2

  requirement: The specific tasks and methods used to implement the tasks that the AI system will support are defined (e.g., classifiers, generative
    models, recommenders).
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: An approved methodology for The specific tasks and methods used to implement the tasks that the AI system will support are defined (e.g.,
      classifiers, generative models, recommenders) exists with defined criteria
    scope: model
  - id: e2
    text: Tier or outcome thresholds are stated by rule rather than by unaided judgement
    scope: model
  - id: e3
    text: The assessment is required before the decision it informs
    scope: model
  - id: e4
    text: The outcome is approved by a role independent of the requester
    scope: model

  owner: Indep. Validation / InfoSec
  expected_evidence: []
  linked_play: []
  crosswalk: []
  population_and_evidence_floor: 'Population: all production deployments in the period, established from the deployment pipeline or runtime history.
    Evidence floor: a population taken only from the change register cannot detect unrecorded change — report NOT TESTABLE for completeness in
    that case.'
  test_of_design:
  - id: D1
    text: Obtain the change or release procedure covering Measurement approaches for identifying AI risks are connected to deployment context(s)
      and informed through consultation with domain experts and other end users. Approaches are documented — change classes, required approvals
      per class, testing gates and the record fields captured.
  - id: D2
    text: 'Confirm the record captures the AI-specific artefacts that change behaviour: model version, prompt or system-instruction version, tool
      or data-source configuration, and retrieval corpus where applicable.'
  - id: D3
    text: Confirm approval must precede implementation, and who may approve each class. Confirm the emergency route, its eligibility criteria
      and its retrospective approval window.
  - id: D4
    text: Confirm the rollback or reversion plan requirement and how it is validated.
  - id: D5
    text: Confirm post-implementation verification — that what is running is what was approved.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when the procedure exists but omits AI-specific artefacts or post-implementation
      verification. INADEQUATE when approval is not required before implementation. NOT TESTABLE when the procedure is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population from the deployment source — the pipeline, release log or runtime history — not from the change register, so changes
      made without a record can be found.
  - id: O2
    text: Reconcile deployments to change records. Every deployment with no record is a finding.
  - id: O3
    text: Sample changes across classes including at least one emergency and one model or prompt version change. Compare approval timestamp to
      implementation timestamp.
  - id: O4
    text: Verify the approver was authorised for the class and is not the implementer.
  - id: O5
    text: Trace a sample to post-implementation verification, and any backed-out change to its rollback record.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when deployments reconcile to approved records, approvals precede implementation and verification occurred.
      PARTIALLY EFFECTIVE when records exist but timing, approver authority or verification is incomplete. INEFFECTIVE when unrecorded or unapproved
      production changes are found. NOT TESTABLE when the deployment population cannot be established independently.'
  near_miss_failure_modes:
  - F1. Approval timestamp is after the deployment timestamp — the record documents the change rather than authorising it.
  - F2. The approver is the implementer, or sits outside the approval matrix for that class.
  - F3. The emergency route carries a material share of all changes, with no incident reference behind them.
  - F4. The change names the service but not the model or prompt version, so the artefact that actually changed is invisible.
  - F5. A change freeze was in force and the change proceeded with no documented exemption.
  - F6. Privileged sessions used to implement are not recorded, or do not reconcile to the named implementer.
  - F7. No post-implementation verification, so a difference between the approved plan and the deployed state would never surface.
  resolutions:
  - failure_mode: F1
    text: A change record whose approval timestamp precedes deployment, or an approved retrospective acceptance naming the exposure.
  - failure_mode: F2
    text: An approval matrix and a record showing an approver drawn from it, distinct from the implementer.
  - failure_mode: F3
    text: An emergency change register with incident references and a rate that can be explained.
  - failure_mode: F4
    text: A change record field holding the model and prompt version, populated for a sampled change.
  - failure_mode: F5
    text: A freeze exemption approved at the level the freeze policy requires.
  - failure_mode: F6
    text: A privileged session record reconciling to the change and the named implementer.
  - failure_mode: F7
    text: A post-implementation verification record comparing running state to approved state.

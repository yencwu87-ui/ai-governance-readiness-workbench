  - F3. Quality is described as 'reviewed for accuracy' with no measurement and no threshold.
  - F4. Deletion is honoured in the source system while the vector index or cache retains the content.
  - F5. A new source was added by a configuration change that never entered the data governance route.
  - F6. Lineage stops at the dataset name, with no version or snapshot date.
  resolutions:
  - failure_mode: F1
    text: A pipeline or retrieval configuration export reconciled to the documented source list.
  - failure_mode: F2

  - id: e1
    text: A training or competency requirement covering Interdisciplinary AI actors, competencies, skills and capacities for establishing context
      reflect demographic diversity and broad domain and user experience expertise, and their participation is documented. Opportunities for interdisciplinary
      collaboration are prioritized exists
    scope: model
  - id: e2
    text: Audiences are defined by role and exposure
    scope: model
  - id: e3
    text: Content maps to the decisions those roles make
    scope: model

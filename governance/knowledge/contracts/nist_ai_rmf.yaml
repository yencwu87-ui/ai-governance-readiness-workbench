  test_of_design:
  - id: D1
    text: Obtain the approved policy or standard covering Organizational policies and practices are in place to foster a critical thinking and
      safety-first mindset in the design, development, deployment, and uses of AI systems to minimize potential negative impacts, with its approval
      record, owner and version history.
  - id: D2
    text: Confirm it states scope (which systems, models and uses it binds), prohibited and controlled uses, the accountable owner and the consequence
      of non-compliance.
  - id: D3
    text: Confirm it defines the exception route — who may grant one, on what basis, for how long, and where exceptions are recorded.
  - id: D4
    text: Confirm the review cycle and the triggers for out-of-cycle review, and that the document is within its cycle.
  - id: D5
    text: Confirm the policy is mapped to the controls, plays or procedures that implement it, so a requirement is not left with nothing that
      operates it.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 hold and D5 identifies at least one implementing control. PARTIALLY ADEQUATE when the policy exists
      but the exception route or implementing link is absent. INADEQUATE when scope or ownership is undefined. NOT TESTABLE when the approved
      document is not produced.'
  test_of_operating_effectiveness:

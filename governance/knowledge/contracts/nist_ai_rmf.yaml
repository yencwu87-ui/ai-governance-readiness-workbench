  - id: O1
    text: Define the population of data sources feeding the system in the period, taken from the pipeline or retrieval configuration rather than
      from documentation.
  - id: O2
    text: Verify each source has a recorded permitted-use basis and an approval.
  - id: O3
    text: Sample and test the quality attributes against their thresholds, using the retained measurement rather than a statement.
  - id: O4
    text: Trace a deletion or correction request through to the model, index or cache that holds it.
  - id: O5
    text: Verify lineage is sufficient to say which data version produced a given behaviour.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when every live source is approved with a permitted-use basis, quality is measured against thresholds
      and deletion propagates. PARTIALLY EFFECTIVE when sources are governed but measurement or propagation is unevidenced. INEFFECTIVE when unapproved
      sources are live. NOT TESTABLE when the source population cannot be established from the pipeline.'

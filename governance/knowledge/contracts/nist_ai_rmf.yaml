- framework: NIST AI RMF
  control_id: GOVERN 1.6
  title: Mechanisms are in place to inventory AI systems and are resourced according to organizational risk priorities.
  requirement: Mechanisms are in place to inventory AI systems and are resourced according to organizational risk priorities.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: A register covering Mechanisms are in place to inventory AI systems and are resourced according to organizational risk priorities exists
      with a defined field set
    scope: model
  - id: e2
    text: Each record carries a unique identifier and a named owner
    scope: model
  - id: e3
    text: The trigger and timing for creating a record are defined relative to first use
    scope: model
  - id: e4
    text: An independent source exists against which completeness can be reconciled
    scope: model
  - id: e5
    text: The register is current — status, version and retirement are maintained
    scope: model
  - id: e6
    text: Sampled records reconcile to the deployed reality they describe
    scope: model
  boundary:
    none: no register, or a register with no unique identifier and no ownership.
    partial: a register exists and is structurally adequate, but completeness has not been reconciled against an independent source, or material
      staleness is present.
    full: the register is complete against an independent reconciliation, unique, owned and current, and sampled records trace to deployed reality.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence: []
  linked_play:
  - Play 1
  crosswalk: []
  population_and_evidence_floor: 'Population: the full register extract plus the independent reconciliation source. Evidence floor: no independent
    source, or a register extract with no as-at date or record count, makes the completeness result NOT TESTABLE rather than PASS.'
  test_of_design:
  - id: D1
    text: Obtain the register or inventory specification for Mechanisms are in place to inventory AI systems and are resourced according to organizational
      risk priorities — its required fields, unique identifier, ownership field, lifecycle status and retirement rule.
  - id: D2
    text: Confirm the specification defines what triggers a record being created, and at what point relative to first use, so completeness has
      a testable meaning.
  - id: D3
    text: Confirm the authoritative source and the reconciliation route used to prove the register is complete against the real estate.
  - id: D4
    text: Confirm update and attestation cadence, and who is accountable for accuracy.
  - id: s5
    text: 'Design verdict: ADEQUATE when D1-D3 hold. PARTIALLY ADEQUATE when fields and ownership are defined but no completeness route exists.
      INADEQUATE when there is no unique identifier or no owner field. NOT TESTABLE when the specification is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the full register extract as at a stated date, with a record count.
  - id: O2
    text: 'Test completeness in the direction that can fail: reconcile from the independent source outward to the register, not register to itself.
      Use a deployment source, an access source or a cost or telemetry source.'
  - id: O3
    text: 'Test uniqueness and currency: duplicates, records with no owner, records whose status has not changed since creation, retired entries
      still active downstream.'
  - id: O4
    text: Sample records and trace each to real evidence of the thing it claims to describe.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when reconciliation finds no unregistered items and sampled records are accurate and current. PARTIALLY
      EFFECTIVE when the register is broadly accurate but stale or incomplete in places. INEFFECTIVE when unregistered production items are found.
      NOT TESTABLE when no independent source is available to reconcile against.'
  near_miss_failure_modes:
  - F1. Completeness is tested register-to-register — the register is reconciled to a list derived from itself, which can never find an omission.
  - F2. Every record was created on the same date, indicating a one-off population exercise rather than an operating process.
  - F3. Owner fields hold a team mailbox or a departed individual.
  - F4. Retired records remain in an active state downstream — decommissioned in the register but still holding credentials or serving traffic.
  - F5. The register captures models but not the prompts, tools or agents that change behaviour without a model change.
  resolutions:
  - failure_mode: F1
    text: A reconciliation from an independent source — deployment pipeline, identity provider, cost report or runtime telemetry — with exceptions
      listed.
  - failure_mode: F2
    text: Evidence of incremental record creation over the period, or an approved backfill with a completeness statement.
  - failure_mode: F3
    text: An ownership attestation naming current individuals, dated within the cadence.
  - failure_mode: F4
    text: A decommissioning record showing downstream revocation, not only the register status change.
  - failure_mode: F5
    text: A field set covering the components that can change behaviour, with at least one example populated.
  test_provenance: 'Archetype: register_inventory — DRAFT, requires second-line authoring and control-owner approval before authoritative use'

- framework: NIST AI RMF
  control_id: MEASURE 2.1
  title: Test sets, metrics and details about the tools used during TEVV are documented.
  requirement: Test sets, metrics and details about the tools used during TEVV are documented.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: An approved validation or evaluation method for Test sets, metrics and details about the tools used during TEVV are documented exists
    scope: model
  - id: e2
    text: Acceptance thresholds are stated before results are seen
    scope: model
  - id: e3
    text: The validator is independent of the team that built the system
    scope: model
  - id: e4
    text: The validation covers the version that was deployed
    scope: model
  - id: e5
    text: Results are supported by retained underlying data, not only a summary
    scope: model
  - id: e6
    text: Shortfalls against threshold are remediated, re-tested or formally accepted
    scope: model
  boundary:
    none: no validation, or a report with no acceptance criteria and no independence.
    partial: validation was performed but is stale against the deployed version, not independent, or thresholds and shortfall disposition are
      not evidenced.
    full: the deployed version was independently validated against pre-stated thresholds, with retained results and every shortfall remediated
      or formally accepted.
  owner: Indep. Validation / InfoSec
  expected_evidence: []
  linked_play:
  - Play 3
  crosswalk: []
  population_and_evidence_floor: 'Population: all model, prompt or agent versions promoted in the period. Evidence floor: fewer than 1 validated
    version in the period, or reports with no version identifier, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the approved validation or evaluation methodology for Test sets, metrics and details about the tools used during TEVV are documented
      — scope, test types, datasets, metrics and acceptance thresholds.
  - id: D2
    text: Confirm acceptance thresholds are stated in advance of testing and are specific to the use case rather than generic.
  - id: D3
    text: 'Confirm independence: who performs the validation and how they are separated from the team that built the system.'
  - id: D4
    text: Confirm the methodology covers the failure modes the system can actually produce, including the ones a benchmark score does not capture.
  - id: D5
    text: Confirm the disposition rule — what happens when a threshold is missed, and who may accept a shortfall.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when tests are defined but thresholds are set after results, or
      independence is unclear. INADEQUATE when no acceptance criterion exists. NOT TESTABLE when the methodology is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: every model, prompt or agent version promoted in the period.'
  - id: O2
    text: For a sample, obtain the validation report and check it covers the version actually deployed — compare version identifiers and dates,
      not titles.
  - id: O3
    text: Reperform or recompute at least one reported metric from the underlying results where the data permits.
  - id: O4
    text: Trace every shortfall against threshold to a remediation, a re-test or an approved acceptance by a role with authority to grant it.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when each deployed version has independent validation against pre-stated thresholds and shortfalls are
      dispositioned. PARTIALLY EFFECTIVE when validation exists but is stale, non-independent or partly unevidenced. INEFFECTIVE when versions
      reached production unvalidated. NOT TESTABLE when the version population or the underlying results are unavailable.'
  near_miss_failure_modes:
  - F1. The validation report predates the deployed version — it validates the model that was tested, not the one that is running.
  - F2. The validator sits in the same reporting line as the builder, so 'independent review' is a signature rather than a challenge.
  - F3. The acceptance threshold was chosen after the result was known, which makes a pass unfalsifiable.
  - F4. The test set overlaps the tuning or training data, so the reported score measures memorisation.
  - F5. A metric is reported with no sample size, so a favourable number may rest on a handful of cases.
  - F6. Only aggregate performance is reported — no slice, subgroup or worst-case analysis where the control requires it.
  resolutions:
  - failure_mode: F1
    text: A validation report whose version identifier matches the deployed artefact, or a re-validation of the current version.
  - failure_mode: F2
    text: A validation performed or signed by a function outside the delivery reporting line, with the reviewer named.
  - failure_mode: F3
    text: A pre-registered threshold — an approved test plan dated before the test run.
  - failure_mode: F4
    text: A statement of dataset provenance and separation, or a held-out set with documented construction.
  - failure_mode: F5
    text: Reported metrics with denominators and confidence, or the underlying result file.
  - failure_mode: F6
    text: Slice-level results for the populations the control names.
  test_provenance: 'Archetype: validation_evaluation — DRAFT, requires second-line authoring and control-owner approval before authoritative use'

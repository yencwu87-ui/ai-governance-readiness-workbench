- framework: NIST AI RMF
  control_id: MANAGE 3.1
  title: AI risks and benefits from third-party resources are regularly monitored, and risk controls are applied and documented.
  requirement: AI risks and benefits from third-party resources are regularly monitored, and risk controls are applied and documented.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: Third-party requirements covering AI risks and benefits from third-party resources are regularly monitored, and risk controls are applied
      and documented exist and are approved
    scope: model
  - id: e2
    text: Due diligence is required before contract or first production use
    scope: model
  - id: e3
    text: Required contractual clauses are specified, including notification and assurance access
    scope: model
  - id: e4
    text: Sub-processors and embedded AI are within scope
    scope: model
  - id: e5
    text: Reassessment cadence and change triggers are defined
    scope: model
  - id: e6
    text: Assurance reports or equivalent are obtained and findings dispositioned
    scope: model
  boundary:
    none: no third-party assessment for AI providers, or providers in production with no assessment.
    partial: onboarding diligence occurred but contractual rights, sub-processor scope or ongoing oversight is not evidenced.
    full: assessments preceded use, required clauses are present in executed contracts, and ongoing oversight operated with findings dispositioned.
  owner: Model Owner + AI Risk
  expected_evidence: []
  linked_play:
  - Play 7
  crosswalk: []
  population_and_evidence_floor: 'Population: all AI-relevant third parties and AI-embedded products in use during the period, from procurement
    or vendor-management data. Evidence floor: a vendor list supplied by the assessed team without procurement reconciliation makes the completeness
    result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the third-party requirements covering AI risks and benefits from third-party resources are regularly monitored, and risk controls
      are applied and documented — the due-diligence scope, the contractual clauses required and the approval route before onboarding.
  - id: D2
    text: Confirm the due diligence covers what the provider does with the institution's data, the provider's own model change practice, and its
      notification obligations on material change or incident.
  - id: D3
    text: 'Confirm contractual rights: audit or assurance report access, notification periods, exit and transition, and liability for model behaviour.'
  - id: D4
    text: Confirm the ongoing obligation — reassessment cadence, performance monitoring and the trigger for re-approval.
  - id: D5
    text: Confirm the treatment of sub-processors and of models embedded in a purchased product, where the AI is not the thing being bought.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when diligence is defined but ongoing obligations or embedded-AI treatment
      is absent. INADEQUATE when no pre-onboarding assessment is required. NOT TESTABLE when the requirements are not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of AI-relevant third parties in the period from procurement or vendor-management data, including products with
      embedded AI, not only AI vendors.
  - id: O2
    text: Sample and verify a completed assessment dated before contract signature or before first production use.
  - id: O3
    text: Verify the required clauses are present in the executed contract, read from the contract rather than the checklist.
  - id: O4
    text: Verify ongoing obligations operated — reassessment at cadence, assurance reports obtained and reviewed with findings dispositioned,
      and provider change notifications acted on.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when assessments preceded use, clauses are present and ongoing obligations ran. PARTIALLY EFFECTIVE when
      onboarding was controlled but ongoing oversight is unevidenced. INEFFECTIVE when material providers were onboarded unassessed. NOT TESTABLE
      when the vendor population cannot be established.'
  near_miss_failure_modes:
  - F1. The provider was assessed as a software vendor before the AI feature was enabled, and never reassessed when it was.
  - F2. The assessment is dated after contract signature, so it recorded a decision already taken.
  - F3. The contract references an assurance report that was never obtained, or one that excludes the AI component from scope.
  - F4. Sub-processors are named in the provider's terms but were never assessed.
  - F5. Provider change notifications arrive but there is no route by which they reach the control owner.
  - F6. The provider's own model changes silently under a continuously updated service, with no version pinning and no notification right.
  resolutions:
  - failure_mode: F1
    text: A reassessment triggered by the AI feature being enabled.
  - failure_mode: F2
    text: An assessment record dated before signature, or an approved exception.
  - failure_mode: F3
    text: The assurance report itself, with its scope section showing the AI component in scope.
  - failure_mode: F4
    text: A sub-processor list with assessment status.
  - failure_mode: F5
    text: A routing record showing a provider notification reaching and being actioned by the control owner.
  - failure_mode: F6
    text: A version-pinning or change-notification clause and evidence of it operating.
  test_provenance: 'Archetype: third_party — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: NIST AI RMF
  control_id: MANAGE 3.2
  title: Pre-trained models which are used for development are monitored as part of AI system regular monitoring and maintenance.
  requirement: Pre-trained models which are used for development are monitored as part of AI system regular monitoring and maintenance.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: Metrics and thresholds for Pre-trained models which are used for development are monitored as part of AI system regular monitoring and
      maintenance are defined and approved
    scope: model
  - id: e2
    text: The metrics detect the failure the control exists to catch
    scope: model
  - id: e3
    text: Alerts route to a named owner with a stated response time
    scope: model
  - id: e4
    text: Monitoring ran across the whole period with gaps identified
    scope: model
  - id: e5
    text: Alerts raised were dispositioned with a recorded outcome
    scope: model
  - id: e6
    text: The detector has been tested or back-tested, so silence is evidence
    scope: model
  boundary:
    none: no monitoring, or monitoring with no thresholds and no owner.
    partial: monitoring is configured and running but coverage, alert disposition or detector assurance is incomplete, or the metrics are proxies
      for the risk rather than the risk.
    full: approved metrics ran continuously, alerts were owned and dispositioned, and the detector is demonstrably capable of firing.
  owner: Model Owner + AI Risk
  expected_evidence: []
  linked_play:
  - Play 7
  crosswalk: []
  population_and_evidence_floor: 'Population: the full monitoring period, plus all alerts raised. Evidence floor: no alerts in the period and
    no detector test means silence is uninformative — report NOT TESTABLE rather than PASS.'
  test_of_design:
  - id: D1
    text: Obtain the monitoring design for Pre-trained models which are used for development are monitored as part of AI system regular monitoring
      and maintenance — the metrics, their thresholds, the observation window and the alerting route.
  - id: D2
    text: Confirm the metrics correspond to the failure the control exists to catch, not only to availability or infrastructure health.
  - id: D3
    text: Confirm each alert has a named recipient, a required response time and a disposition record.
  - id: D4
    text: Confirm how the detector itself is validated — how anyone knows an alert would fire if the condition occurred.
  - id: s5
    text: 'Design verdict: ADEQUATE when D1-D3 hold and D4 identifies a test route. PARTIALLY ADEQUATE when metrics and thresholds exist but ownership
      or detector assurance is absent. INADEQUATE when thresholds are undefined. NOT TESTABLE when the monitoring configuration is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the monitoring output for the full period, with coverage gaps identified — periods with no data are findings, not blanks.
  - id: O2
    text: Verify the configuration in force matches the approved design, read from the running configuration rather than from a document.
  - id: O3
    text: Sample alerts raised and trace each to an owner, a response within the stated time and a disposition.
  - id: O4
    text: Where no alert fired in the period, test the detector — a synthetic breach, a back-test against a known past event, or an equivalent.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when monitoring ran continuously against the approved thresholds and alerts were dispositioned. PARTIALLY
      EFFECTIVE when coverage gaps exist or alerts closed without disposition. INEFFECTIVE when monitoring was not operating or breaches were
      not acted on. NOT TESTABLE when monitoring output for the period is unavailable.'
  near_miss_failure_modes:
  - F1. No alert fired all period and this is presented as evidence of health, with nothing showing the detector works.
  - F2. Thresholds in the running configuration differ from the approved design, usually loosened after a noisy week.
  - F3. Alerts are routed to a shared channel with no named owner, and closure is by silence.
  - F4. Monitoring covers latency and uptime while the control is about model quality, drift or mandate breach.
  - F5. Coverage has gaps that coincide with the periods of highest change.
  - F6. Drift is monitored on inputs only, with no monitoring of the outcome the model drives.
  resolutions:
  - failure_mode: F1
    text: A detector test, synthetic breach or back-test against a known past event.
  - failure_mode: F2
    text: An export of the running configuration compared to the approved baseline, with any deviation approved.
  - failure_mode: F3
    text: An alert record naming a recipient, a response time and a disposition.
  - failure_mode: F4
    text: A metric definition tied to the control objective, with at least one period of output.
  - failure_mode: F5
    text: A continuous coverage statement with gaps explained and dispositioned.
  - failure_mode: F6
    text: Output-side monitoring covering the decisions or actions the system produced.
  test_provenance: 'Archetype: monitoring_detection — DRAFT, requires second-line authoring and control-owner approval before authoritative use'

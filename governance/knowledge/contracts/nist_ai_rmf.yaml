  boundary:
    none: no identified sources, or sources in use with no permitted-use basis.
    partial: sources are identified and approved but quality measurement, deletion propagation or lineage versioning is not evidenced.
    full: every live source is approved with a permitted-use basis, quality is measured against thresholds, deletion propagates to derived stores
      and lineage is version-specific.
  owner: Indep. Validation / InfoSec
  expected_evidence: []
  linked_play:
  - Play 3
  crosswalk: []
  population_and_evidence_floor: 'Population: all data sources feeding the system in the period, from pipeline or retrieval configuration. Evidence
    floor: a source list taken from documentation rather than the pipeline cannot establish completeness — report NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the data requirement covering Privacy risk of the AI system, as identified in the MAP function, is examined and documented —
      which datasets are in scope, the quality attributes required and the lineage that must be recorded.
  - id: D2
    text: Confirm the permitted-use basis for each source is established, including personal data, licensed data and data whose terms restrict
      model training.
  - id: D3
    text: Confirm quality criteria are measurable and have thresholds, rather than aspirational adjectives.
  - id: D4
    text: Confirm retention, deletion and the handling of data-subject or contractual deletion requests where a model or index has already absorbed
      the data.
  - id: D5
    text: Confirm who approves a new data source into the system.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when quality criteria exist without thresholds, or deletion in the model
      or index is unaddressed. INADEQUATE when permitted use is undefined. NOT TESTABLE when the requirement is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population of data sources feeding the system in the period, taken from the pipeline or retrieval configuration rather than
      from documentation.
  - id: O2
    text: Verify each source has a recorded permitted-use basis and an approval.
  - id: O3
    text: Sample and test the quality attributes against their thresholds, using the retained measurement rather than a statement.
  - id: O4
    text: Trace a deletion or correction request through to the model, index or cache that holds it.
  - id: O5
    text: Verify lineage is sufficient to say which data version produced a given behaviour.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when every live source is approved with a permitted-use basis, quality is measured against thresholds
      and deletion propagates. PARTIALLY EFFECTIVE when sources are governed but measurement or propagation is unevidenced. INEFFECTIVE when unapproved
      sources are live. NOT TESTABLE when the source population cannot be established from the pipeline.'
  near_miss_failure_modes:
  - F1. The documented source list and the retrieval configuration disagree, and only the document was assessed.
  - F2. Permitted use was assessed for analytics and not for model training or retrieval, which are different bases.
  - F3. Quality is described as 'reviewed for accuracy' with no measurement and no threshold.
  - F4. Deletion is honoured in the source system while the vector index or cache retains the content.
  - F5. A new source was added by a configuration change that never entered the data governance route.
  - F6. Lineage stops at the dataset name, with no version or snapshot date.
  resolutions:
  - failure_mode: F1
    text: A pipeline or retrieval configuration export reconciled to the documented source list.
  - failure_mode: F2
    text: A permitted-use assessment naming the specific processing purpose.
  - failure_mode: F3
    text: A measured quality result against a stated threshold.
  - failure_mode: F4
    text: Evidence of deletion propagating to the index or cache, with a re-query showing absence.
  - failure_mode: F5
    text: An approval record for the source addition, tied to the configuration change.
  - failure_mode: F6
    text: A lineage record carrying dataset version or snapshot date.

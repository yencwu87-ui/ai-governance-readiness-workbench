  expected_evidence: []
  linked_play: []
  crosswalk: []
  population_and_evidence_floor: 'Population: in-scope roles from HR or entitlement data. Evidence floor: a population taken from the training
    system roster cannot detect an omitted person — report NOT TESTABLE for completeness.'
  test_of_design:
  - id: D1
    text: Obtain the training or competency requirement covering Interdisciplinary AI actors, competencies, skills and capacities for establishing
      context reflect demographic diversity and broad domain and user experience expertise, and their participation is documented. Opportunities
      for interdisciplinary collaboration are prioritized — the audiences, the content and the required frequency.

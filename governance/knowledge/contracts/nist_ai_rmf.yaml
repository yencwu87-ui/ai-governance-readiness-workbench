  - failure_mode: F1
    text: A named procedure, runbook or control that implements the clause, with an owner.
  - failure_mode: F2
    text: A scope statement with inclusion and exclusion criteria, or a mapping from the inventory to in-scope flag.
  - failure_mode: F3
    text: An exception record showing an independent grantor, a stated basis and an expiry date.
  - failure_mode: F4
    text: A reassessment record for pre-existing use cases, or an approved grandfathering decision.
  - failure_mode: F5
    text: A breach entry with a remediation action, owner and closure evidence, or a formal risk acceptance.

- framework: NIST AI RMF
  control_id: GOVERN 4.2
  title: Organizational teams document the risks and potential impacts of the AI technology they design, develop, deploy, evaluate and use, and
    they communicate about the impacts more broadly.
  requirement: Organizational teams document the risks and potential impacts of the AI technology they design, develop, deploy, evaluate and use,
    and they communicate about the impacts more broadly.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: An approved methodology for Organizational teams document the risks and potential impacts of the AI technology they design, develop,
      deploy, evaluate and use, and they communicate about the impacts more broadly exists with defined criteria
    scope: model
  - id: e2
    text: Tier or outcome thresholds are stated by rule rather than by unaided judgement
    scope: model
  - id: e3
    text: The assessment is required before the decision it informs
    scope: model
  - id: e4
    text: The outcome is approved by a role independent of the requester
    scope: model
  - id: e5
    text: Each outcome obliges a defined set of controls or gates
    scope: model
  - id: e6
    text: Reassessment triggers are defined and detected
    scope: model
  boundary:
    none: no methodology, or assessments performed with no criteria.
    partial: a methodology exists and is used, but timing, independence, threshold discipline or reassessment is not evidenced.
    full: assessments are complete, timely, independent of the requester, reperformable from the recorded facts, and drive the controls their
      outcome obliges.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence: []
  linked_play: []
  crosswalk: []
  population_and_evidence_floor: 'Population: all use cases requiring assessment in the period, from the intake log or AI inventory. Evidence
    floor: fewer than 3 assessments, or no sample from the lowest tier, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the approved methodology and template for Organizational teams document the risks and potential impacts of the AI technology
      they design, develop, deploy, evaluate and use, and they communicate about the impacts more broadly — trigger, criteria, scoring or classification
      scheme, and the decision each outcome drives.
  - id: D2
    text: 'Confirm the criteria are discriminating: different inputs produce different outcomes, and the thresholds between tiers are stated numerically
      or by defined rule rather than by judgement alone.'
  - id: D3
    text: Confirm the assessment must be completed before the decision it informs, and who approves the outcome.
  - id: D4
    text: Confirm reassessment triggers — material change, incident, elapsed time — and who is accountable for detecting them.
  - id: D5
    text: 'Confirm what an outcome obliges: which controls a tier turns on, so classification is load-bearing rather than descriptive.'
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when the method exists but thresholds or consequences are undefined.
      INADEQUATE when outcomes drive nothing. NOT TESTABLE when the approved methodology is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: all use cases requiring an assessment in the period, taken from the inventory or intake log.'
  - id: O2
    text: Sample across tiers, including at least one that was classified into the lowest tier — the classification most likely to be wrong and
      least likely to be challenged.
  - id: O3
    text: Reperform the classification from the underlying facts and compare to the recorded outcome. A reperformance that disagrees is a finding
      regardless of the approver's seniority.
  - id: O4
    text: 'Verify timing: the assessment date precedes the decision date. Verify reassessment where a trigger occurred.'
  - id: s5
    text: 'Operating verdict: EFFECTIVE when reperformance agrees, timing holds and triggers were acted on. PARTIALLY EFFECTIVE when assessments
      are complete but late, or a low-tier outcome cannot be supported. INEFFECTIVE when assessments are missing for material use or systematically
      under-tier. NOT TESTABLE when the population of in-scope use cases cannot be established.'
  near_miss_failure_modes:
  - F1. Every use case lands in the same tier, which means the scheme is not discriminating or is being applied to reach a pre-decided answer.
  - F2. The assessment is dated after the go-live date, so it documented a decision rather than informing it.
  - F3. The assessor and the requester are the same person or the same team.
  - F4. A low-tier classification rests on a scope statement that excludes the risky part of the system — for example classifying a copilot as
    advisory while it writes to a system of record.
  - F5. Reassessment triggers exist on paper but no reassessment occurred despite a material model or vendor change in the period.
  resolutions:
  - failure_mode: F1
    text: A tier distribution across the population, with the rationale for outliers in either direction.
  - failure_mode: F2
    text: An assessment record dated before the approval or go-live date, or a documented retrospective acceptance.
  - failure_mode: F3
    text: An approval by a role outside the delivery team, named in the record.
  - failure_mode: F4
    text: A scope statement that enumerates the system's write paths and downstream effects, reassessed on that basis.
  - failure_mode: F5
    text: A reassessment record tied to the change that triggered it.
  test_provenance: 'Archetype: assessment_classification — DRAFT, requires second-line authoring and control-owner approval before authoritative
    use'
- framework: NIST AI RMF
  control_id: GOVERN 4.3
  title: Organizational practices are in place to enable AI testing, identification of incidents, and information sharing.
  requirement: Organizational practices are in place to enable AI testing, identification of incidents, and information sharing.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: An approved validation or evaluation method for Organizational practices are in place to enable AI testing, identification of incidents,
      and information sharing exists
    scope: model
  - id: e2
    text: Acceptance thresholds are stated before results are seen
    scope: model
  - id: e3
    text: The validator is independent of the team that built the system
    scope: model
  - id: e4
    text: The validation covers the version that was deployed
    scope: model
  - id: e5
    text: Results are supported by retained underlying data, not only a summary
    scope: model
  - id: e6
    text: Shortfalls against threshold are remediated, re-tested or formally accepted
    scope: model
  boundary:
    none: no validation, or a report with no acceptance criteria and no independence.
    partial: validation was performed but is stale against the deployed version, not independent, or thresholds and shortfall disposition are
      not evidenced.
    full: the deployed version was independently validated against pre-stated thresholds, with retained results and every shortfall remediated
      or formally accepted.
  owner: AI Risk Cttee / Senior Mgmt
  expected_evidence: []
  linked_play:
  - Play 6
  crosswalk: []
  population_and_evidence_floor: 'Population: all model, prompt or agent versions promoted in the period. Evidence floor: fewer than 1 validated
    version in the period, or reports with no version identifier, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the approved validation or evaluation methodology for Organizational practices are in place to enable AI testing, identification
      of incidents, and information sharing — scope, test types, datasets, metrics and acceptance thresholds.
  - id: D2
    text: Confirm acceptance thresholds are stated in advance of testing and are specific to the use case rather than generic.
  - id: D3
    text: 'Confirm independence: who performs the validation and how they are separated from the team that built the system.'
  - id: D4
    text: Confirm the methodology covers the failure modes the system can actually produce, including the ones a benchmark score does not capture.
  - id: D5
    text: Confirm the disposition rule — what happens when a threshold is missed, and who may accept a shortfall.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when tests are defined but thresholds are set after results, or
      independence is unclear. INADEQUATE when no acceptance criterion exists. NOT TESTABLE when the methodology is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: every model, prompt or agent version promoted in the period.'
  - id: O2
    text: For a sample, obtain the validation report and check it covers the version actually deployed — compare version identifiers and dates,
      not titles.
  - id: O3
    text: Reperform or recompute at least one reported metric from the underlying results where the data permits.
  - id: O4
    text: Trace every shortfall against threshold to a remediation, a re-test or an approved acceptance by a role with authority to grant it.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when each deployed version has independent validation against pre-stated thresholds and shortfalls are
      dispositioned. PARTIALLY EFFECTIVE when validation exists but is stale, non-independent or partly unevidenced. INEFFECTIVE when versions
      reached production unvalidated. NOT TESTABLE when the version population or the underlying results are unavailable.'
  near_miss_failure_modes:
  - F1. The validation report predates the deployed version — it validates the model that was tested, not the one that is running.
  - F2. The validator sits in the same reporting line as the builder, so 'independent review' is a signature rather than a challenge.
  - F3. The acceptance threshold was chosen after the result was known, which makes a pass unfalsifiable.
  - F4. The test set overlaps the tuning or training data, so the reported score measures memorisation.
  - F5. A metric is reported with no sample size, so a favourable number may rest on a handful of cases.
  - F6. Only aggregate performance is reported — no slice, subgroup or worst-case analysis where the control requires it.
  resolutions:
  - failure_mode: F1
    text: A validation report whose version identifier matches the deployed artefact, or a re-validation of the current version.
  - failure_mode: F2
    text: A validation performed or signed by a function outside the delivery reporting line, with the reviewer named.
  - failure_mode: F3
    text: A pre-registered threshold — an approved test plan dated before the test run.
  - failure_mode: F4
    text: A statement of dataset provenance and separation, or a held-out set with documented construction.
  - failure_mode: F5
    text: Reported metrics with denominators and confidence, or the underlying result file.
  - failure_mode: F6
    text: Slice-level results for the populations the control names.
  test_provenance: 'Archetype: validation_evaluation — DRAFT, requires second-line authoring and control-owner approval before authoritative use'

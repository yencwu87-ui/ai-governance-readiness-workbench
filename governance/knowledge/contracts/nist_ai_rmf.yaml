- framework: NIST AI RMF
  control_id: MEASURE 2.3
  title: AI system performance or assurance criteria are measured qualitatively or quantitatively and demonstrated for conditions similar to deployment
    setting(s). Measures are documented.
  requirement: AI system performance or assurance criteria are measured qualitatively or quantitatively and demonstrated for conditions similar
    to deployment setting(s). Measures are documented.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: An approved change or release procedure covering AI system performance or assurance criteria are measured qualitatively or quantitatively
      and demonstrated for conditions similar to deployment setting(s). Measures are documented exists
    scope: model
  - id: e2
    text: The record captures model, prompt, tool and data-configuration versions
    scope: model
  - id: e3
    text: Approval is required and recorded before implementation
    scope: model
  - id: e4
    text: The approver is authorised for the change class and is not the implementer
    scope: model
  - id: e5
    text: An emergency route exists with eligibility criteria and a retrospective approval window
    scope: model
  - id: e6
    text: A rollback plan is required and recorded
    scope: model
  - id: e7
    text: Post-implementation verification confirms the running state matches what was approved
    scope: model
  boundary:
    none: no change control over the AI artefacts, or production changes with no record.
    partial: change records exist but approval timing, approver authority, artefact versioning or post-implementation verification is not evidenced.
    full: every deployment reconciles to a record approved in advance by an authorised, independent approver, with the artefact versions named
      and the deployed state verified.
  owner: Indep. Validation / InfoSec
  expected_evidence: []
  linked_play:
  - Play 3, 4
  crosswalk: []
  population_and_evidence_floor: 'Population: all production deployments in the period, established from the deployment pipeline or runtime history.
    Evidence floor: a population taken only from the change register cannot detect unrecorded change — report NOT TESTABLE for completeness in
    that case.'
  test_of_design:
  - id: D1
    text: Obtain the change or release procedure covering AI system performance or assurance criteria are measured qualitatively or quantitatively
      and demonstrated for conditions similar to deployment setting(s). Measures are documented — change classes, required approvals per class,
      testing gates and the record fields captured.
  - id: D2
    text: 'Confirm the record captures the AI-specific artefacts that change behaviour: model version, prompt or system-instruction version, tool
      or data-source configuration, and retrieval corpus where applicable.'
  - id: D3
    text: Confirm approval must precede implementation, and who may approve each class. Confirm the emergency route, its eligibility criteria
      and its retrospective approval window.
  - id: D4
    text: Confirm the rollback or reversion plan requirement and how it is validated.
  - id: D5
    text: Confirm post-implementation verification — that what is running is what was approved.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D3 and D5 hold. PARTIALLY ADEQUATE when the procedure exists but omits AI-specific artefacts or post-implementation
      verification. INADEQUATE when approval is not required before implementation. NOT TESTABLE when the procedure is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Define the population from the deployment source — the pipeline, release log or runtime history — not from the change register, so changes
      made without a record can be found.
  - id: O2
    text: Reconcile deployments to change records. Every deployment with no record is a finding.
  - id: O3
    text: Sample changes across classes including at least one emergency and one model or prompt version change. Compare approval timestamp to
      implementation timestamp.
  - id: O4
    text: Verify the approver was authorised for the class and is not the implementer.
  - id: O5
    text: Trace a sample to post-implementation verification, and any backed-out change to its rollback record.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when deployments reconcile to approved records, approvals precede implementation and verification occurred.
      PARTIALLY EFFECTIVE when records exist but timing, approver authority or verification is incomplete. INEFFECTIVE when unrecorded or unapproved
      production changes are found. NOT TESTABLE when the deployment population cannot be established independently.'
  near_miss_failure_modes:
  - F1. Approval timestamp is after the deployment timestamp — the record documents the change rather than authorising it.
  - F2. The approver is the implementer, or sits outside the approval matrix for that class.
  - F3. The emergency route carries a material share of all changes, with no incident reference behind them.
  - F4. The change names the service but not the model or prompt version, so the artefact that actually changed is invisible.
  - F5. A change freeze was in force and the change proceeded with no documented exemption.
  - F6. Privileged sessions used to implement are not recorded, or do not reconcile to the named implementer.
  - F7. No post-implementation verification, so a difference between the approved plan and the deployed state would never surface.
  resolutions:
  - failure_mode: F1
    text: A change record whose approval timestamp precedes deployment, or an approved retrospective acceptance naming the exposure.
  - failure_mode: F2
    text: An approval matrix and a record showing an approver drawn from it, distinct from the implementer.
  - failure_mode: F3
    text: An emergency change register with incident references and a rate that can be explained.
  - failure_mode: F4
    text: A change record field holding the model and prompt version, populated for a sampled change.
  - failure_mode: F5
    text: A freeze exemption approved at the level the freeze policy requires.
  - failure_mode: F6
    text: A privileged session record reconciling to the change and the named implementer.
  - failure_mode: F7
    text: A post-implementation verification record comparing running state to approved state.
  test_provenance: 'Archetype: change_release — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: NIST AI RMF
  control_id: MEASURE 2.4
  title: The functionality and behavior of the AI system and its components, as identified in the MAP function, are monitored when in production.
  requirement: The functionality and behavior of the AI system and its components, as identified in the MAP function, are monitored when in production.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: Metrics and thresholds for The functionality and behavior of the AI system and its components, as identified in the MAP function, are
      monitored when in production are defined and approved
    scope: model
  - id: e2
    text: The metrics detect the failure the control exists to catch
    scope: model
  - id: e3
    text: Alerts route to a named owner with a stated response time
    scope: model
  - id: e4
    text: Monitoring ran across the whole period with gaps identified
    scope: model
  - id: e5
    text: Alerts raised were dispositioned with a recorded outcome
    scope: model
  - id: e6
    text: The detector has been tested or back-tested, so silence is evidence
    scope: model
  boundary:
    none: no monitoring, or monitoring with no thresholds and no owner.
    partial: monitoring is configured and running but coverage, alert disposition or detector assurance is incomplete, or the metrics are proxies
      for the risk rather than the risk.
    full: approved metrics ran continuously, alerts were owned and dispositioned, and the detector is demonstrably capable of firing.
  owner: Indep. Validation / InfoSec
  expected_evidence: []
  linked_play:
  - Play 3, 5
  crosswalk: []
  population_and_evidence_floor: 'Population: the full monitoring period, plus all alerts raised. Evidence floor: no alerts in the period and
    no detector test means silence is uninformative — report NOT TESTABLE rather than PASS.'
  test_of_design:
  - id: D1
    text: Obtain the monitoring design for The functionality and behavior of the AI system and its components, as identified in the MAP function,
      are monitored when in production — the metrics, their thresholds, the observation window and the alerting route.
  - id: D2
    text: Confirm the metrics correspond to the failure the control exists to catch, not only to availability or infrastructure health.
  - id: D3
    text: Confirm each alert has a named recipient, a required response time and a disposition record.
  - id: D4
    text: Confirm how the detector itself is validated — how anyone knows an alert would fire if the condition occurred.
  - id: s5
    text: 'Design verdict: ADEQUATE when D1-D3 hold and D4 identifies a test route. PARTIALLY ADEQUATE when metrics and thresholds exist but ownership
      or detector assurance is absent. INADEQUATE when thresholds are undefined. NOT TESTABLE when the monitoring configuration is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the monitoring output for the full period, with coverage gaps identified — periods with no data are findings, not blanks.
  - id: O2
    text: Verify the configuration in force matches the approved design, read from the running configuration rather than from a document.
  - id: O3
    text: Sample alerts raised and trace each to an owner, a response within the stated time and a disposition.
  - id: O4
    text: Where no alert fired in the period, test the detector — a synthetic breach, a back-test against a known past event, or an equivalent.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when monitoring ran continuously against the approved thresholds and alerts were dispositioned. PARTIALLY
      EFFECTIVE when coverage gaps exist or alerts closed without disposition. INEFFECTIVE when monitoring was not operating or breaches were
      not acted on. NOT TESTABLE when monitoring output for the period is unavailable.'
  near_miss_failure_modes:
  - F1. No alert fired all period and this is presented as evidence of health, with nothing showing the detector works.
  - F2. Thresholds in the running configuration differ from the approved design, usually loosened after a noisy week.
  - F3. Alerts are routed to a shared channel with no named owner, and closure is by silence.
  - F4. Monitoring covers latency and uptime while the control is about model quality, drift or mandate breach.
  - F5. Coverage has gaps that coincide with the periods of highest change.
  - F6. Drift is monitored on inputs only, with no monitoring of the outcome the model drives.
  resolutions:
  - failure_mode: F1
    text: A detector test, synthetic breach or back-test against a known past event.
  - failure_mode: F2
    text: An export of the running configuration compared to the approved baseline, with any deviation approved.
  - failure_mode: F3
    text: An alert record naming a recipient, a response time and a disposition.
  - failure_mode: F4
    text: A metric definition tied to the control objective, with at least one period of output.
  - failure_mode: F5
    text: A continuous coverage statement with gaps explained and dispositioned.
  - failure_mode: F6
    text: Output-side monitoring covering the decisions or actions the system produced.
  test_provenance: 'Archetype: monitoring_detection — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: NIST AI RMF
  control_id: MEASURE 2.5
  title: The AI system to be deployed is demonstrated to be valid and reliable. Limitations of the generalizability beyond the conditions under
    which the technology was developed are documented.
  requirement: The AI system to be deployed is demonstrated to be valid and reliable. Limitations of the generalizability beyond the conditions
    under which the technology was developed are documented.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: The authority boundary for The AI system to be deployed is demonstrated to be valid and reliable. Limitations of the generalizability
      beyond the conditions under which the technology was developed are documented is explicitly defined
    scope: model
  - id: e2
    text: The boundary is enforced in configuration or at runtime, not only stated in a document
    scope: model
  - id: e3
    text: Grant and approval of authority are separated from the requester
    scope: model
  - id: e4
    text: The behaviour at the boundary — block, refer or log — is approved
    scope: model
  - id: e5
    text: Overrides are approved by a role with authority and carry a recorded reason
    scope: model
  - id: e6
    text: Granted authority is recertified on a defined cadence and revocations take effect
    scope: model
  boundary:
    none: no defined boundary, or authority granted with no approval.
    partial: the boundary is defined and approved but enforcement, override discipline or recertification is not evidenced.
    full: the enforced boundary matches the approved boundary, overrides are independently approved with reasons, and recertification demonstrably
      revokes.
  owner: Indep. Validation / InfoSec
  expected_evidence: []
  linked_play:
  - Play 3
  crosswalk: []
  population_and_evidence_floor: 'Population: the enforced configuration plus all grants and all boundary events in the period. Evidence floor:
    no enforced configuration export, or zero boundary events with no enforcement test, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the definition of the authority boundary for The AI system to be deployed is demonstrated to be valid and reliable. Limitations
      of the generalizability beyond the conditions under which the technology was developed are documented — permitted actions, counterparties,
      value or exposure limits, data scope and the systems it may write to.
  - id: D2
    text: Confirm the boundary is expressed where it is enforced, not only in a document — a configuration, a policy object or a runtime guardrail.
  - id: D3
    text: Confirm who grants and who approves a change to the boundary, and that the two are separated from the requester.
  - id: D4
    text: 'Confirm what happens at the boundary: hard block, human referral or log-and-continue, and that the choice is approved.'
  - id: D5
    text: Confirm periodic recertification of granted authority, with a defined cadence and an accountable reviewer.
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when limits are documented but not enforced, or recertification is absent.
      INADEQUATE when no boundary is defined. NOT TESTABLE when the authoritative definition is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the enforced configuration as at a date and compare it, field by field, to the approved boundary.
  - id: O2
    text: Define the population of granted access or mandate holders, and reconcile it to the approved grants — in the direction of finding grants
      nobody approved.
  - id: O3
    text: 'Sample boundary events in the period: blocks, referrals and overrides. Trace each override to an approver with authority and a recorded
      reason.'
  - id: O4
    text: Where no boundary event occurred, test the enforcement — a controlled attempt or an equivalent assurance that the limit binds.
  - id: O5
    text: Inspect the most recent recertification for completeness and for revocations actually taking effect.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when enforced limits match approved limits, overrides are approved and recertification took effect. PARTIALLY
      EFFECTIVE when the boundary holds but grants are stale or overrides are unevidenced. INEFFECTIVE when unapproved authority is found in production.
      NOT TESTABLE when the enforced configuration cannot be obtained.'
  near_miss_failure_modes:
  - F1. The limit is in a policy document and nowhere in the running system, so nothing stops the action.
  - F2. The enforced value is more permissive than the approved value, changed by a ticket that never reached the approver.
  - F3. Overrides are recorded but the approver is the same identity that requested the action.
  - F4. Recertification was completed as an attestation with no revocations, across a population where joiners and leavers certainly occurred.
  - F5. The agent holds standing credentials broader than its mandate because the mandate is enforced at the orchestration layer and the credential
    is not.
  - F6. Limits bind per transaction but not in aggregate, so the boundary is passable by repetition.
  resolutions:
  - failure_mode: F1
    text: An export of the enforced configuration or policy object showing the limit in force.
  - failure_mode: F2
    text: A reconciliation of enforced versus approved values with any deviation approved retrospectively.
  - failure_mode: F3
    text: An override record naming a distinct approver and the reason.
  - failure_mode: F4
    text: A recertification with revocation evidence at the target system, not only the sign-off sheet.
  - failure_mode: F5
    text: An entitlement review of the credential itself, scoped to the mandate.
  - failure_mode: F6
    text: An aggregate or cumulative limit in the enforced configuration, with evidence of its operation.
  test_provenance: 'Archetype: access_authority — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: NIST AI RMF
  control_id: MEASURE 2.6
  title: The AI system is evaluated regularly for safety risks. It is demonstrated to be safe, its residual negative risk does not exceed the
    risk tolerance, and it can fail safely, particularly if made to operate beyond its knowledge limits.
  requirement: The AI system is evaluated regularly for safety risks. It is demonstrated to be safe, its residual negative risk does not exceed
    the risk tolerance, and it can fail safely, particularly if made to operate beyond its knowledge limits.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: A named body or role holds an approved mandate covering The AI system is evaluated regularly for safety risks. It is demonstrated to
      be safe, its residual negative risk does not exceed the risk tolerance, and it can fail safely, particularly if made to operate beyond its
      knowledge limits
    scope: model
  - id: e2
    text: The mandate states which decisions are reserved to that body and cannot be delegated
    scope: model
  - id: e3
    text: Membership, quorum and cross-functional representation are defined
    scope: model
  - id: e4
    text: Reporting inputs, cadence and escalation thresholds are defined
    scope: model
  - id: e5
    text: Decisions taken under the mandate are recorded with a named decision-maker and date
    scope: model
  - id: e6
    text: Actions arising are tracked to closure or formal acceptance
    scope: model
  boundary:
    none: no approved mandate, or a mandate that names no accountable body and no reserved decisions.
    partial: an approved mandate exists but one or more of decision rights, quorum, cadence or escalation thresholds is absent, or the body exists
      but material decisions are not traceable to it.
    full: mandate, reserved decision rights and reporting are approved and current, and material decisions in the period are attributable to the
      body with actions tracked.
  owner: Indep. Validation / InfoSec
  expected_evidence: []
  linked_play:
  - Play 3, 10
  crosswalk: []
  population_and_evidence_floor: 'Population: every meeting or reserved decision in the review period, established from the governance calendar
    or decision register. Evidence floor: fewer than 3 meetings or fewer than 1 material decision available to inspect makes the operating result
    NOT TESTABLE rather than a PASS.'
  test_of_design:
  - id: D1
    text: Obtain the approved terms of reference, mandate or charter covering The AI system is evaluated regularly for safety risks. It is demonstrated
      to be safe, its residual negative risk does not exceed the risk tolerance, and it can fail safely, particularly if made to operate beyond
      its knowledge limits, with its approval record and version history.
  - id: D2
    text: Confirm the mandate names the accountable role or body, its membership and quorum, and the decisions reserved to it rather than delegated
      to a model, a vendor or the delivery team.
  - id: D3
    text: Confirm reporting inputs, cadence, materiality thresholds for escalation and evidence-retention responsibilities are stated, not implied.
  - id: D4
    text: Confirm the mandate is current — reviewed within its stated cycle, and updated for any material change in AI scope since approval.
  - id: s5
    text: 'Design verdict: ADEQUATE only when D1-D3 all hold. PARTIALLY ADEQUATE when D1 holds and one of D2-D3 is incomplete. INADEQUATE when
      decision rights or accountability cannot be located. NOT TESTABLE when the authoritative mandate is not produced — absence of the artefact
      from the evidence pack is not a design failure until its absence is confirmed by the owner.'
  test_of_operating_effectiveness:
  - id: O1
    text: 'Define the population: all meetings, decisions or approvals falling under the mandate in the review period. Establish the population
      from the calendar or register, not from the minutes supplied.'
  - id: O2
    text: Sample at least three meetings including every meeting at which a high-materiality matter was decided. Verify attendance against quorum.
  - id: O3
    text: 'Reperform: trace each sampled material AI matter to a recorded decision, a named decision-maker and a dated action, then trace open
      actions to closure or formal acceptance.'
  - id: O4
    text: Inspect any period in which the cadence was missed and the disposition of that gap.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when the body met at cadence, decided the material matters in scope, and actions were tracked. PARTIALLY
      EFFECTIVE when it operated but decisions or follow-up are incomplete. INEFFECTIVE when material matters bypassed the body. NOT TESTABLE
      when the population cannot be established.'
  near_miss_failure_modes:
  - F1. Minutes record attendance and papers tabled but no decision — the body was informed rather than deciding.
  - F2. The material decision was taken outside the body and ratified afterwards, with the ratification date after the go-live date.
  - F3. Quorum was not met at the meeting where the reserved decision was taken, and the minutes do not record it.
  - F4. Actions carry an owner but no due date, and the same actions reappear across consecutive meetings without disposition.
  - F5. The mandate is approved but predates the AI scope it is claimed to cover — for example approved before agentic use cases existed.
  resolutions:
  - failure_mode: F1
    text: A minuted decision with the decision wording, the decision-maker and the date.
  - failure_mode: F2
    text: Evidence that the approval preceded the deployment, or an approved retrospective risk acceptance naming the exposure.
  - failure_mode: F3
    text: An attendance record showing quorum, or a documented out-of-cycle approval route.
  - failure_mode: F4
    text: An action log with owner, due date and closure evidence or a formal acceptance.
  - failure_mode: F5
    text: A mandate version approved after the scope change, or a scope addendum with its own approval.
  test_provenance: 'Archetype: governance_body — DRAFT, requires second-line authoring and control-owner approval before authoritative use'
- framework: NIST AI RMF
  control_id: MEASURE 2.7
  title: AI system security and resilience, as identified in the MAP function, are evaluated and documented.
  requirement: AI system security and resilience, as identified in the MAP function, are evaluated and documented.
  requirement_source: playbook_workbook
  requirement_authority: draft
  elements:
  - id: e1
    text: Security or resilience requirements covering AI system security and resilience, as identified in the MAP function, are evaluated and
      documented are defined
    scope: model
  - id: e2
    text: AI-specific threat paths are in scope, including injection through retrieved or tool-returned content
    scope: model
  - id: e3
    text: The instruction-versus-data trust boundary is stated and enforced
    scope: model
  - id: e4
    text: Testing is performed against the deployed version by an independent party
    scope: model
  - id: e5
    text: Findings are remediated, re-tested or formally accepted with an expiry
    scope: model
  - id: e6
    text: Runtime evidence shows the boundary holding
    scope: model
  boundary:
    none: no AI-specific security requirement, or no testing covering the AI components.
    partial: requirements and testing exist but scope, currency, enforcement or finding disposition is not evidenced.
    full: current independent testing covers the AI paths, the trust boundary is enforced outside the model, and findings are dispositioned with
      expiry.
  owner: Indep. Validation / InfoSec
  expected_evidence: []
  linked_play:
  - Play 3, 10
  crosswalk: []
  population_and_evidence_floor: 'Population: current testing reports plus runtime security events in the period. Evidence floor: testing that
    predates the current architecture, or zero runtime events with no test, makes the operating result NOT TESTABLE.'
  test_of_design:
  - id: D1
    text: Obtain the security or resilience requirement covering AI system security and resilience, as identified in the MAP function, are evaluated
      and documented — the threats in scope, the controls required and the assurance route.
  - id: D2
    text: 'Confirm AI-specific threats are addressed, not only conventional application security: prompt injection through retrieved or tool-returned
      content, tool misuse, model or supply-chain compromise, data exfiltration through generated output.'
  - id: D3
    text: Confirm the trust boundary is stated — which content the system treats as instruction and which as data — and what enforces it.
  - id: D4
    text: Confirm testing type, frequency and independence, and the disposition route for findings.
  - id: D5
    text: 'Confirm resilience requirements where applicable: degraded-mode behaviour, dependency failure and recovery objectives.'
  - id: s6
    text: 'Design verdict: ADEQUATE when D1-D4 hold. PARTIALLY ADEQUATE when conventional security is covered but AI-specific threat paths are
      absent. INADEQUATE when no threats are identified. NOT TESTABLE when the requirement is not produced.'
  test_of_operating_effectiveness:
  - id: O1
    text: Obtain the most recent testing covering the current architecture, and confirm its scope includes the AI components and their tool and
      data paths.
  - id: O2
    text: Verify the testing was performed against the deployed version, by a party independent of the builder.
  - id: O3
    text: Trace every material finding to remediation, re-test or an approved, time-bound acceptance.
  - id: O4
    text: Sample runtime evidence that the trust boundary holds — blocked injection attempts, refused tool calls, egress controls.
  - id: O5
    text: Verify degraded-mode and recovery behaviour was exercised where required.
  - id: s6
    text: 'Operating verdict: EFFECTIVE when current, independent testing covers the AI paths and findings are dispositioned. PARTIALLY EFFECTIVE
      when testing exists but is stale, narrow or findings remain open past target. INEFFECTIVE when the AI components were never in scope. NOT
      TESTABLE when testing reports are unavailable.'
  near_miss_failure_modes:
  - F1. The penetration test covers the web application and stops at the API, leaving the model, its tools and its retrieval path untested.
  - F2. Testing predates the current architecture — new tools or data sources were added after the last test.
  - F3. Injection defences are described as prompt-level instructions to the model, which is guidance rather than enforcement.
  - F4. Findings are closed as 'risk accepted' with no expiry and no named acceptor.
  - F5. Zero blocked attempts is offered as evidence of safety, with no test showing the defence would block.
  - F6. The system treats retrieved document content and tool output as trusted instruction.
  resolutions:
  - failure_mode: F1
    text: A test scope section naming the model, tool and retrieval components.
  - failure_mode: F2
    text: A test dated after the most recent architectural change.
  - failure_mode: F3
    text: An enforcement point outside the model — an allowlist, a schema check, a policy layer — with evidence of operation.
  - failure_mode: F4
    text: An acceptance record with a named acceptor and an expiry date.
  - failure_mode: F5
    text: A controlled injection test with the blocked result retained.
  - failure_mode: F6
    text: A design statement and runtime evidence separating instruction from data.
  test_provenance: 'Archetype: security_resilience — DRAFT, requires second-line authoring and control-owner approval before authoritative use'

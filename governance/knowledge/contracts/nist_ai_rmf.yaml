    text: 'Define the population: AI use cases, systems or activities in scope of the policy during the period, taken from the AI inventory rather
      than from a list supplied by the assessed team.'
  - id: O2
    text: Sample across materiality tiers and include at least one use case that went live in the period.
  - id: O3
    text: 'Reperform: verify each sampled item was assessed against the policy at the required point, and that any required attestation or approval
      exists and predates the activity.'
  - id: O4
    text: Inspect the exception and breach records for the period — verify each is dated, owned, time-bound and dispositioned.
  - id: s5
    text: 'Operating verdict: EFFECTIVE when sampled use follows the approved policy and exceptions are governed. PARTIALLY EFFECTIVE when compliance
      is inconsistent or exceptions are open past expiry. INEFFECTIVE when the policy was bypassed for material use. NOT TESTABLE when the in-scope
      population cannot be established.'
  near_miss_failure_modes:
  - F1. The policy is approved but has no implementing procedure — nothing in the operating environment makes the requirement happen.
  - F2. Scope is written so broadly ('all AI use') that no one can tell whether a given system is in or out.
  - F3. Exceptions are granted by the same team that needs them, with no expiry.
  - F4. The policy was approved in the period but the sampled use cases predate it and were never reassessed against it.
  - F5. A breach register exists but every entry is closed as 'noted' with no remediation or acceptance.
  resolutions:
  - failure_mode: F1
    text: A named procedure, runbook or control that implements the clause, with an owner.
  - failure_mode: F2
    text: A scope statement with inclusion and exclusion criteria, or a mapping from the inventory to in-scope flag.
  - failure_mode: F3
    text: An exception record showing an independent grantor, a stated basis and an expiry date.
  - failure_mode: F4
    text: A reassessment record for pre-existing use cases, or an approved grandfathering decision.
  - failure_mode: F5
    text: A breach entry with a remediation action, owner and closure evidence, or a formal risk acceptance.
  test_provenance: 'Archetype: policy_standard — DRAFT, requires second-line authoring and control-owner approval before authoritative use'

        '
      population: 'Play 4 Steps 1 and 3, reconciled against deployment logs.

        '
      play_refs:
      - P4.1
      - P4.3
  M3.10:
    severity: high
    lane_b_packs:
    - OVS-01
    tests:
      design: "Inspect the monitoring standard. Confirm drift, performance and stability\
        \ metrics are defined with thresholds and an owner, that alerting routes to\
        \ someone who can act, and that revalidation and backtesting cadence is set\
        \ by materiality (ISO A.6.2.6; NIST MEASURE 2.4, 3.1, MANAGE 4.1). Confirm\
        \ the model's **recovery objective is inherited from the business service\
        \ it supports** rather than set locally \u2014 the 4-hour RTO recorded against\
        \ M3.11 is a continuity parameter, not a monitoring one.\n"
      operating: 'Sample Play 5 Step 1 monitoring dashboards and Step 2 periodic re-check
        notes. Confirm monitoring ran continuously rather than at review points, that
        threshold breaches produced a recorded response, and that suppressed or muted
        alerts were reviewed. A critical model whose alerts are suppressed is monitored
        on paper only. Confirm model failure was included in continuity testing for
        the services that depend on it.

        '
      population: 'Play 5 Steps 1 and 2; alert history and suppression records; Play
        11 Step 3.

        '
      play_refs:
      - P5.1
      - P5.2
      - P11.3
      csa_pa:
      - PA 6
      parallel:
      - instrument: BCM requirements
        relationship: same-population
        additional_step: 'Whether the model is in the dependency map for the business
          service, and whether its failure has been exercised in continuity testing.
          A BCM test that never enumerated the model will not have covered it.

          '
        confidence: SHAPE
      source_caution: 'Cites MindForge AI Risk Management Toolkit (Mar 2026), not
        available to the drafter.

        '
  M3.11:
    severity: critical
    assurance_mode: human_only
    assurance_rationale: 'No deterministic Lane-B pack exists in v0.4; this control
      remains subject to explicit named human/document assurance until a machine-testable
      operating control is approved.

      '
    lane_b_packs: []
    tests:
      design: "Inspect the incident playbook. Confirm it defines what constitutes\
        \ an AI incident as distinct from an application defect, and that it carries\
        \ the regulatory clocks the sheet records: notification to MAS within **1\
        \ hour** of discovering a relevant incident, root-cause and impact report\
        \ within **14 days**, and a **4-hour RTO** for critical systems, per FSM-N05\
        \ (eff. 10 May 2024, superseding Notices 644 / 127 / PSN05). Confirm the exact\
        \ FSM notice reference for the licence type \u2014 the sheet flags this as\
        \ unconfirmed. MAS Notice 655 Cyber Hygiene is a separate instrument. Then\
        \ confirm the playbook **determines, at classification, whether the affected\
        \ system is CII-designated**, and routes to the Commissioner of Cybersecurity\
        \ as well as to MAS where it is. Play 6 Step 4's recorded output is \"MAS\
        \ notification (\u22641 hr); RCA & impact report\" \u2014 a single path \u2014\
        \ so the playbook itself may carry this gap. PA 10 adds a dimension: whether\
        \ detection is engineered and response automated. For agentic systems that\
        \ is the difference between a 1-hour clock being achievable and being aspirational.\n"
      operating: "Three populations. Tested separately the sample is self-selecting.\
        \ (a) Incidents classified as AI incidents: sample Play 6 Step 2 classifications\
        \ and Step 4 notification records. Measure elapsed time from **discovery**\
        \ to notification against the 1-hour clock, and corroborate the discovery\
        \ timestamp independently \u2014 discovery is what organisations get wrong,\
        \ because the clock starts before anyone opens a ticket. Confirm the 14-day\
        \ RCA landed and the 4-hour RTO was met for critical systems. (b) Incidents\
        \ not so classified: sample application defect and problem tickets for model-behaviour\
        \ symptoms. A model incident logged as a defect never enters population (a),\
        \ so the notification test passes while the control fails. (c) Incidents touching\
        \ CII-designated systems: confirm both notification paths ran, on their own\
        \ clocks. Passing the MAS test proves nothing about the second obligation.\n"
      population: 'Play 6 Steps 1, 2 and 4; the application defect and problem ticket
        queues for the same period; and the CII asset register for stratum (c).

        '
      play_refs:
      - P6.1
      - P6.2
      - P6.4
      csa_pa:
      - PA 10
      parallel:
      - instrument: "Cybersecurity Act \u2014 CII regime"
        relationship: separate-clock
        additional_step: 'Where an AI system supports a designated CII, notification
          runs to the Commissioner of Cybersecurity on its own timeline, with its
          own trigger definition, alongside periodic audit and risk assessment obligations.
          Different recipient, different clock. An incident can be notified to MAS
          on time and to the Commissioner late while every MAS-facing test passes.

          '
        confidence: SHAPE
      - instrument: TRM Guidelines
        relationship: same-population
        additional_step: 'AI incident definition. A TRMG incident regime handles severity,
          escalation and RCA; it does not define model-behaviour failure as an incident
          class, which is what causes such incidents to be logged as defects.

          '
        confidence: KNOWN
  M3.12:
    severity: high
    assurance_mode: lane_b
    assurance_rationale: 'Deterministic operating evidence is available through the
      declared Lane-B pack(s); document evidence remains available for Lane-A context.

      '
    lane_b_packs:
    - EVL-02
    - EVL-07
    - EVL-09
    tests:
      design: 'Inspect the change standard as it applies to models. Confirm retraining,
        threshold adjustment and decommissioning are in scope as changes, that emergency
        change is defined with a ratification window, and that freeze exemption authority
        is named (ISO A.6.2.2, A.6.2.6; NIST MANAGE 2.2, 4.2). PA 5 frames the forward
        risk: capacity to triage and deploy a flood of AI-related patches, including
        vendor-pushed model updates.

        '
      operating: "Sample across three populations \u2014 normal, emergency, and changes\
        \ implemented inside a declared freeze. Confirm authorisation predates the\
        \ first production action, that privileged access reconciles to the approved\
        \ change number with no standing accounts, that the person who used it is\
        \ a named implementer on that change, and that production state was verified\
        \ against the approved plan with deviations approved rather than closed silently.\
        \ Reconcile against Play 8 Step 2 re-validation where the change was material\
        \ enough to require it.\n"
      population: 'Change register for the model-serving estate, PAM checkout records
        and session recordings, one quarter, full population where small enough; Play
        8 Steps 2 and 4.

        '
      play_refs:
      - P8.2
      - P8.4
      csa_pa:
      - PA 5
      parallel:
      - instrument: TRM Guidelines
        relationship: same-population
        additional_step: "Whether **retraining** is treated as a change. This is the\
          \ whole of the AI-specific addition. A TRMG change-and-access test on the\
          \ model-serving estate \u2014 authorisation, privileged access reconciliation,\
          \ session recording, post-implementation verification \u2014 will pass without\
          \ ever asking it, because retraining does not look like a release. Cite\
          \ the existing TRMG evidence for the access and authorisation limbs rather\
          \ than re-performing them.\n"
        confidence: KNOWN
      - instrument: MAS Notice 655 (Cyber Hygiene)
        relationship: same-population
        additional_step: 'None. The administrative-account and privileged-access obligations
          overlap the PAM limb of this test; cite the 655 evidence.

          '
        confidence: SHAPE
  M3.13:
    severity: medium
    lane_b_packs: []
    tests:
      design: 'Inspect the decommissioning checklist. Confirm it covers dependent
        systems, data retention and deletion, access removal, inventory retirement,
        and communication to consumers of the model''s output (ISO A.6.2.6; NIST GOVERN
        1.7, MANAGE 2.4). PA 7 frames decommissioning as attack-surface reduction,
        so confirm the checklist reduces surface rather than only recording closure.

        '
      operating: "Sample Play 9 outputs \u2014 Step 1 phase-out plan, Step 2 data\
        \ disposal record, Step 3 access-removal log, Step 4 archive and inventory\
        \ update. Confirm the inventory entry was retired rather than left stale,\
        \ and that access removal actually completed. A model retired in the register\
        \ whose service account still authenticates is the near-miss. Verify dependency\
        \ severance against the **dependency map used for continuity**, not only against\
        \ the inventory entry.\n"
      population: "Play 9 Steps 1\u20134; inventory history; access records; BCM dependency\
        \ map.\n"
      play_refs:
      - P9.1
      - P9.2
      - P9.3
      - P9.4
      csa_pa:
      - PA 7
      parallel:
      - instrument: BCM requirements
        relationship: same-population
        additional_step: 'Whether the continuity dependency map was updated on retirement.
          A stale map is a continuity finding that surfaces only in an incident.

          '
        confidence: SHAPE
  M3.14:
    severity: high
    lane_b_packs: []
    tests:
      design: "Inspect vendor due diligence standards and contract templates. Confirm\
        \ they address AI specifically \u2014 change notification, evaluation rights,\
        \ sub-processor and model provenance, exit \u2014 and that risk tiering drives\
        \ diligence depth (ISO A.10.2\u2013A.10.4; NIST GOVERN 6.1, 6.2, MANAGE 3.1,\
        \ 3.2). Then confirm the process **determines whether the arrangement is outsourcing,\
        \ and if so whether it is material outsourcing**, and routes it to the existing\
        \ outsourcing register rather than running a parallel AI-only assessment.\
        \ A foundation-model provider serving a customer-affecting decision is a candidate\
        \ material outsourcing arrangement.\n"
      operating: "Sample Play 7 outputs. Confirm Step 1 due diligence preceded Step\
        \ 2 contract signature, that AI-specific clauses are present in the executed\
        \ contract, that Step 3 recorded concentration and versioning, and that Step\
        \ 4's vendor monitoring plan is operating. Test whether a vendor-pushed model\
        \ change was notified and assessed \u2014 the trigger almost nobody has wired\
        \ in. **Reconcile the AI vendor population against the outsourcing register\
        \ in both directions.** An AI service that never reached the register is the\
        \ finding, and it is more serious than a missing contract clause.\n"
      population: "Play 7 Steps 1\u20134; vendor change notifications for the period;\
        \ the outsourcing register and its material-outsourcing classifications.\n"
      play_refs:
      - P7.1
      - P7.2
      - P7.3
      - P7.4
      csa_pa:
      - PA 3
      parallel:
      - instrument: MAS outsourcing requirements
        relationship: additional-obligation
        additional_step: 'Register entry, material-outsourcing classification, notification
          or consultation where material, audit and inspection rights, and exit planning.
          None of these are reached by an AI due-diligence test. Test the routing
          into the register, not the register itself.

          '
        confidence: SHAPE
      crosswalk_notes: "F3 records third-party model accountability as non-delegable\
        \ \u2014 the same principle as outsourcing not transferring accountability.\
        \ Test the two together or they will produce two accountability answers for\
        \ the same vendor.\n"
  M3.15:
    severity: critical
    assurance_mode: lane_b
    assurance_rationale: 'Deterministic operating evidence is available through the
      declared Lane-B pack(s); document evidence remains available for Lane-A context.

      '
    lane_b_packs:
    - STR-01
    - STR-02
    tests:
      design: "This is the agentic hinge. The sheet links it to **all** of MGF D1\u2013\
        D4 and SAFR S1\u2013S4, where every other control links to a handful. So the\
        \ design test is not whether an assessment document exists but whether the\
        \ assessment **routes**: confirm that identifying a use case as generative\
        \ or agentic brings the D and S control sets into scope, with a defined trigger\
        \ and a named owner for that scoping decision. An assessment that concludes\
        \ in a rating and routes nowhere fails however thorough it is.\n"
      operating: "Take the GenAI and agentic use cases in the inventory and test coverage:\
        \ for each, confirm the D and S controls are in scope and have an assessment\
        \ status, not merely that a risk assessment exists. Then test concentration\
        \ directly \u2014 trace how many in-scope use cases depend on a single foundation-model\
        \ provider, and confirm that exposure is reported somewhere a decision could\
        \ be taken on it. Sample Play 10 Steps 1 to 5 for the stress and red-team\
        \ cycle, and confirm Step 5 committee sign-off closed the loop.\n"
      population: "GenAI and agentic entries in the AI inventory; the MGF and SAFR\
        \ libraries' coverage for those entries; Play 10 Steps 1\u20135.\n"
      play_refs:
      - P10.1
      - P10.2
      - P10.3
      - P10.4
      - P10.5
      csa_pa:
      - PA 3
      source_caution: 'Cites MindForge AI Risk Management Toolkit (Mar 2026), not
        available to the drafter. The toolkit may define GenAI risk categories this
        test does not cover.

        '
  M4.1:
    severity: medium

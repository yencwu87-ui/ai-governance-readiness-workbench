    lane_b_packs: []
    tests:
      design: "Inspect the transparency assessment and customer disclosure standard\
        \ against FEAT \xA7C. Confirm disclosure is specified per stakeholder \u2014\
        \ customer, regulator, internal \u2014 and proportionate to materiality (ISO\
        \ A.8.2, A.8.5; NIST MEASURE 2.8, 2.9).\n"
      operating: 'Sample customer-facing AIDA decisions. Confirm disclosure was made

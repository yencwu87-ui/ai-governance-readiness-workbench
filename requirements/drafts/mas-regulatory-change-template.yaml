        \ test.\n"
      operating: "Sample AIDA decisions, **including those driven by third-party or\
        \ foundation models**. For each, confirm a named internal individual is accountable\
        \ for the outcome \u2014 not that the vendor is contractually responsible,\
        \ which is the substitution this control exists to prevent. Confirm the Play\
        \ 2 Step 5 and Play 4 Step 3 records carry that name, and that the matrix\
        \ was updated when roles changed. Reconcile against the outsourcing register\
        \ used in M3.14: the accountable individual for an AI arrangement should be\
        \ the same person in both records. Two names is the finding.\n"
      population: 'Play 2 Step 5, Play 4 Step 3 and Play 8 Step 4 records, stratified

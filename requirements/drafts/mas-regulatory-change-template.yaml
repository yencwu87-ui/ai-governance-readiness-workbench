version: 1-DRAFT
library: MAS
controls:
  M1.1:
    requirement: 'Senior management and the accountable AI governance body establish
      clear accountability for AI risk, approve the AI risk management framework and
      risk appetite, and retain decision rights for material AI risk rather than delegating
      them to the model or implementation team.

      '
    elements:
    - id: e1
      text: A named senior management or governance body has an approved mandate covering
        AI risk oversight and decision rights
      basis: P017
      scope: programme
    - id: e2
      text: The AI risk management framework and applicable risk appetite or tolerances
        are formally approved and current
      basis: P017
      scope: programme
    - id: e3
      text: Material AI risk decisions are attributable to the accountable governance
        body or named senior accountable role, with the decision record retained
      basis: P017
      scope: programme
    boundary:
      none: General statements that management supports responsible AI without a named
        mandate, approved framework or accountable decision record
      partial: A mandate and/or approved framework exists, but one or more decision-rights
        or approval elements is not evidenced
      full: The mandate, approved framework/risk appetite and attributable material-risk
        decision rights are evidenced and current
    source:
    - instrument: AI MRM Paper (Dec 2024)
      note: Board and senior management accountability for AI risk
      confidence: known
    - instrument: AIRG Consultation Paper P017-2025
      note: Proposed governance and accountability expectations
      confidence: unchecked
    rationale: Programme-level control; should not be satisfied by a single model
      validation report.
  M3.7:
    requirement: 'AI systems are subject to security controls and testing proportionate
      to their risk, including model-specific threats, the runtime environment and
      the actual paths by which the system can reach networks, data or privileged
      functions; material findings are tracked to closure or formally accepted before
      production use.

      '
    elements:
    - id: e1
      text: A named AI security threat set is defined and used to test the model or
        AI system for model-specific threats relevant to its deployment
      basis: P017
      scope: model
    - id: e2
      text: Security testing is completed before deployment and material findings
        are tracked to closure or formally accepted risk
      basis: P017
      scope: model
    - id: e3
      text: The runtime's actual network, data-store or privileged reachability is
        tested against the intended security boundary, not only against configured
        identities or policy intent
      basis: PRACTICE
      scope: model
    - id: e4
      applies_when: where a material change occurs
      text: Security testing or validation is repeated after the material change before
        re-release
      basis: P017
      scope: model
    boundary:
      none: Generic cybersecurity policy or product-security statements with no AI-specific
        testing
      partial: Security testing exists, but model-specific coverage, runtime reachability
        or change-triggered re-testing is incomplete
      full: Applicable security elements are evidenced for the deployed model/system
        and material-change re-testing is performed where the condition applies
    source:
    - instrument: AIRG Consultation Paper P017-2025
      note: Technology and cybersecurity controls
      confidence: unchecked
    rationale: Keep the requirement concise and use the operating test for named threat
      catalogues and reachability evidence.
  M3.9:
    requirement: 'A model cannot be released to production until objective release
      criteria are satisfied, the authorised approver has reviewed the required evidence
      and residual risk, and the approval is recorded before the first production
      action.

      '
    elements:
    - id: e1
      text: Objective release criteria and required evidence are defined before deployment
      basis: P017
      scope: model
    - id: e2
      text: The authorised approver reviews the release evidence and accepts or rejects
        residual risk
      basis: P017
      scope: model
    - id: e3
      text: The approval is attributable to a named person or role and is recorded
        before the first production action
      basis: P017
      scope: model
    - id: e4
      applies_when: where high-materiality criteria apply
      text: Required independent validation or FEAT sign-off is complete before release
      basis: P017
      scope: model
    boundary:
      none: A release checklist or intent exists but no attributable production approval
        is evidenced
      partial: Release approval is evidenced, but one or more objective criteria,
        timing, authority or high-materiality prerequisite is not demonstrated
      full: All applicable release criteria are met, required evidence is reviewed,
        and attributable approval predates production action
    source:
    - instrument: AI MRM Paper (Dec 2024)
      note: Pre-deployment review and approval
      confidence: known
    - instrument: AIRG Consultation Paper P017-2025
      note: Proposed lifecycle release controls
      confidence: unchecked
    rationale: The time-ordering test belongs in the operating control; the requirement
      defines what the gate must establish.
  M3.11:
    requirement: 'The organisation maintains an AI-specific incident management and
      escalation process that defines incident classification, accountable responders,
      escalation thresholds, required records, notification paths and recovery expectations,
      with applicable regulatory timelines validated against the organisation''s licence
      and system criticality.

      '
    elements:
    - id: e1
      text: The incident playbook defines what constitutes an AI incident and distinguishes
        model-behaviour incidents from ordinary application defects
      basis: P017
      scope: programme
    - id: e2
      text: Incident roles, escalation authority, response records and recovery expectations
        are assigned and documented
      basis: P017
      scope: programme
    - id: e3
      text: Applicable external notification obligations and deadlines are identified
        for the relevant licence, service and system criticality
      basis: PRACTICE
      scope: programme
    - id: e4
      applies_when: where a designated CII or other separately regulated environment
        is in scope
      text: Separate notification paths and clocks are identified and tested independently
      basis: PRACTICE
      scope: programme
    boundary:
      none: A general incident-management policy exists with no AI-specific classification
        or escalation path
      partial: AI incidents and escalation are documented, but one or more notification,
        recovery or separately regulated path is incomplete
      full: Applicable AI incident classification, accountability, escalation, notification
        and recovery obligations are documented and attributable, including separate
        regulatory paths where applicable
    source:
    - instrument: AIRG Consultation Paper P017-2025
      note: Incident management and escalation
      confidence: unchecked
    rationale: Regulatory clocks in the workbook are intentionally not hard-coded
      as universally applicable; the control requires licence-specific confirmation.
  F1:
    requirement: 'For AI-assisted decisions that may materially affect individuals
      or groups, fairness is assessed using an appropriate methodology and defined
      measures, material disparities are investigated, and the outcome and any remediation
      are reviewed before deployment and after material change or identified drift.

      '
    elements:
    - id: e1
      text: The affected individuals or groups and the fairness dimensions relevant
        to the use case are identified before assessment
      basis: FEAT
      scope: model
    - id: e2
      text: Fairness measures or qualitative assessment criteria and decision thresholds
        are defined and supported by appropriate data
      basis: FEAT
      scope: model
    - id: e3
      text: Assessment results identify material disparities, limitations and remediation
        actions, with an accountable reviewer recording the outcome
      basis: FEAT
      scope: model
    - id: e4
      applies_when: where high-materiality or material change triggers apply
      text: Independent validation or re-assessment is completed before release or
        continued use
      basis: FEAT
      scope: model
    boundary:
      none: A general fairness statement exists without a use-case-specific assessment
      partial: Fairness has been assessed, but measures, affected groups, thresholds,
        remediation or change-triggered re-assessment is incomplete
      full: Applicable fairness assessment elements are evidenced, material findings
        are addressed or accepted by the accountable reviewer, and required re-assessment
        has occurred
    source:
    - instrument: FEAT (2018)
      note: Fairness principle and assessment methodology
      confidence: known
    rationale: Use the organisation's approved FEAT-aligned method and do not infer
      protected-group analysis from generic model performance metrics.
  F3:
    requirement: 'Accountability for AI-assisted decisions is explicit and attributable
      across internal owners, decision-makers and relevant third parties, with authority,
      responsibilities and escalation rights documented and retained.

      '
    elements:
    - id: e1
      text: The accountable business and AI-risk owners for the use case are named
      basis: FEAT
      scope: model
    - id: e2
      text: Decision rights, approval authority and escalation responsibilities for
        AI-assisted decisions are documented
      basis: FEAT
      scope: model
    - id: e3
      text: Third-party model or service accountability remains assigned to an internal
        accountable owner rather than being delegated contractually to the provider
      basis: FEAT
      scope: model
    - id: e4
      applies_when: where material decisions are customer-facing or otherwise externally
        consequential
      text: Internal and external communication or complaint/escalation ownership
        is identified for decisions materially affected by AI
      basis: FEAT
      scope: model
    boundary:
      none: Roles are discussed but no accountable decision owner or authority is
        attributable
      partial: Accountable owners exist, but decision rights, third-party accountability
        or external escalation ownership is incomplete
      full: All applicable accountability elements are named, authoritative and evidenced
        for the use case
    source:
    - instrument: FEAT (2018)
      note: Accountability principle
      confidence: known
    rationale: 'Keep this distinct from M1.1: M1.1 is programme governance; F3 is
      accountability for the individual AI-assisted decision/use case.

      '
  M3.12:
    requirement: "Changes to deployed AI models \u2014 including retraining, feature\
      \ pipeline changes, threshold adjustments and decommissioning \u2014 are authorised\
      \ before implementation, and the change that reached production is verifiably\
      \ the change that was approved.\n"
    elements:
    - id: e0
      lane: b
      text: "The change register is complete and internally consistent \u2014 no duplicate\
        \ change ids, no unexplained gaps in the sequence, and entries current with\
        \ the changes actually made\n"
      basis: PRACTICE
      scope: model
    - id: e1
      text: Model changes are raised as changes, including scheduled retraining
      basis: MRM
    - id: e2
      text: 'Authorisation is recorded before the first production action, including
        for emergency changes, evidenced by an approval timestamp and a production-action
        timestamp comparable to the minute

        '
      basis: PRACTICE
    - id: e3
      applies_when: where privileged access management is in place
      text: 'Privileged access used to implement the change is obtained against the
        approved change number, with no use of standing accounts

        '
      basis: PRACTICE
    - id: e3b
      applies_when: where privileged access management is in place
      text: 'The person who used that access is a named implementer on the approved
        change

        '
      basis: PRACTICE
    - id: e4
      applies_when: where a post-implementation verification step exists
      text: 'Production state after implementation is verified against the approved
        plan, with deviations approved rather than closed silently

        '
      basis: PRACTICE
    boundary:
      none: A procedure, target operating model or intent, with no change records
      partial: 'Change records exist and cover the AI estate, but one or more of e0,
        e2, e3, e3b or e4 does not operate consistently across the tested population

        '
      full: "All applicable model-scoped elements evidenced across a tested population.\
        \ An element whose applies_when condition is not met is recorded as not applicable\
        \ with the reason, and does not count against the rating \u2014 a control\
        \ managed adequately by other means is not a gap. Observations or housekeeping\
        \ findings recorded in an assurance review do not prevent full\n"
    source:
    - instrument: AI MRM Paper (Dec 2024)
      note: Change and version control over deployed models
      confidence: known
    - instrument: AIRG Consultation Paper P017-2025
      note: "UNVERIFIED \u2014 confirm the section before relying on this attribution"
      confidence: unchecked
    rationale: "e1 is the classic finding \u2014 retraining treated as BAU rather\
      \ than as change. e3 and e4 are audit practice rather than anything I can cite\
      \ to MAS; decide whether they belong in a MAS-attributed requirement or in an\
      \ internal standard this requirement points at.\n"
  M3.6:
    requirement: "Models are evaluated against pre-defined metrics on representative\
      \ held-out data, tested for safe behaviour under the conditions they will actually\
      \ meet, and challenged by a validator who did not build them \u2014 with the\
      \ outcome recorded against a named accountable person before production go-live,\
      \ at a depth proportionate to the model's materiality.\n"
    elements:
    - id: e1
      text: 'Evaluation results exist for the specific model version, measured against
        pre-defined metrics on representative held-out data

        '
      basis: P017
      scope: model
    - id: e2
      text: "Testing covers behaviour under conditions the model will meet \u2014\
        \ robustness, stress, edge case, bias and fairness, adversarial and security\
        \ testing, and integration or UAT in a production-like environment\n"
      basis: P017
      scope: model
    - id: e3
      text: Validation was performed by someone who did not build the model
      basis: P017
      scope: model
    - id: e3b
      text: 'The review covers conceptual soundness, replication, and whether the
        developer''s own evaluation and testing were adequate

        '
      basis: P017
      scope: model
    - id: e4
      text: 'The validator is separate from the developing function, with no reporting
        line into it, and the person who signs the opinion is named

        '
      basis: P017
      scope: model
    - id: e4b
      text: The validator is separate from the business owner of the use case
      basis: P017
      scope: model
    - id: e5
      text: A validation outcome is recorded and dated
      basis: P017
      scope: model
    - id: e5d
      applies_when: where a deployment record is available alongside the validation
        outcome
      text: 'The recorded date precedes the production go-live date, and both dates
        are evidenced

        '
      basis: P017
      scope: model
    - id: e5b
      text: The validation outcome is recorded against a named accountable person
      basis: P017
      scope: model
    - id: e5c
      text: 'The validation outcome states limitations, conditions of use and residual
        risk accepted

        '
      basis: P017
      scope: model
    - id: e6
      text: 'The depth of validation is proportionate to the model''s materiality,
        tiered on impact, complexity and reliance

        '
      basis: P017
      scope: programme
    - id: e7
      text: "Re-validation triggers are defined \u2014 material change, model or version\
        \ upgrade including vendor-pushed updates, drift threshold breach, data source\
        \ change, incident, and a periodic cadence by tier\n"
      basis: P017
      scope: programme
    - id: e8
      text: "Third-party models are validated at use-case and system level \u2014\
        \ own evaluation set, benchmarking, guardrail testing, vendor attestations,\
        \ and a contractual right to change notification\n"
      basis: P017
      scope: programme
    conditional_elements:
    - applies_when: third_party_model
      text: 'The validator is separate from the vendor relationship manager, and the
        review addresses what could not be validated because the weights were not
        available

        '
      basis: P017
    - applies_when: genai
      text: 'A fixed evaluation set with groundedness, hallucination and refusal measures;
        prompt injection, data leakage and output-boundary testing

        '
      basis: P017
    - applies_when: agentic
      text: 'Tool-use and action-boundary testing, and a kill switch or override for
        high materiality models

        '
      basis: P017
    boundary:
      none: 'A testing standard, validation plan or intent, with no evaluation or
        test results

        '
      partial: 'Results exist but independence is absent or not evidenced (e3, e4).
        Reciprocal peer review inside the developing team is partial credit, not independence

        '
      full: "Every model-scoped element evidenced. Conditions, exceptions or open\
        \ items recorded in the validator's own opinion do not prevent full \u2014\
        \ they evidence that the control operates\n"
    source:
    - instrument: AIRG Consultation Paper P017-2025
      note: "Evaluation, testing and independent validation. Industry feedback (ASIFMA)\
        \ sought clarification on what triggers full pre-deployment independent validation\
        \ and on supplier assurances such as attestations and certifications \u2014\
        \ the final Guidelines may land either way, so e8 is written to work under\
        \ both\n"
      confidence: known
    - instrument: AI MRM Paper (Dec 2024)
      note: Independent validation proportionate to materiality
      confidence: known
    rationale: "e5 is the element most likely to be tested by an examiner, because\
      \ it is binary and evidenced \u2014 a go-live either has a recorded validation\
      \ outcome against a named person or it does not. e7's vendor-pushed upgrade\
      \ trigger is the gap almost nobody has wired in. e6, e7 and e8 are programme-level:\
      \ they need a validation standard or register, not a model report, so an assessment\
      \ that expects them from a single model's evidence will under-credit it.\n"
settings:
  elements_replace_artefacts: true
  prompt_boundary: false
  element_scopes:
  - model
test_controls:
  M1.1:
    severity: critical
    assurance_mode: human_only
    assurance_rationale: 'No deterministic Lane-B pack exists in v0.4; this control
      remains subject to explicit named human/document assurance until a machine-testable
      operating control is approved.

      '
    lane_b_packs: []
    tests:
      design: 'Inspect the board mandate and approved framework. Confirm AI risk is
        named in a board or board-committee charter rather than inferred from technology
        risk, that framework approval sits with a named body, and that the mandate
        distinguishes what senior management is accountable for from what it is informed
        of. ISO A.3.2 requires accountability to be explicitly assigned, so a mandate
        naming a committee without naming what it decides fails the design test.

        '
      operating: 'Confirm the framework and risk appetite were tabled for approval
        rather than noting, that the approving body was quorate, and that decisions
        are minuted with attendance. An item appearing only as information is the
        near-miss to look for.

        '
      population: 'Board and AI risk committee minutes and papers, per the control''s
        review cycle.

        '
      csa_pa:
      - PA 2
      - PA 6
      crosswalk_notes: "MGF D2.1 | SAFR S1.2 \u2014 agent authority is bounded by\
        \ what this mandate authorises. Where agents transact, test that the mandate\
        \ reaches agent authority rather than stopping at model approval.\n"
  M1.2:
    severity: high
    lane_b_packs: []
    tests:
      design: "Inspect the AI use policy. Confirm scope covers the AI in the inventory,\
        \ that principles are stated as requirements with owners rather than aspirations,\
        \ and that the policy names its approver and review cycle (ISO A.2.3, A.2.4).\
        \ Per the sheet's note, confirm the four FEAT principles map onto F1\u2013\
        F4 as their implementing controls \u2014 a principle with no implementing\
        \ control is a policy statement, not a control.\n"
      operating: 'Confirm the version in force at each sampled date, that the review
        cycle was met, and that exceptions were approved at the authority the policy
        reserves them to. Test the mapping both ways: a change to a FEAT control should
        have been reflected upward, and a policy principle without an implementing
        control should have been raised.

        '
      population: "Policy version history, exception register, and the F1\u2013F4\
        \ control records.\n"
      csa_pa:
      - PA 2
  M1.3:
    severity: high
    lane_b_packs: []
    tests:
      design: "Inspect terms of reference. Confirm membership spans the functions\
        \ the forum needs in order to decide \u2014 risk, technology, business, compliance,\
        \ legal \u2014 that it holds decision rights rather than advisory standing,\
        \ and that escalation into and out of it is defined (ISO A.3.2; NIST GOVERN\
        \ 2.1). PA 4 frames this as a cross-functional forum able to evaluate and\
        \ accelerate, so confirm it can say yes as well as no.\n"
      operating: "Confirm the stated cadence was met, quorum was reached, decisions\
        \ are recorded with owners and dates, and prior actions were closed or re-tabled.\
        \ The committee is the decision-maker at Play 1 Step 4, Play 2 Step 5, Play\
        \ 4 Step 3, Play 5 Step 3, Play 8 Step 4 and Play 10 Step 5 \u2014 reconcile\
        \ its minutes against those step outputs to test whether it decided what the\
        \ plays say it decides.\n"
      population: 'Committee minutes and action logs, plus the six play step outputs
        above.

        '
      csa_pa:
      - PA 4
  M1.4:
    severity: high
    lane_b_packs: []
    tests:
      design: 'Inspect the risk appetite statement. Confirm AI risk is expressed in
        measurable terms rather than adjectives, that tolerance levels carry breach
        consequences, and that appetite is distinguished from capacity (ISO A.5.2;
        NIST GOVERN 1.3, MAP 1.5).

        '
      operating: 'Confirm appetite metrics were reported at the stated cadence, breaches
        were escalated per the statement, and any appetite change was approved by
        the body that owns it. The materiality routing at Play 1 Step 4 should be
        traceable to these tolerance levels; if routing thresholds and appetite are
        set independently, that is the finding.

        '
      population: 'Appetite reporting pack, breach log, and Play 1 Step 4 routing
        decisions.

        '
      csa_pa:
      - PA 4
  M1.5:
    severity: medium
    lane_b_packs:
    - OVS-02
    tests:
      design: "Inspect the training plan. Confirm it differentiates by role \u2014\
        \ board, model owners, first-line users, control functions \u2014 rather than\
        \ a single all-staff module, that completion is mandated with a consequence,\
        \ and that it addresses AI literacy and not only policy awareness (ISO A.3.3,\
        \ A.4.6).\n"
      operating: "Test completion against the mandated population, confirm non-completion\
        \ was followed up, and confirm content was refreshed after material regulatory\
        \ or internal change. Play 11 Step 2 produces training records on onboarding\
        \ and on cadence for agentic operation \u2014 test that population separately,\
        \ since agentic oversight training is where the gap usually sits.\n"
      population: 'Training records, course version history, and Play 11 Step 2 output.

        '
      play_refs:
      - P11.2
      csa_pa:
      - PA 2
  M2.1:
    severity: high
    lane_b_packs: []
    tests:
      design: 'Inspect the identification procedure. Confirm it defines what counts
        as AI for the organisation''s purposes, names who must identify it and when,
        and covers AI arriving embedded in vendor products rather than only AI the
        organisation builds (NIST MAP 1.1).

        '
      operating: "Take a population independent of the inventory \u2014 procurement\
        \ records, cloud service consumption, model-serving infrastructure \u2014\
        \ and test whether the AI in it was identified and reached Play 1 Step 1 as\
        \ an intake form. Testing the inventory against itself proves nothing; the\
        \ test is whether AI outside the intake process exists.\n"
      population: 'Procurement and vendor records and platform consumption data, reconciled
        against Play 1 Step 1 intake forms.

        '
      play_refs:
      - P1.1
      csa_pa:
      - PA 2
      - PA 7
  M2.2:
    severity: critical
    assurance_mode: lane_b
    assurance_rationale: 'Deterministic operating evidence is available through the
      declared Lane-B pack(s); document evidence remains available for Lane-A context.

      '
    lane_b_packs:
    - GOV-02
    tests:
      design: "Inspect the register. ISO A.4.2\u2013A.4.5 covers the resources an\
        \ AI system depends on \u2014 data, tooling, computing and human resources\
        \ \u2014 so confirm the register captures dependencies and not only a list\
        \ of models. Confirm each entry carries an owner, materiality, lifecycle status,\
        \ and that the register defines who may add and retire entries. PA 7 goes\
        \ further and requires a **continuous** inventory with **generated SBOMs**:\
        \ confirm whether the standard requires a real bill of materials or a hand-maintained\
        \ dependency list. Those are different artefacts and only one is verifiable.\n"
      operating: "Test completeness both ways against Play 1 Step 2: sample deployed\
        \ models and confirm an inventory entry exists; sample entries and confirm\
        \ the model still exists and its status is current. Then test dependency currency\
        \ \u2014 dependencies rot first and a model-only test never reaches them.\
        \ Where SBOMs are produced, verify one against the running artefact rather\
        \ than accepting its existence.\n"
      population: 'AI inventory register and Play 1 Step 2 entries, plus deployment
        records.

        '
      play_refs:
      - P1.2
      csa_pa:
      - PA 2
      - PA 7
      lane_b_candidate: "SBOM generation and drift between SBOM and running artefact\
        \ are machine-verifiable. This is the strongest candidate on the MAS sheet\
        \ to move out of the judged lane into a Lane B control pack \u2014 a generated\
        \ SBOM either matches or it does not.\n"
  M2.3:
    severity: critical
    assurance_mode: lane_b
    assurance_rationale: 'Deterministic operating evidence is available through the
      declared Lane-B pack(s); document evidence remains available for Lane-A context.

      '
    lane_b_packs:
    - GOV-04
    tests:
      design: "Inspect the materiality methodology. Confirm impact, complexity and\
        \ reliance are defined with criteria a second assessor could apply to the\
        \ same case and reach the same tier, and that inherent and residual are distinguished\
        \ (ISO A.5.2\u2013A.5.5).\n"
      operating: 'Sample Play 1 Step 3 materiality scores and rationales. Confirm
        each names an assessor and date, that the tier follows arithmetically from
        the recorded scores, and that Play 8 Step 1 updated materiality at the re-validation
        cadence. A tier no second assessor can reproduce from the recorded rationale
        is the near-miss.

        '
      population: 'Play 1 Step 3 scores and rationales; Play 8 Step 1 updated materiality.

        '
      play_refs:
      - P1.3
      - P8.1
      csa_pa:
      - PA 6
      crosswalk_notes: "MGF D1.1, D1.2 | SAFR S1.5 \u2014 this tier drives agent risk\
        \ tiering and threshold binding. Where agents are in scope, test that the\
        \ tier propagated to the agent controls rather than stopping at the model.\n"
  M2.4:
    severity: high
    lane_b_packs: []
    tests:
      design: 'Inspect the lifecycle risk register. Confirm risks are captured at
        each lifecycle stage rather than only at inception, and that ownership and
        treatment are recorded (NIST MANAGE 1.1, 1.2).

        '
      operating: "Sample Play 2 Step 1 impact analyses and Step 3 failure-mode registers.\
        \ Confirm risks were re-assessed at stage transitions, treatments carry owners\
        \ and dates, and overdue treatments were escalated. Test whether failure modes\
        \ identified at Play 2 appear in the monitoring at Play 5 Step 1 \u2014 a\
        \ failure mode nobody monitors was identified and then dropped.\n"
      population: 'Play 2 Steps 1 and 3; Play 5 Step 1 monitoring dashboard.

        '
      play_refs:
      - P2.1
      - P2.3
      csa_pa:
      - PA 6
  M3.1:
    severity: high
    lane_b_packs: []
    tests:
      design: "Inspect data lineage and quality standards. Confirm provenance is recorded\
        \ to source, representativeness against the intended population is assessed\
        \ rather than assumed, and quality thresholds are defined with an action on\
        \ breach (ISO A.7.2\u2013A.7.6; NIST MAP 2.3).\n"
      operating: 'Sample Play 3 Step 1 data sign-offs. Confirm lineage is traceable
        to source for the training data actually used, quality checks ran at the stated
        frequency, and the sign-off addresses representativeness rather than only
        completeness.

        '
      population: 'Play 3 Step 1 data sign-offs and the underlying quality check output.

        '
      play_refs:
      - P3.1
      parallel:
      - instrument: PDPA / DPIA process
        relationship: same-population
        additional_step: "None from this control. Play 2 Step 2 already routes the\

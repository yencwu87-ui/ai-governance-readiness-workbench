        that Play 8 Step 4 re-confirmed on cadence.

        '
      population: 'Play 2 Step 5; Play 4 Step 3; Play 8 Step 4.

        '
      play_refs:
      - P2.5
      - P4.3
      - P8.4
  F3:
    severity: critical
    assurance_mode: human_only
    assurance_rationale: 'No deterministic Lane-B pack exists in v0.4; this control
      remains subject to explicit named human/document assurance until a machine-testable
      operating control is approved.

      '
    lane_b_packs: []
    tests:
      design: 'Inspect the accountability matrix and internal authorisation record
        against FEAT §B. Confirm accountability is assigned to **named individuals**
        rather than to teams, and that internal and external accountability are distinguished.
        Critically, per the sheet''s note, confirm the matrix covers **third-party
        model accountability, which is non-delegable** — an entry pointing at a vendor
        rather than at an internal individual fails the design test.

        '
      operating: 'Sample AIDA decisions, **including those driven by third-party or
        foundation models**. For each, confirm a named internal individual is accountable
        for the outcome — not that the vendor is contractually responsible, which
        is the substitution this control exists to prevent. Confirm the Play 2 Step
        5 and Play 4 Step 3 records carry that name, and that the matrix was updated
        when roles changed. Reconcile against the outsourcing register used in M3.14:
        the accountable individual for an AI arrangement should be the same person
        in both records. Two names is the finding.

        '
      population: 'Play 2 Step 5, Play 4 Step 3 and Play 8 Step 4 records, stratified
        to include third-party model use cases; accountability matrix version history;
        the outsourcing register.

        '
      play_refs:
      - P2.5
      - P4.3
      - P8.4
      parallel:
      - instrument: MAS outsourcing requirements
        relationship: same-population
        additional_step: 'None new — the principle is the same one. Test F3 and M3.14
          together so the vendor population yields one accountability answer rather
          than two.

          '
        confidence: SHAPE
      crosswalk_notes: 'Anchored in M1.1 and M1.3 — F3 cannot be tested standalone.
        If the board mandate does not reach AI decisions, there is nothing for individual
        accountability to hang from, and the F3 finding belongs at M1.1.

        '
  F4:
    severity: high
    lane_b_packs: []
    tests:
      design: 'Inspect the transparency assessment and customer disclosure standard
        against FEAT §C. Confirm disclosure is specified per stakeholder — customer,
        regulator, internal — and proportionate to materiality (ISO A.8.2, A.8.5;
        NIST MEASURE 2.8, 2.9).

        '
      operating: 'Sample customer-facing AIDA decisions. Confirm disclosure was made
        as the standard requires, that explanations are intelligible to the recipient
        rather than to the modeller, and that model cards at Play 3 Step 2 are current.
        Confirm Play 11 Step 1 disclosure notices are operating continuously where
        agents interact with customers, and that transparency was reviewed at Play
        8 per the sheet''s note.

        '
      population: 'Play 3 Step 2 model documentation; Play 4 Step 3 approvals; Play
        5 Step 2 and Play 8 reviews; Play 11 Step 1 disclosure notices.

        '

settings:
  elements_replace_artefacts: true
  prompt_boundary: false
  element_scopes:
  - model
test_controls:
  M1.1:
    severity: critical
    assurance_mode: human_only
    assurance_rationale: 'No deterministic Lane-B pack exists in v0.4; this control
      remains subject to explicit named human/document assurance until a machine-testable
      operating control is approved.

      '
    lane_b_packs: []
    tests:
      design: 'Inspect the board mandate and approved framework. Confirm AI risk is
        named in a board or board-committee charter rather than inferred from technology
        risk, that framework approval sits with a named body, and that the mandate
        distinguishes what senior management is accountable for from what it is informed
        of. ISO A.3.2 requires accountability to be explicitly assigned, so a mandate
        naming a committee without naming what it decides fails the design test.

        '
      operating: 'Confirm the framework and risk appetite were tabled for approval
        rather than noting, that the approving body was quorate, and that decisions
        are minuted with attendance. An item appearing only as information is the
        near-miss to look for.

        '
      population: 'Board and AI risk committee minutes and papers, per the control''s
        review cycle.

        '
      csa_pa:
      - PA 2
      - PA 6
      crosswalk_notes: 'MGF D2.1 | SAFR S1.2 — agent authority is bounded by what
        this mandate authorises. Where agents transact, test that the mandate reaches
        agent authority rather than stopping at model approval.

        '
  M1.2:
    severity: high
    lane_b_packs: []
    tests:
      design: 'Inspect the AI use policy. Confirm scope covers the AI in the inventory,
        that principles are stated as requirements with owners rather than aspirations,
        and that the policy names its approver and review cycle (ISO A.2.3, A.2.4).
        Per the sheet''s note, confirm the four FEAT principles map onto F1–F4 as
        their implementing controls — a principle with no implementing control is
        a policy statement, not a control.

        '
      operating: 'Confirm the version in force at each sampled date, that the review
        cycle was met, and that exceptions were approved at the authority the policy
        reserves them to. Test the mapping both ways: a change to a FEAT control should
        have been reflected upward, and a policy principle without an implementing
        control should have been raised.

        '
      population: 'Policy version history, exception register, and the F1–F4 control
        records.

        '
      csa_pa:
      - PA 2
  M1.3:
    severity: high
    lane_b_packs: []
    tests:
      design: 'Inspect terms of reference. Confirm membership spans the functions
        the forum needs in order to decide — risk, technology, business, compliance,
        legal — that it holds decision rights rather than advisory standing, and that
        escalation into and out of it is defined (ISO A.3.2; NIST GOVERN 2.1). PA
        4 frames this as a cross-functional forum able to evaluate and accelerate,
        so confirm it can say yes as well as no.

        '
      operating: 'Confirm the stated cadence was met, quorum was reached, decisions
        are recorded with owners and dates, and prior actions were closed or re-tabled.
        The committee is the decision-maker at Play 1 Step 4, Play 2 Step 5, Play
        4 Step 3, Play 5 Step 3, Play 8 Step 4 and Play 10 Step 5 — reconcile its
        minutes against those step outputs to test whether it decided what the plays
        say it decides.

        '
      population: 'Committee minutes and action logs, plus the six play step outputs
        above.

        '
      csa_pa:
      - PA 4
  M1.4:
    severity: high
    lane_b_packs: []
    tests:
      design: 'Inspect the risk appetite statement. Confirm AI risk is expressed in
        measurable terms rather than adjectives, that tolerance levels carry breach
        consequences, and that appetite is distinguished from capacity (ISO A.5.2;
        NIST GOVERN 1.3, MAP 1.5).

        '
      operating: 'Confirm appetite metrics were reported at the stated cadence, breaches
        were escalated per the statement, and any appetite change was approved by
        the body that owns it. The materiality routing at Play 1 Step 4 should be
        traceable to these tolerance levels; if routing thresholds and appetite are
        set independently, that is the finding.

        '
      population: 'Appetite reporting pack, breach log, and Play 1 Step 4 routing
        decisions.

        '
      csa_pa:
      - PA 4
  M1.5:
    severity: medium
    lane_b_packs: *id001
    tests:
      design: 'Inspect the training plan. Confirm it differentiates by role — board,
        model owners, first-line users, control functions — rather than a single all-staff
        module, that completion is mandated with a consequence, and that it addresses
        AI literacy and not only policy awareness (ISO A.3.3, A.4.6).

        '
      operating: 'Test completion against the mandated population, confirm non-completion
        was followed up, and confirm content was refreshed after material regulatory
        or internal change. Play 11 Step 2 produces training records on onboarding
        and on cadence for agentic operation — test that population separately, since
        agentic oversight training is where the gap usually sits.

        '
      population: 'Training records, course version history, and Play 11 Step 2 output.

        '
      play_refs:
      - P11.2
      csa_pa:
      - PA 2
  M2.1:
    severity: high
    lane_b_packs: []
    tests:
      design: 'Inspect the identification procedure. Confirm it defines what counts
        as AI for the organisation''s purposes, names who must identify it and when,
        and covers AI arriving embedded in vendor products rather than only AI the
        organisation builds (NIST MAP 1.1).

        '
      operating: 'Take a population independent of the inventory — procurement records,
        cloud service consumption, model-serving infrastructure — and test whether
        the AI in it was identified and reached Play 1 Step 1 as an intake form. Testing
        the inventory against itself proves nothing; the test is whether AI outside
        the intake process exists.

        '
      population: 'Procurement and vendor records and platform consumption data, reconciled
        against Play 1 Step 1 intake forms.

        '
      play_refs:
      - P1.1
      csa_pa:
      - PA 2
      - PA 7
  M2.2:
    severity: critical
    assurance_mode: lane_b
    assurance_rationale: 'Deterministic operating evidence is available through the
      declared Lane-B pack(s); document evidence remains available for Lane-A context.

      '
    lane_b_packs: *id002
    tests:
      design: 'Inspect the register. ISO A.4.2–A.4.5 covers the resources an AI system
        depends on — data, tooling, computing and human resources — so confirm the
        register captures dependencies and not only a list of models. Confirm each
        entry carries an owner, materiality, lifecycle status, and that the register
        defines who may add and retire entries. PA 7 goes further and requires a **continuous**
        inventory with **generated SBOMs**: confirm whether the standard requires
        a real bill of materials or a hand-maintained dependency list. Those are different
        artefacts and only one is verifiable.

        '
      operating: 'Test completeness both ways against Play 1 Step 2: sample deployed
        models and confirm an inventory entry exists; sample entries and confirm the
        model still exists and its status is current. Then test dependency currency
        — dependencies rot first and a model-only test never reaches them. Where SBOMs
        are produced, verify one against the running artefact rather than accepting
        its existence.

        '
      population: 'AI inventory register and Play 1 Step 2 entries, plus deployment
        records.

        '
      play_refs:
      - P1.2
      csa_pa:
      - PA 2
      - PA 7
      lane_b_candidate: 'SBOM generation and drift between SBOM and running artefact
        are machine-verifiable. This is the strongest candidate on the MAS sheet to
        move out of the judged lane into a Lane B control pack — a generated SBOM
        either matches or it does not.

        '
  M2.3:
    severity: critical
    assurance_mode: lane_b
    assurance_rationale: 'Deterministic operating evidence is available through the
      declared Lane-B pack(s); document evidence remains available for Lane-A context.

      '
    lane_b_packs: *id003
    tests:
      design: 'Inspect the materiality methodology. Confirm impact, complexity and
        reliance are defined with criteria a second assessor could apply to the same
        case and reach the same tier, and that inherent and residual are distinguished
        (ISO A.5.2–A.5.5).

        '
      operating: 'Sample Play 1 Step 3 materiality scores and rationales. Confirm
        each names an assessor and date, that the tier follows arithmetically from
        the recorded scores, and that Play 8 Step 1 updated materiality at the re-validation
        cadence. A tier no second assessor can reproduce from the recorded rationale
        is the near-miss.

        '
      population: 'Play 1 Step 3 scores and rationales; Play 8 Step 1 updated materiality.

        '
      play_refs:
      - P1.3
      - P8.1
      csa_pa:
      - PA 6
      crosswalk_notes: 'MGF D1.1, D1.2 | SAFR S1.5 — this tier drives agent risk tiering
        and threshold binding. Where agents are in scope, test that the tier propagated
        to the agent controls rather than stopping at the model.

        '
  M2.4:
    severity: high
    lane_b_packs: []
    tests:
      design: 'Inspect the lifecycle risk register. Confirm risks are captured at
        each lifecycle stage rather than only at inception, and that ownership and
        treatment are recorded (NIST MANAGE 1.1, 1.2).

        '
      operating: 'Sample Play 2 Step 1 impact analyses and Step 3 failure-mode registers.
        Confirm risks were re-assessed at stage transitions, treatments carry owners
        and dates, and overdue treatments were escalated. Test whether failure modes
        identified at Play 2 appear in the monitoring at Play 5 Step 1 — a failure
        mode nobody monitors was identified and then dropped.

        '
      population: 'Play 2 Steps 1 and 3; Play 5 Step 1 monitoring dashboard.

        '
      play_refs:
      - P2.1
      - P2.3
      csa_pa:
      - PA 6
  M3.1:
    severity: high
    lane_b_packs: []
    tests:
      design: 'Inspect data lineage and quality standards. Confirm provenance is recorded
        to source, representativeness against the intended population is assessed
        rather than assumed, and quality thresholds are defined with an action on
        breach (ISO A.7.2–A.7.6; NIST MAP 2.3).

        '
      operating: 'Sample Play 3 Step 1 data sign-offs. Confirm lineage is traceable
        to source for the training data actually used, quality checks ran at the stated
        frequency, and the sign-off addresses representativeness rather than only
        completeness.

        '
      population: 'Play 3 Step 1 data sign-offs and the underlying quality check output.

        '
      play_refs:
      - P3.1
      parallel:
      - instrument: PDPA / DPIA process
        relationship: same-population
        additional_step: 'None from this control. Play 2 Step 2 already routes the
          DPIA to the DPO, which is the right treatment — do not duplicate PDPA obligations
          inside an AI control test.

          '
        confidence: SHAPE
  M3.2:
    severity: high
    lane_b_packs: []
    tests:
      design: 'Inspect the fairness methodology. Confirm protected and proxy attributes
        are defined, that metrics and tolerances are set before testing rather than
        after, and that mitigation options are specified (NIST MEASURE 2.11). Per
        the sheet, this control carries the FEAT mapping that feeds M1.2 — confirm
        it is the implementing control for the fairness principle, not a parallel
        process.

        '
      operating: 'Sample Play 2 Step 1 impact analyses where fairness was triggered.
        Confirm metrics were computed against the defined tolerance, that a breach
        produced a recorded decision, and that fairness was re-tested after retraining.
        Cross-check against F1 — this control and F1 must not produce two different
        fairness answers for the same use case.

        '
      population: 'Play 2 Step 1 outputs and the F1 fairness assessment reports.

        '
      play_refs:
      - P2.1
  M3.3:
    severity: medium
    lane_b_packs: []
    tests:
      design: 'Inspect the model card standard. Confirm it requires intended use,
        limits, training data description and evaluation results, and that explainability
        is specified to the depth the use case needs rather than generically (ISO
        A.6.2.7, A.8.2; NIST MEASURE 2.8, 2.9).

        '
      operating: 'Sample Play 3 Step 2 model documentation. Confirm a current model
        card exists, matches the version deployed, and that explainability output
        is available to whoever must act on the decision rather than only to the modeller.

        '
      population: 'Play 3 Step 2 model documentation for deployed models.

        '
      play_refs:
      - P3.2
  M3.4:
    severity: critical
    assurance_mode: lane_b
    assurance_rationale: 'Deterministic operating evidence is available through the
      declared Lane-B pack(s); document evidence remains available for Lane-A context.

      '
    lane_b_packs: *id004
    tests:
      design: 'Inspect the human oversight policy. Confirm it defines where a human
        decides rather than reviews, what information the human receives, and what
        authority they hold to override — including whether the process proceeds if
        they do nothing. NIST MAP 3.5 requires oversight *capability* to be assessed,
        so confirm the policy addresses whether the human can actually exercise the
        authority given the volume and time available.

        '
      operating: 'Sample Play 4 Step 2 oversight and rollback plans, and Play 11 Step
        3 oversight-metrics reports. Confirm the human step occurred before the consequential
        action, overrides were recorded with reasons, and override rates are monitored.
        An oversight step nobody ever exercises is the finding — as is one where the
        rate is so high the human is rubber-stamping.

        '
      population: 'Play 4 Step 2 plans; Play 11 Step 3 monthly oversight-metrics reports.

        '
      play_refs:
      - P4.2
      - P11.3
  M3.5:
    severity: medium
    lane_b_packs: []
    tests:
      design: 'Inspect the selection standard. Confirm alternatives must be considered,
        that the rationale must address fitness for the stated use, and that rejecting
        a simpler model must be justified (NIST MAP 2.1, 3.3).

        '
      operating: 'Sample Play 3 Step 2 model documentation. Confirm a selection rationale
        exists, was recorded before build rather than reconstructed after, and addresses
        the alternatives considered.

        '
      population: 'Play 3 Step 2 model documentation.

        '
      play_refs:
      - P3.2
  M3.6:
    severity: critical
    assurance_mode: lane_b
    assurance_rationale: 'Deterministic operating evidence is available through the
      declared Lane-B pack(s); document evidence remains available for Lane-A context.

      '
    lane_b_packs: *id005
    tests:
      design: 'Inspect the validation standard. Confirm validation scope is defined,
        independence is defined structurally rather than by assertion, tiering is
        set by materiality, and re-validation triggers include vendor-pushed upgrades
        (ISO A.6.2.4; NIST MEASURE 1.3, 2.3, 2.5). PA 1 adds a dimension the standard
        often omits: whether the organisation runs security review across its own
        AI-generated code and pipelines.

        '
      operating: 'Sample Play 3 Step 3 test results and Step 4 validation reports.
        Confirm a validation outcome exists for the version deployed, the validator
        sits outside the developing function, and the outcome was recorded before
        the Play 4 Step 3 deployment approval with limitations and residual risk stated.
        Take Play 10 Step 3 test evidence for the stress and red-team dimension, which
        Play 3 does not cover.

        '
      population: 'Play 3 Steps 3 and 4; Play 10 Step 3; Play 8 Step 2 re-validation
        reports.

        '
      play_refs:
      - P3.3
      - P3.4
      - P10.3
      - P8.2
      csa_pa:
      - PA 1
      - PA 11
      parallel:
      - instrument: TRM Guidelines
        relationship: same-population
        additional_step: 'Independence of the validator from the developing function.
          A TRMG testing and UAT regime evidences that testing happened; it does not
          establish who performed the challenge or whether the opinion was issued
          without the builder''s agreement.

          '
        confidence: KNOWN
  M3.7:
    severity: critical
    assurance_mode: human_only
    assurance_rationale: 'No deterministic Lane-B pack exists in v0.4; this control
      remains subject to explicit named human/document assurance until a machine-testable
      operating control is approved.

      '
    lane_b_packs: []
    tests:
      design: 'Inspect the security standard as applied to AI. Test it against a **named
        threat catalogue** rather than a general description — the CSA crosswalk anchors
        this control to OWASP LLM Top 10 (LLM01 prompt injection, LLM05, LLM06 excessive
        agency, LLM08), MITRE ATLAS (AML.T0018, AML.T0047, AML.T0051.001) and ASI01–ASI03.
        A test written against a named catalogue is reproducible; one written against
        "model-specific exposure" is not. PA 8 additionally requires egress filtering,
        deep segmentation, zero trust and dependency hardening; PA 3 requires agents
        to be treated as privileged and insecure-by-default.

        '
      operating: 'Sample Play 3 Step 3 test results and Play 10 Steps 2 and 3 test
        plans and evidence. Confirm testing ran before deployment against the catalogue
        above, findings were tracked to closure or accepted risk, and re-testing occurred
        after material change. Then test **reachability directly**: confirm what the
        model or agent runtime can actually reach on the network and in data stores,
        not only what its identity is authorised to call. Egress filtering and segmentation
        are the control; an IAM policy is the intent.

        '
      population: 'Play 3 Step 3; Play 10 Steps 2 and 3; network egress and segmentation
        config.

        '
      play_refs:
      - P3.3
      - P10.2
      - P10.3
      csa_pa:
      - PA 1
      - PA 3
      - PA 8
      - PA 11
      parallel:
      - instrument: TRM Guidelines
        relationship: same-population
        additional_step: 'Model-specific threat classes. A TRMG security testing regime
          covers the application and infrastructure; it does not ask about prompt
          injection, model inversion, or leakage through model outputs.

          '
        confidence: KNOWN
      - instrument: MAS Notice 655 (Cyber Hygiene)
        relationship: same-population
        additional_step: 'None specific to AI. 655 obligations — multi-factor authentication,
          administrative account control, patching, malware protection, network perimeter
          — apply to the AI estate as to any other. Cite the existing 655 evidence
          rather than re-testing.

          '
        confidence: SHAPE
      crosswalk_notes: 'SAFR S1.3, S1.4 — policy repository and pre-execution check.
        Where agents act, extend the operating test to whether the runtime actually
        queries the policy repository before executing. That is a test on the agent,
        not on the model.

        '
  M3.8:
    severity: high
    lane_b_packs: []
    tests:
      design: 'Inspect logging standards. Confirm what is logged is sufficient to
        reconstruct a decision after the fact — inputs, model version, output, human
        action — and that retention meets the period over which the decision may be
        challenged (ISO A.6.2.8; NIST MEASURE 2.1, MANAGE 4.1). MANAGE 4.1 reaches
        feedback and appeal mechanisms, so confirm the log supports answering a customer
        challenge, not only an internal one.

        '
      operating: 'Select decisions and attempt reconstruction from the logs alone.
        Reconstruction is the test; the existence of a logging standard is not. Confirm
        logs are tamper-evident and retained per standard, and that Play 5 Step 1
        monitoring draws on the same log rather than a separate metrics store that
        could diverge.

        '
      population: 'Decision logs across the retention period; Play 3 Step 2 and Play
        5 Step 1.

        '
      play_refs:
      - P3.2
      - P5.1
      parallel:
      - instrument: TRM Guidelines
        relationship: same-population
        additional_step: 'Decision reconstruction. A TRMG audit-trail test establishes
          that system events are logged and retained; it does not test whether a specific
          AI-driven decision can be reconstructed and explained to the person it affected.

          '
        confidence: KNOWN
      source_caution: 'Cites MindForge AI Risk Management Toolkit (Mar 2026), not
        available to the drafter. The toolkit may specify logging fields this test
        does not cover.

        '
  M3.9:
    severity: critical
    assurance_mode: human_only
    assurance_rationale: 'No deterministic Lane-B pack exists in v0.4; this control
      remains subject to explicit named human/document assurance until a machine-testable
      operating control is approved.

      '
    lane_b_packs: []
    tests:
      design: 'Inspect release criteria. Confirm the gate has objective pass conditions,
        the approver is named by role, and approval is required before rather than
        alongside deployment (ISO A.6.2.5).

        '
      operating: 'Sample Play 4 Step 1 release checklists and Step 3 signed deployment
        approvals. Confirm the approval timestamp predates the first production action,
        the approver held the authority, and any release that bypassed the gate was
        escalated. Per the plays sheet note, confirm no high-materiality model released
        without FEAT section D validation.

        '
      population: 'Play 4 Steps 1 and 3, reconciled against deployment logs.

        '
      play_refs:
      - P4.1
      - P4.3
  M3.10:
    severity: high
    lane_b_packs: *id006
    tests:
      design: 'Inspect the monitoring standard. Confirm drift, performance and stability
        metrics are defined with thresholds and an owner, that alerting routes to
        someone who can act, and that revalidation and backtesting cadence is set
        by materiality (ISO A.6.2.6; NIST MEASURE 2.4, 3.1, MANAGE 4.1). Confirm the
        model''s **recovery objective is inherited from the business service it supports**
        rather than set locally — the 4-hour RTO recorded against M3.11 is a continuity
        parameter, not a monitoring one.

        '
      operating: 'Sample Play 5 Step 1 monitoring dashboards and Step 2 periodic re-check
        notes. Confirm monitoring ran continuously rather than at review points, that
        threshold breaches produced a recorded response, and that suppressed or muted
        alerts were reviewed. A critical model whose alerts are suppressed is monitored
        on paper only. Confirm model failure was included in continuity testing for
        the services that depend on it.

        '
      population: 'Play 5 Steps 1 and 2; alert history and suppression records; Play
        11 Step 3.

        '
      play_refs:
      - P5.1
      - P5.2
      - P11.3
      csa_pa:
      - PA 6
      parallel:
      - instrument: BCM requirements
        relationship: same-population
        additional_step: 'Whether the model is in the dependency map for the business
          service, and whether its failure has been exercised in continuity testing.
          A BCM test that never enumerated the model will not have covered it.

          '
        confidence: SHAPE
      source_caution: 'Cites MindForge AI Risk Management Toolkit (Mar 2026), not
        available to the drafter.

        '
  M3.11:
    severity: critical
    assurance_mode: human_only
    assurance_rationale: 'No deterministic Lane-B pack exists in v0.4; this control
      remains subject to explicit named human/document assurance until a machine-testable
      operating control is approved.

      '
    lane_b_packs: []
    tests:
      design: 'Inspect the incident playbook. Confirm it defines what constitutes
        an AI incident as distinct from an application defect, and that it carries
        the regulatory clocks the sheet records: notification to MAS within **1 hour**
        of discovering a relevant incident, root-cause and impact report within **14
        days**, and a **4-hour RTO** for critical systems, per FSM-N05 (eff. 10 May
        2024, superseding Notices 644 / 127 / PSN05). Confirm the exact FSM notice
        reference for the licence type — the sheet flags this as unconfirmed. MAS
        Notice 655 Cyber Hygiene is a separate instrument. Then confirm the playbook
        **determines, at classification, whether the affected system is CII-designated**,
        and routes to the Commissioner of Cybersecurity as well as to MAS where it
        is. Play 6 Step 4''s recorded output is "MAS notification (≤1 hr); RCA & impact
        report" — a single path — so the playbook itself may carry this gap. PA 10
        adds a dimension: whether detection is engineered and response automated.
        For agentic systems that is the difference between a 1-hour clock being achievable
        and being aspirational.

        '
      operating: 'Three populations. Tested separately the sample is self-selecting.
        (a) Incidents classified as AI incidents: sample Play 6 Step 2 classifications
        and Step 4 notification records. Measure elapsed time from **discovery** to
        notification against the 1-hour clock, and corroborate the discovery timestamp
        independently — discovery is what organisations get wrong, because the clock
        starts before anyone opens a ticket. Confirm the 14-day RCA landed and the
        4-hour RTO was met for critical systems. (b) Incidents not so classified:
        sample application defect and problem tickets for model-behaviour symptoms.
        A model incident logged as a defect never enters population (a), so the notification
        test passes while the control fails. (c) Incidents touching CII-designated
        systems: confirm both notification paths ran, on their own clocks. Passing
        the MAS test proves nothing about the second obligation.

        '
      population: 'Play 6 Steps 1, 2 and 4; the application defect and problem ticket
        queues for the same period; and the CII asset register for stratum (c).

        '
      play_refs:
      - P6.1
      - P6.2
      - P6.4
      csa_pa:
      - PA 10
      parallel:
      - instrument: Cybersecurity Act — CII regime
        relationship: separate-clock
        additional_step: 'Where an AI system supports a designated CII, notification
          runs to the Commissioner of Cybersecurity on its own timeline, with its
          own trigger definition, alongside periodic audit and risk assessment obligations.
          Different recipient, different clock. An incident can be notified to MAS
          on time and to the Commissioner late while every MAS-facing test passes.

          '
        confidence: SHAPE
      - instrument: TRM Guidelines
        relationship: same-population
        additional_step: 'AI incident definition. A TRMG incident regime handles severity,
          escalation and RCA; it does not define model-behaviour failure as an incident
          class, which is what causes such incidents to be logged as defects.

          '
        confidence: KNOWN
  M3.12:
    severity: high
    assurance_mode: lane_b
    assurance_rationale: 'Deterministic operating evidence is available through the
      declared Lane-B pack(s); document evidence remains available for Lane-A context.

      '
    lane_b_packs: *id007
    tests:
      design: 'Inspect the change standard as it applies to models. Confirm retraining,
        threshold adjustment and decommissioning are in scope as changes, that emergency
        change is defined with a ratification window, and that freeze exemption authority
        is named (ISO A.6.2.2, A.6.2.6; NIST MANAGE 2.2, 4.2). PA 5 frames the forward
        risk: capacity to triage and deploy a flood of AI-related patches, including
        vendor-pushed model updates.

        '
      operating: 'Sample across three populations — normal, emergency, and changes
        implemented inside a declared freeze. Confirm authorisation predates the first
        production action, that privileged access reconciles to the approved change
        number with no standing accounts, that the person who used it is a named implementer
        on that change, and that production state was verified against the approved
        plan with deviations approved rather than closed silently. Reconcile against
        Play 8 Step 2 re-validation where the change was material enough to require
        it.

        '
      population: 'Change register for the model-serving estate, PAM checkout records
        and session recordings, one quarter, full population where small enough; Play
        8 Steps 2 and 4.

        '
      play_refs:
      - P8.2
      - P8.4
      csa_pa:
      - PA 5
      parallel:
      - instrument: TRM Guidelines
        relationship: same-population
        additional_step: 'Whether **retraining** is treated as a change. This is the
          whole of the AI-specific addition. A TRMG change-and-access test on the
          model-serving estate — authorisation, privileged access reconciliation,
          session recording, post-implementation verification — will pass without
          ever asking it, because retraining does not look like a release. Cite the
          existing TRMG evidence for the access and authorisation limbs rather than
          re-performing them.

          '
        confidence: KNOWN
      - instrument: MAS Notice 655 (Cyber Hygiene)
        relationship: same-population
        additional_step: 'None. The administrative-account and privileged-access obligations
          overlap the PAM limb of this test; cite the 655 evidence.

          '
        confidence: SHAPE
  M3.13:
    severity: medium
    lane_b_packs: []
    tests:
      design: 'Inspect the decommissioning checklist. Confirm it covers dependent
        systems, data retention and deletion, access removal, inventory retirement,
        and communication to consumers of the model''s output (ISO A.6.2.6; NIST GOVERN
        1.7, MANAGE 2.4). PA 7 frames decommissioning as attack-surface reduction,
        so confirm the checklist reduces surface rather than only recording closure.

        '
      operating: 'Sample Play 9 outputs — Step 1 phase-out plan, Step 2 data disposal
        record, Step 3 access-removal log, Step 4 archive and inventory update. Confirm
        the inventory entry was retired rather than left stale, and that access removal
        actually completed. A model retired in the register whose service account
        still authenticates is the near-miss. Verify dependency severance against
        the **dependency map used for continuity**, not only against the inventory
        entry.

        '
      population: 'Play 9 Steps 1–4; inventory history; access records; BCM dependency
        map.

        '
      play_refs:
      - P9.1
      - P9.2
      - P9.3
      - P9.4
      csa_pa:
      - PA 7
      parallel:
      - instrument: BCM requirements
        relationship: same-population
        additional_step: 'Whether the continuity dependency map was updated on retirement.
          A stale map is a continuity finding that surfaces only in an incident.

          '
        confidence: SHAPE
  M3.14:
    severity: high
    lane_b_packs: []
    tests:
      design: 'Inspect vendor due diligence standards and contract templates. Confirm
        they address AI specifically — change notification, evaluation rights, sub-processor
        and model provenance, exit — and that risk tiering drives diligence depth
        (ISO A.10.2–A.10.4; NIST GOVERN 6.1, 6.2, MANAGE 3.1, 3.2). Then confirm the
        process **determines whether the arrangement is outsourcing, and if so whether
        it is material outsourcing**, and routes it to the existing outsourcing register
        rather than running a parallel AI-only assessment. A foundation-model provider
        serving a customer-affecting decision is a candidate material outsourcing
        arrangement.

        '
      operating: 'Sample Play 7 outputs. Confirm Step 1 due diligence preceded Step
        2 contract signature, that AI-specific clauses are present in the executed
        contract, that Step 3 recorded concentration and versioning, and that Step
        4''s vendor monitoring plan is operating. Test whether a vendor-pushed model
        change was notified and assessed — the trigger almost nobody has wired in.
        **Reconcile the AI vendor population against the outsourcing register in both
        directions.** An AI service that never reached the register is the finding,
        and it is more serious than a missing contract clause.

        '
      population: 'Play 7 Steps 1–4; vendor change notifications for the period; the
        outsourcing register and its material-outsourcing classifications.

        '
      play_refs:
      - P7.1
      - P7.2
      - P7.3
      - P7.4
      csa_pa:
      - PA 3
      parallel:
      - instrument: MAS outsourcing requirements
        relationship: additional-obligation
        additional_step: 'Register entry, material-outsourcing classification, notification
          or consultation where material, audit and inspection rights, and exit planning.
          None of these are reached by an AI due-diligence test. Test the routing
          into the register, not the register itself.

          '
        confidence: SHAPE
      crosswalk_notes: 'F3 records third-party model accountability as non-delegable
        — the same principle as outsourcing not transferring accountability. Test
        the two together or they will produce two accountability answers for the same
        vendor.

        '
  M3.15:
    severity: critical
    assurance_mode: lane_b
    assurance_rationale: 'Deterministic operating evidence is available through the
      declared Lane-B pack(s); document evidence remains available for Lane-A context.

      '
    lane_b_packs: *id008
    tests:
      design: 'This is the agentic hinge. The sheet links it to **all** of MGF D1–D4
        and SAFR S1–S4, where every other control links to a handful. So the design
        test is not whether an assessment document exists but whether the assessment
        **routes**: confirm that identifying a use case as generative or agentic brings
        the D and S control sets into scope, with a defined trigger and a named owner
        for that scoping decision. An assessment that concludes in a rating and routes
        nowhere fails however thorough it is.

        '
      operating: 'Take the GenAI and agentic use cases in the inventory and test coverage:
        for each, confirm the D and S controls are in scope and have an assessment
        status, not merely that a risk assessment exists. Then test concentration
        directly — trace how many in-scope use cases depend on a single foundation-model
        provider, and confirm that exposure is reported somewhere a decision could
        be taken on it. Sample Play 10 Steps 1 to 5 for the stress and red-team cycle,
        and confirm Step 5 committee sign-off closed the loop.

        '
      population: 'GenAI and agentic entries in the AI inventory; the MGF and SAFR
        libraries'' coverage for those entries; Play 10 Steps 1–5.

        '
      play_refs:
      - P10.1
      - P10.2
      - P10.3
      - P10.4
      - P10.5
      csa_pa:
      - PA 3
      source_caution: 'Cites MindForge AI Risk Management Toolkit (Mar 2026), not
        available to the drafter. The toolkit may define GenAI risk categories this
        test does not cover.

        '
  M4.1:
    severity: medium
    lane_b_packs: []
    tests:
      design: 'Inspect the capability plan. Confirm required competencies are defined
        by role, current state is assessed against them, and gaps carry funded remediation
        rather than an intention (ISO A.4.6; NIST GOVERN 2.2). PA 11 frames the specific
        ask: a permanent, staffed vulnerability operations function rather than a
        project.

        '
      operating: 'Confirm the assessment was refreshed at the stated cadence, hiring
        or training followed the identified gaps, and control functions were resourced
        to the volume of AI in the inventory. Reconcile in-scope model count against
        second-line headcount — validation capacity against pipeline is where M3.6''s
        independence requirement fails in practice.

        '
      population: 'Capability assessment, resourcing records, and the AI inventory
        count.

        '
      csa_pa:
      - PA 11
  M4.2:
    severity: medium
    lane_b_packs: []
    tests:
      design: 'Inspect the infrastructure plan. Confirm capacity is planned against
        forecast AI workload, that environments support testing in production-like
        conditions, and that monitoring and logging tooling is provisioned rather
        than assumed (ISO A.4.4, A.4.5; NIST MAP 1.6). PA 5 adds deployment capacity
        for a sustained patch flow.

        '
      operating: 'Confirm capacity was reviewed against actual consumption, constraints
        were escalated, and pre-production environments were available when Play 3
        validation required them. An integration or UAT step skipped for want of an
        environment shows up here, not in M3.6.

        '
      population: 'Capacity reporting, environment availability records, Play 3 Step
        3 evidence.

        '
      csa_pa:
      - PA 5
      - PA 11
  F1:
    severity: critical
    assurance_mode: human_only
    assurance_rationale: 'No deterministic Lane-B pack exists in v0.4; this control
      remains subject to explicit named human/document assurance until a machine-testable
      operating control is approved.

      '
    lane_b_packs: []
    tests:
      design: 'Inspect the fairness assessment standard against the FEAT Assessment
        Methodology (Veritas-aligned) **§A**, and the **§D** validation route for

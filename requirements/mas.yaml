      - P4.3
      - P5.2
      - P8.3
  F2:
    severity: high
    lane_b_packs: []
    tests:
      design: 'Inspect the ethics attestation process against FEAT §B. Confirm the
        organisation''s ethical standards are written and specific enough to attest
        against, and that the attester is senior enough to bind the function. Per
        the sheet, principles are set at org level and confirmed per use case at Play
        2 — confirm both layers exist.

        '
      operating: 'Sample Play 2 Step 5 signed impact assessments and Play 4 Step 3
        approvals. Confirm the attestation was made at the defined trigger by a named

controls:
  M1.1:
    requirement: Senior management and the accountable AI governance body establish
      and maintain AI-risk accountability, approve the AI risk framework and appetite,
      and retain material AI-risk decision rights.
    elements:
    - id: e1
      text: A named senior-management or governance body has an approved mandate covering
        AI risk oversight.
      scope: programme
    - id: e2
      text: The AI risk-management framework and applicable risk appetite/tolerances
        are formally approved and current.
      scope: programme
    - id: e3
      text: Material AI-risk decisions, escalations and approvals are attributable
        to an accountable role and retained.
      scope: programme
    boundary:
      none: The control requirement is not evidenced beyond generic intent, policy
        aspiration or unrelated material.
      partial: Some applicable requirement elements are evidenced, but one or more
        required elements or operating evidence is missing or incomplete.
      full: All applicable requirement elements are evidenced with current, attributable
        and sufficient design or operating evidence; no material mandatory element
        remains unsubstantiated.
    source:
    - instrument: AIRG Consultation Paper P017-2025 (Nov 2025, proposed)
      note: Source basis stated in the governed MAS workbook; this is an operational
        interpretation, not verbatim regulatory text.
      confidence: workbook_declared
    - instrument: AI MRM Paper (Dec 2024)
      note: Source basis stated in the governed MAS workbook; this is an operational
        interpretation, not verbatim regulatory text.
      confidence: workbook_declared
    rationale: 'Operationalised from workbook expectation: Board & senior management
      accountability for AI risk (risk appetite, framework approval).'
    assurance_mode: human_only
    severity: critical

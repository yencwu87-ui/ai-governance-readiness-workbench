<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Governance engine operating model</title>
  <desc id="d">Evidence feeds two independent reads — an AI assessor and a named reviewer, whose read is recorded blind. A deterministic compare step diffs them element by element, a scoped challenger attacks the disagreement, and only a human writes the decision record.</desc>

  <rect width="1200" height="660" fill="#0d1117"/>
  <rect x="16" y="16" width="1168" height="628" rx="18" fill="#0f1a17" stroke="#2a3f38" stroke-width="1.5"/>

  <text x="44" y="58" fill="#6b7f78" font-size="15">ai-governance-readiness-workbench</text>
  <text x="1156" y="58" text-anchor="end" fill="#5dcaa5" font-size="15">AI proposes · controls constrain · a human decides</text>
  <line x1="44" y1="76" x2="1156" y2="76" stroke="#2a3f38" stroke-width="1"/>

  <rect x="44" y="150" width="150" height="66" rx="8" fill="#132420" stroke="#2a3f38"/>
  <text x="119" y="180" text-anchor="middle" fill="#e6edf3" font-size="15">Evidence</text>
  <text x="119" y="200" text-anchor="middle" fill="#6b7f78" font-size="12">folder or one control</text>

  <path d="M194 172 h46 v-52 h52" stroke="#5dcaa5" stroke-width="1.6" fill="none"/>
  <path d="M194 196 h46 v116 h52" stroke="#5dcaa5" stroke-width="1.6" fill="none"/>

  <rect x="292" y="86" width="210" height="72" rx="8" fill="#13212e" stroke="#2b4a63"/>
  <text x="397" y="114" text-anchor="middle" fill="#85b7eb" font-size="15">Assess with AI</text>
  <text x="397" y="134" text-anchor="middle" fill="#6b7f78" font-size="12">rating + element verdicts</text>
  <text x="397" y="150" text-anchor="middle" fill="#f0b429" font-size="12">result held hidden</text>

  <rect x="292" y="280" width="210" height="64" rx="8" fill="#132420" stroke="#2a3f38"/>
  <text x="397" y="308" text-anchor="middle" fill="#e6edf3" font-size="15">Your read</text>
  <text x="397" y="328" text-anchor="middle" fill="#6b7f78" font-size="12">recorded blind, per element</text>

  <path d="M502 122 h56 v64 h34" stroke="#5dcaa5" stroke-width="1.6" fill="none"/>
  <path d="M502 312 h56 v-96 h34" stroke="#5dcaa5" stroke-width="1.6" fill="none"/>

  <rect x="592" y="164" width="186" height="76" rx="8" fill="#132420" stroke="#5dcaa5" stroke-width="1.4"/>
  <text x="685" y="192" text-anchor="middle" fill="#5dcaa5" font-size="15">Compare</text>
  <text x="685" y="212" text-anchor="middle" fill="#6b7f78" font-size="12">element by element</text>
  <text x="685" y="230" text-anchor="middle" fill="#6b7f78" font-size="12">no model call</text>

  <path d="M778 202 h44" stroke="#5dcaa5" stroke-width="1.6" fill="none"/>
  <rect x="822" y="164" width="186" height="76" rx="8" fill="#1f1a22" stroke="#4a3a52"/>
  <text x="915" y="192" text-anchor="middle" fill="#af9fec" font-size="15">Challenge</text>
  <text x="915" y="212" text-anchor="middle" fill="#6b7f78" font-size="12">scoped to the disagreement</text>
  <text x="915" y="230" text-anchor="middle" fill="#6b7f78" font-size="12">never rates, never agrees</text>

  <path d="M915 240 v78 h-42" stroke="#5dcaa5" stroke-width="1.6" fill="none"/>
  <path d="M685 240 v78 h42" stroke="#5dcaa5" stroke-width="1.6" fill="none"/>

  <rect x="592" y="286" width="282" height="64" rx="8" fill="#132420" stroke="#f0b429" stroke-width="1.4"/>
  <text x="733" y="314" text-anchor="middle" fill="#f0b429" font-size="15">Human final gate</text>
  <text x="733" y="334" text-anchor="middle" fill="#6b7f78" font-size="12">the only step that writes</text>

  <path d="M874 318 h58 v76" stroke="#5dcaa5" stroke-width="1.6" fill="none"/>
  <rect x="842" y="394" width="180" height="64" rx="8" fill="#132420" stroke="#2a3f38"/>
  <text x="932" y="422" text-anchor="middle" fill="#e6edf3" font-size="15">Decision record</text>
  <text x="932" y="442" text-anchor="middle" fill="#6b7f78" font-size="12">append-only, reasoned</text>

  <line x1="44" y1="392" x2="800" y2="392" stroke="#2a3f38" stroke-width="1"/>
  <text x="44" y="424" fill="#6b7f78" font-size="13">GOVERNED INPUTS — read by the assessor and the challenger, never by the gate</text>

  <rect x="44" y="440" width="176" height="58" rx="6" fill="#111d1a" stroke="#2a3f38"/>
  <text x="132" y="464" text-anchor="middle" fill="#e6edf3" font-size="13">Control contract</text>
  <text x="132" y="482" text-anchor="middle" fill="#6b7f78" font-size="11">elements · boundary</text>

  <rect x="232" y="440" width="176" height="58" rx="6" fill="#111d1a" stroke="#2a3f38"/>
  <text x="320" y="464" text-anchor="middle" fill="#e6edf3" font-size="13">ToD / ToE</text>
  <text x="320" y="482" text-anchor="middle" fill="#6b7f78" font-size="11">test procedures</text>

  <rect x="420" y="440" width="176" height="58" rx="6" fill="#111d1a" stroke="#2a3f38"/>
  <text x="508" y="464" text-anchor="middle" fill="#e6edf3" font-size="13">Near-miss bank</text>
  <text x="508" y="482" text-anchor="middle" fill="#6b7f78" font-size="11">what looks right</text>

  <rect x="608" y="440" width="176" height="58" rx="6" fill="#111d1a" stroke="#2a3f38"/>
  <text x="696" y="464" text-anchor="middle" fill="#e6edf3" font-size="13">Knowledge brain</text>
  <text x="696" y="482" text-anchor="middle" fill="#6b7f78" font-size="11">advisory only</text>

  <line x1="44" y1="528" x2="1156" y2="528" stroke="#2a3f38" stroke-width="1"/>
  <text x="44" y="558" fill="#6b7f78" font-size="13">DETERMINISTIC CONSTRAINTS — applied after every model call, downgrade only</text>
  <text x="44" y="584" fill="#5dcaa5" font-size="13">▸ a quote not in the evidence is dropped, never softened</text>
  <text x="44" y="606" fill="#5dcaa5" font-size="13">▸ an element neither side decided is unset, never agreement</text>
  <text x="620" y="584" fill="#5dcaa5" font-size="13">▸ below the evidence floor a PASS becomes NOT_TESTABLE</text>
  <text x="620" y="606" fill="#5dcaa5" font-size="13">▸ a failed call is an error, never a rating of none</text>
</svg>

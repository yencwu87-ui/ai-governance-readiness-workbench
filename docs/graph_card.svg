<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="SFMono-Regular, Menlo, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1400" height="560" fill="#0d1117"/>
  <rect x="20" y="20" width="1360" height="520" rx="18" fill="#0f1a17" stroke="#2a3f38" stroke-width="1.5"/>
  <circle cx="58" cy="58" r="9" fill="#ff5f57"/><circle cx="86" cy="58" r="9" fill="#febc2e"/><circle cx="114" cy="58" r="9" fill="#28c840"/>
  <text x="560" y="63" text-anchor="end" fill="#6b7f78" font-size="17">ai-governance-readiness-workbench</text>
  <line x1="590" y1="45" x2="590" y2="515" stroke="#2a3f38" stroke-width="1"/>

  <text x="60" y="118" fill="#e6edf3" font-size="19"><tspan fill="#5dcaa5">$</tspan> graphify path "propose()" "write_back()"</text>
  <text x="60" y="152" fill="#f0b429" font-size="17">No directed path found between</text>
  <text x="60" y="176" fill="#f0b429" font-size="17">'propose()' and 'write_back()'.</text>

  <text x="60" y="232" fill="#e6edf3" font-size="19"><tspan fill="#5dcaa5">$</tspan> graphify path "export_playbook()" "write_back()"</text>
  <text x="60" y="266" fill="#8b9a94" font-size="17">Shortest path (1 hops):</text>
  <text x="80" y="296" fill="#5dcaa5" font-size="18">export_playbook()</text>
  <text x="104" y="324" fill="#8b9a94" font-size="17">--calls [EXTRACTED]--&gt; <tspan fill="#5dcaa5">write_back()</tspan></text>

  <text x="60" y="392" fill="#f0b429" font-size="16">the assessor has no route to the playbook</text>
  <text x="60" y="416" fill="#8b9a94" font-size="16">the only writer is export_playbook(), fed by record_decision()</text>
  <text x="60" y="440" fill="#8b9a94" font-size="16">a human sits between propose() and record_decision()</text>
  <text x="60" y="490" fill="#5a6a64" font-size="14">edges: tree-sitter AST, --code-only, every edge EXTRACTED</text>

  <!-- graph: faint edges -->
  <g stroke="#2f4a42" stroke-width="2" fill="none">
    <line x1="700" y1="330" x2="820" y2="220"/>
    <line x1="820" y1="220" x2="960" y2="300"/>
    <line x1="960" y1="300" x2="1010" y2="420"/>
    <line x1="1010" y1="420" x2="1100" y2="480"/>
    <line x1="700" y1="330" x2="760" y2="470"/>
    <line x1="760" y1="470" x2="820" y2="220"/>
  </g>
  <!-- highlighted chain -->
  <g stroke="#5dcaa5" stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="1180" y1="230" x2="1300" y2="330"/>
  </g>
  <g stroke="#3d9c83" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="960" y1="300" x2="1010" y2="420"/>
    <line x1="1010" y1="420" x2="1100" y2="480"/>
  </g>
  <!-- the gap -->
  <line x1="990" y1="290" x2="1150" y2="238" stroke="#f0b429" stroke-width="2.5" stroke-dasharray="6 9" opacity="0.9"/>
  <text x="1060" y="240" fill="#f0b429" font-size="15" text-anchor="middle">no edge — human</text>

  <!-- nodes -->
  <g>
    <circle cx="700" cy="330" r="8" fill="#3d6b5f"/><text x="700" y="362" fill="#8b9a94" font-size="16" text-anchor="middle">index_folder</text>
    <circle cx="760" cy="470" r="8" fill="#3d6b5f"/><text x="760" y="500" fill="#8b9a94" font-size="16" text-anchor="middle">scan_documents</text>
    <circle cx="820" cy="220" r="8" fill="#3d6b5f"/><text x="820" y="200" fill="#8b9a94" font-size="16" text-anchor="middle">match_controls</text>
    <circle cx="960" cy="300" r="11" fill="#5dcaa5"/><text x="960" y="282" fill="#e6edf3" font-size="18" font-weight="bold" text-anchor="middle">propose</text>
    <circle cx="1010" cy="420" r="9" fill="#5dcaa5"/><text x="985" y="450" fill="#e6edf3" font-size="16" text-anchor="middle">assess</text>
    <circle cx="1100" cy="480" r="9" fill="#5dcaa5"/><text x="1100" y="512" fill="#e6edf3" font-size="16" text-anchor="middle">_validate</text>
    <circle cx="1180" cy="230" r="11" fill="#5dcaa5"/><text x="1180" y="205" fill="#e6edf3" font-size="18" font-weight="bold" text-anchor="middle">record_decision</text>
    <circle cx="1300" cy="330" r="11" fill="#5dcaa5"/><text x="1300" y="365" fill="#e6edf3" font-size="18" font-weight="bold" text-anchor="middle">write_back</text>
    <text x="1300" y="388" fill="#8b9a94" font-size="14" text-anchor="middle">via export_playbook</text>
  </g>
</svg>

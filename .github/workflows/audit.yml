# Lane B in CI. Lives at <git root>/.github/workflows/audit.yml (NOT inside repo/).
#
# On push to main:   run on_commit controls, block on high/critical FAIL not covered by an open exception.
# Nightly 02:00 SGT: run scheduled controls.
# Every run:         commit the bundle + inventory to the `evidence` branch (record of audit).
#
# One-time setup after first push: Settings → Branches → add rule for `evidence`:
#   - Restrict deletions, Block force pushes. Nobody can rewrite the record quietly after that.

name: continuous-ai-audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for the git_log adapter

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml jsonschema

      - name: Run audit (push -> on_commit, gated)
        if: github.event_name == 'push'
        run: python -m caa.runner --target . --trigger on_commit --fail-on high

      - name: Run audit (scheduled / manual -> full)
        if: github.event_name != 'push'
        run: python -m caa.runner --target . --trigger ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}

      - name: Record evidence on the evidence branch
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          [ -d repo/evidence/bundles ] || { echo "no bundle produced"; exit 0; }
          git config user.name "caa-runner"
          git config user.email "caa-runner@users.noreply.github.com"
          if git fetch origin evidence:evidence 2>/dev/null; then :; else
            git branch evidence $(git commit-tree $(git hash-object -t tree /dev/null) -m "evidence root")
          fi
          git worktree add ../evidence evidence
          mkdir -p ../evidence/bundles ../evidence/inventories
          cp repo/evidence/bundles/*.json ../evidence/bundles/
          cp repo/evidence/inventories/*.json ../evidence/inventories/
          cd ../evidence
          git add -A
          git commit -m "audit ${{ github.event_name }} @ ${{ github.sha }}" || echo "nothing new"
          git push origin evidence

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ github.run_id }}
          path: repo/evidence/

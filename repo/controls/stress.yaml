# Play 10 — Stress-Test / Red-Team Cycle. Evidence source: the playbook's Stress-Test Tracker.
# Lane B tests that the cycle is happening on cadence and before releases; Lane A judges test quality.

- id: STR-01
  domain: stress-testing
  objective: Every hotspot is stress-tested on its stated cadence
  assertion: Each tracker row has a last-run date within the days implied by its cadence
  framework_refs: [NIST-AI-RMF-MEASURE-2.6, NIST-AI-RMF-MEASURE-2.7, MAS-AIRG-M3.6, MAS-AIRG-M3.15]
  play_refs: [P10.3]
  inputs:
    - source: stress_tracker
      fields: [hotspot, cadence, last_run, max_days]
  check: recency_each
  params:
    source: stress_tracker
    field: last_run
    max_days_field: max_days
  human_gate: Reviewer confirms the recorded run exercised the failure mode, not a smoke test.
  frequency: weekly
  severity: high

- id: STR-02
  domain: stress-testing
  objective: Failed stress tests are scheduled for re-test
  assertion: Every hotspot whose last result is Fail has a next-run date
  framework_refs: [NIST-AI-RMF-MANAGE-1.3, MAS-AIRG-M3.15]
  play_refs: [P10.4]
  inputs:
    - source: stress_tracker
      fields: [hotspot, result, next_run]
  check: field_present
  params:
    source: stress_tracker
    fields: [next_run]
    where: {field: result, equals: fail}
  human_gate: Reviewer checks a remediation item exists for the failure, not only a re-test date.
  frequency: weekly
  severity: medium

- id: STR-03
  domain: stress-testing
  objective: Releases are preceded by a stress-test run
  assertion: Each deployment is preceded by at least one tracker run within the prior 100 days
  framework_refs: [NIST-AI-RMF-MEASURE-2.6, MAS-AIRG-M3.6]
  play_refs: [P10.1, P4.1]
  inputs:
    - source: stress_tracker
      fields: [last_run]
    - source: deploy_manifest
      fields: [version, deployed_at]
  check: preceded_within
  params:
    earlier: {source: stress_tracker, field: last_run}
    later: {source: deploy_manifest, field: deployed_at}
    max_days: 100
  human_gate: Reviewer confirms the hotspots run were the ones relevant to what changed in that release.
  frequency: on_deploy
  severity: high

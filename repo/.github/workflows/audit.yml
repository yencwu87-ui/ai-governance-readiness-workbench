# Lane B in CI. On every push: run on_commit controls and block on critical FAIL.
# Nightly: run scheduled controls. Bundles are uploaded as artefacts; move them to
# an evidence branch or object store once you decide where the record of audit lives.
name: continuous-ai-audit
on:
  push:
  schedule:
    - cron: "0 18 * * *"   # 02:00 SGT
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # full history for git_log adapter
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml jsonschema
      - name: on_commit controls (gate)
        if: github.event_name == 'push'
        run: python -m caa.runner --target . --trigger on_commit --fail-on critical
      - name: scheduled controls
        if: github.event_name == 'schedule'
        run: python -m caa.runner --target . --trigger scheduled
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: evidence-${{ github.run_id }}, path: evidence/}
